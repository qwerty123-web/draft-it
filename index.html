<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DraftIt: WhatsApp deals to signed agreements</title>
<meta name="description" content="Turn WhatsApp deals, voice notes and bills into clear, signed agreements that hold up in India. Six languages.">
<meta name="theme-color" content="#0B2E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DraftIt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>/* DraftIt. Uber-inspired: white pages, black bars and buttons, dark blue accents, big bold type,
   large touch targets. Sizes are in rem so the Text size setting scales the whole app. */
:root{
  --black:#000000; --brand:#0B2E63; --brand-2:#173F82; --brand-3:#0A2756; --navy:#0B2E63; --navy-2:#173F82; --navy-t:#E9EEF7; --on-navy:#FFFFFF; --on-navy-2:#C4CCDA;
  --bg:#F6F8FC; --card:#FFFFFF; --fill:#EEF2F8; --fill-2:#E1E8F2; --ink:#0A1B33; --ink-2:#2B3A52; --ink-3:#56647A; --line:#DCE3EE; --line-2:#E9EEF5;
  --green:#05704A; --green-t:#E3F4EB; --amber:#8A5300; --amber-t:#FFF1D6; --red:#C0271B; --red-t:#FDECEA; --wa:#E7F6E2;
  --scrim:rgba(0,0,0,.5);
  --r:12px; --r-s:8px;
  --font:'Inter','Noto Sans','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Kannada',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
html{font-size:16px} html.ts-l{font-size:18px} html.ts-xl{font-size:20px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.gut{padding-left:max(1.125rem,env(safe-area-inset-left,0px));padding-right:max(1.125rem,env(safe-area-inset-right,0px))}

/* top bar and home header: black */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:#FFFFFF;padding-block:.5rem;display:flex;align-items:center;gap:.5rem;min-height:3.75rem}
.top .grow{flex:1;min-width:0}
.brand{font-weight:800;font-size:1.375rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem}
.top-title{font-weight:700;font-size:1.0625rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:.875rem;color:var(--on-navy-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{display:inline-grid;place-items:center;width:2.875rem;height:2.875rem;border-radius:999px;border:0;background:transparent;color:inherit;flex:none}
.top .ibtn:hover{background:rgba(255,255,255,.12)}
.langbtn{border:0;background:rgba(255,255,255,.14);color:#FFFFFF;border-radius:999px;padding:.5rem .875rem;font-size:.875rem;font-weight:700;flex:none;min-height:2.5rem}
.band{background:var(--brand);color:#FFFFFF;padding-block:.25rem 1.75rem;display:flex;flex-direction:column;gap:.375rem}
.band .hi{color:var(--on-navy-2);font-size:1rem;font-weight:500}
.band h1{font-size:1.875rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.band p.sub{color:var(--on-navy-2);font-size:1rem}
main{flex:1;padding-block:1.25rem calc(6.25rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1.25rem;min-width:0}

/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.125rem;padding:.625rem .125rem .5rem;font-size:.8125rem;color:var(--ink-3);font-weight:600;min-width:0;min-height:4rem;position:relative}
.nav button svg{width:1.625rem;height:1.625rem}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-current="page"]{color:var(--brand);font-weight:800}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--brand);border-radius:0 0 3px 3px}
.nav .plus{width:3rem;height:2.25rem;border-radius:999px;background:var(--navy);color:#FFFFFF;display:grid;place-items:center}
.nav .plus svg{width:1.375rem;height:1.375rem}

/* deal tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(3.75rem + env(safe-area-inset-top,0px));z-index:20}
.tabs button{flex:1;border:0;background:none;padding:.875rem .25rem .75rem;font-weight:700;font-size:.9375rem;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;min-height:3.25rem}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* type */
.h1{font-size:1.75rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.h2{font-size:1.25rem;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.lbl{font-size:.875rem;font-weight:700;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:.9375rem} .tiny{font-size:.875rem;color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:.8125rem;word-break:break-all}
.row{display:flex;align-items:center;gap:.625rem} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.875rem} .stack-s{display:flex;flex-direction:column;gap:.375rem}
.grow{flex:1;min-width:0}
.red{color:var(--red)}
.empty{text-align:center;padding:1.5rem 1rem;color:var(--ink-2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.625rem}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:1rem 1.125rem}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line-2)}
.tap{display:block;width:100%;text-align:left;background:none;border:0;padding:1rem 1.125rem;min-height:3.5rem}
.tap:hover{background:#FAFAFA} .tap:active{background:var(--fill)}
.note{background:var(--fill);border-radius:var(--r-s);padding:.75rem .875rem;font-size:.9375rem}
.note.warn{background:var(--amber-t)} .note.bad{background:var(--red-t)} .note.ok{background:var(--green-t)}

/* buttons: black primary, grey secondary, all at least 48px tall */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-s);border:0;background:var(--brand);color:#FFFFFF;padding:.75rem 1.25rem;font-weight:700;font-size:1rem;min-height:3.25rem;text-align:center;line-height:1.25}
.btn:hover{background:var(--brand-2)}
.btn.sec{background:var(--fill);color:var(--ink)} .btn.sec:hover{background:var(--fill-2)}
.btn.sm{min-height:2.75rem;padding:.5rem .875rem;font-size:.9375rem}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{background:var(--fill);color:var(--red)}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--red);color:#FFFFFF} .btn.danger:hover{background:#A11F15}
.warn-ico{width:4rem;height:4rem;border-radius:50%;background:var(--red-t);color:var(--red);display:grid;place-items:center}
/* role picker: three side by side */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.role{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.375rem;padding:.875rem .25rem;min-height:5.5rem;border:2px solid var(--fill);background:var(--fill);border-radius:var(--r);color:var(--ink);font:inherit;font-size:.9375rem;cursor:pointer;text-align:center;line-height:1.2}
.role b{font-weight:700;overflow-wrap:anywhere}
.role .role-ico{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;color:var(--brand)}
.role.on{border-color:var(--brand);background:var(--navy-t)}
.role.on .role-ico{background:var(--brand);color:#FFFFFF}
.role-sub{margin:0;min-height:1.2em}
.btn.send{min-width:3.25rem;padding:.75rem;border-radius:999px;background:var(--navy)}
a.btn{text-decoration:none}
.link{background:none;border:0;padding:.25rem 0;color:var(--navy);font-weight:700;font-size:.9375rem;text-decoration:underline;text-underline-offset:3px;min-height:2.25rem}
.link.on-navy{color:#FFFFFF;font-size:.875rem;white-space:nowrap}

/* chips and progress */
.chip{display:inline-block;border-radius:999px;padding:.125rem .625rem;font-size:.8125rem;font-weight:700;white-space:nowrap;line-height:1.6}
.c-ok{background:var(--green-t);color:var(--green)} .c-warn{background:var(--amber-t);color:var(--amber)} .c-bad{background:var(--red-t);color:var(--red)}
.c-navy{background:var(--navy-t);color:var(--navy)} .c-mute{background:var(--fill);color:var(--ink-2)}
.bar{height:.5rem;border-radius:999px;background:var(--fill-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:999px}
.big{font-size:2.75rem;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* home */
.deal-row{display:flex;flex-direction:column;gap:.5rem;padding-block:1.125rem}
.deal-row .t{font-weight:800;font-size:1.125rem;line-height:1.3}
.deal-row .pct{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev{display:grid;grid-template-columns:3.5rem 1fr;gap:.875rem;align-items:start}
.ev .d{background:var(--fill);border-radius:var(--r-s);text-align:center;padding:.375rem 0;line-height:1.2}
.ev .d b{display:block;font-size:1.375rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.ev .d span{font-size:.8125rem;color:var(--ink-3);font-weight:600}

/* terms */
.dims{display:grid;grid-template-columns:auto 1fr 2.75rem;gap:.625rem .875rem;align-items:center;font-size:.9375rem}
.dims .num{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.875rem;text-align:right;font-weight:600}
.flag{padding:1rem 1.125rem;display:flex;flex-direction:column;gap:.625rem;border-left:4px solid var(--ink-3)}
.flag.high{border-left-color:var(--red)} .flag.medium{border-left-color:var(--amber)}
.flag b{font-size:1.0625rem}
.bubble{background:var(--wa);border-radius:var(--r);padding:.75rem .875rem;font-size:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.term-li{display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;align-items:center}
.term-li .val{overflow-wrap:anywhere}
.rec-ico,.rc-ico{width:2.75rem;height:2.75rem;border-radius:999px;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none}
.room-card{display:flex;align-items:center;gap:.875rem;padding:1rem 1.125rem;text-align:left;width:100%;background:var(--brand);color:#FFFFFF;border:0}
.room-card .tiny{color:var(--on-navy-2)}
.room-card .rc-ico{background:rgba(255,255,255,.14);color:#FFFFFF}
.room-card:hover{background:var(--brand-3)}

/* messages and records */
.msg{display:grid;grid-template-columns:2.5rem 1fr;gap:.125rem .5rem;padding:.75rem 0;border-bottom:1px solid var(--line-2)}
.msg:last-child{border-bottom:0}
.msg .n{font-family:var(--mono);font-size:.8125rem;color:var(--ink-3);padding-top:.125rem}
.msg .who{font-size:.9375rem;font-weight:700}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr;gap:.625rem 1rem;font-size:.9375rem;margin:0}
.kv dt{color:var(--ink-3);font-weight:600} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.quote{border-left:3px solid var(--fill-2);padding:.125rem 0 .125rem .75rem;font-size:.9375rem;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.timeline{list-style:none;margin:0;padding:0 0 0 1.25rem;border-left:2px solid var(--fill-2);display:flex;flex-direction:column;gap:1rem}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-1.6875rem;top:.375rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--card);border:3px solid var(--brand)}

/* agreement */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.doc-head{background:var(--navy);color:#FFFFFF;padding:1.125rem;display:flex;flex-direction:column;gap:.25rem}
.doc-head .k{font-size:.8125rem;color:var(--on-navy-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.doc-head h2{font-size:1.375rem;font-weight:800;line-height:1.25}
.doc-head p{font-size:.9375rem;color:var(--on-navy-2)}
.clause{padding:1.125rem;border-top:1px solid var(--line-2);display:grid;grid-template-columns:1.75rem 1fr;gap:0 .5rem}
.clause:first-of-type{border-top:0}
.clause .no{font-weight:800;color:var(--navy)}
.clause h3{font-size:1.0625rem;font-weight:800}
.clause .body{margin-top:.375rem;overflow-wrap:anywhere;font-size:1rem}
.clause.speaking{background:var(--navy-t)}
.settle{margin-top:.625rem;background:var(--amber-t);border-radius:var(--r-s);padding:.625rem .75rem;font-size:.9375rem}
.settle b{color:var(--amber);font-size:.8125rem;display:block;text-transform:uppercase;letter-spacing:.03em}
.pending{margin-top:.75rem;box-shadow:inset 0 0 0 2px var(--navy);border-radius:var(--r-s);padding:.75rem .875rem;font-size:.9375rem;display:flex;flex-direction:column;gap:.625rem}
del{background:var(--red-t);color:var(--red)}
ins{background:var(--green-t);color:var(--green);text-decoration:none}
.clause-acts{display:flex;gap:1.25rem;margin-top:.625rem;flex-wrap:wrap}
.speak{width:3.25rem;height:3.25rem;border-radius:50%;border:0;background:var(--brand);color:#FFFFFF;display:grid;place-items:center;flex:none}
.speak.on{background:var(--red)}

/* segmented controls: grey track, black selected pill */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:999px;padding:.25rem;gap:.25rem}
.seg button{border:0;background:transparent;border-radius:999px;padding:.625rem .5rem;font-size:.9375rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.75rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:#FFFFFF}
.seg.sm button{padding:.375rem .75rem;font-size:.875rem;min-height:2.25rem}

/* forms: grey filled fields, black focus ring */
select.sel,input.inp,textarea.inp{width:100%;border:2px solid transparent;border-radius:var(--r-s);background:var(--fill);padding:.75rem .875rem;font-size:1rem;min-height:3.25rem;color:var(--ink)}
select.sel:focus,input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand);background:#FFFFFF}
input.inp::placeholder,textarea.inp::placeholder{color:#8A8A8A}
textarea.inp{min-height:7.5rem;resize:vertical;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:.375rem;font-size:.9375rem;font-weight:700;color:var(--ink)}
.radio{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start;padding:.875rem 1rem;border:2px solid var(--fill);background:var(--fill);border-radius:var(--r);font-size:1rem;min-height:3.25rem}
.radio input{width:1.25rem;height:1.25rem;margin-top:.125rem;accent-color:var(--brand)}
.radio.on{border-color:var(--brand);background:#FFFFFF}
button.radio{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.check{display:flex;gap:.75rem;align-items:flex-start;font-size:1rem}
.check input{width:1.5rem;height:1.5rem;margin-top:0;accent-color:var(--brand);flex:none}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.625rem}
.src{border:2px solid var(--fill);border-radius:var(--r);background:var(--fill);padding:.875rem;text-align:left;display:flex;flex-direction:column;gap:.25rem;font-size:1rem;font-weight:700;color:var(--ink);min-height:5.5rem}
.src[aria-pressed="true"]{border-color:var(--brand);background:#FFFFFF}
.src .tiny{font-weight:400}
.otp{font-size:1.75rem;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--brand);min-height:2.75rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;text-align:center}
.cal .wd{font-size:.8125rem;color:var(--ink-3);font-weight:700;padding:.25rem 0}
.cal button{position:relative;border:0;background:none;border-radius:999px;height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1875rem;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cal button.other{color:var(--ink-3);opacity:.45}
.cal button.today{box-shadow:inset 0 0 0 2px var(--brand);font-weight:800}
.cal button[aria-pressed="true"]{background:var(--brand);color:#FFFFFF}
.dots{display:flex;gap:.1875rem;height:.375rem}
.dots i,.kd{width:.4375rem;height:.4375rem;border-radius:50%;display:inline-block}
.kd{margin-right:.375rem;vertical-align:middle}
.k-delivery{background:#2F6FDB} .k-payment{background:var(--green)} .k-deadline{background:var(--red)} .k-meeting{background:#D98A00} .k-tax{background:#6B3FD1} .k-holiday{background:#E8590C}
.cal button.has{background:var(--navy-t)}
.cal button.hol{color:#B23F00}
.cal button.has[aria-pressed="true"],.cal button[aria-pressed="true"]{background:var(--brand);color:#FFFFFF}
.legend{display:flex;flex-wrap:wrap;gap:.5rem .875rem;font-size:.875rem;color:var(--ink-2)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.ev .d.d-tax{background:#EFE9FC;color:#4A2A9E} .ev .d.d-holiday{background:#FDEBDD;color:#9A3A00}
.cal button[aria-pressed="true"] .dots i{outline:1px solid #FFFFFF}
.adpin{position:absolute;top:-2px;right:-2px;width:1.125rem;height:1.125rem;border-radius:6px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card);overflow:hidden}
.adpin svg{display:block}
.ad-logo{flex:none;display:grid;place-items:center;border-radius:13px;overflow:hidden;box-shadow:0 2px 8px rgba(11,46,99,.18)}
.ad-logo.big{border-radius:18px}
.ad-logo svg{display:block}
.cal-wrap{display:flex;flex-direction:column;gap:1rem}
.ad-row{display:flex;gap:.875rem;align-items:center;padding:1rem 1.125rem;text-align:left;width:100%}
.ad-ico{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;flex:none}
.ad-ico.big{width:3.5rem;height:3.5rem}

/* source tree */
.cl-chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:thin}
.cl-chips button{flex:none;border:0;background:var(--fill);border-radius:999px;padding:.625rem .875rem;font-size:.9375rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:.375rem;white-space:nowrap;min-height:2.75rem}
.cl-chips button[aria-pressed="true"]{background:var(--brand);color:#FFFFFF}
.sd{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.sd.agreed{background:var(--green)} .sd.proposed,.sd.ambiguous{background:var(--amber)} .sd.missing{background:var(--red)}
.tree{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.125rem}
.tree ul{list-style:none;margin:0;padding:0 0 0 1.875rem}
.tree li{position:relative;padding-top:1.375rem}
.tree li::before{content:"";position:absolute;left:-1.125rem;top:0;bottom:0;border-left:2px solid var(--navy)}
.tree li:last-child::before{bottom:auto;height:2.875rem}
.tree li::after{content:"";position:absolute;left:-1.125rem;top:2.875rem;width:1.125rem;border-top:2px solid var(--navy)}
.node{border-radius:var(--r);padding:.75rem .875rem;position:relative}
.node .nl{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.node-clause{background:var(--navy);color:#FFFFFF}
.node-clause .nl{color:var(--on-navy-2)}
.node-clause b{font-size:1.0625rem;display:block}
.node-clause p{font-size:.9375rem;color:var(--on-navy-2);margin-top:.25rem}
.node-term{background:var(--card);box-shadow:inset 0 0 0 2px var(--navy);min-height:3rem}
.node-term .nl{color:var(--navy)}
.node-term .row{justify-content:space-between}
.node-msg{background:var(--fill);min-height:3rem}
.node-msg .meta{font-size:.875rem;color:var(--ink-3);display:flex;gap:.375rem;flex-wrap:wrap;align-items:center}
.node-msg .meta b{color:var(--ink);font-weight:700}
.node-msg .txt{margin-top:.25rem;font-size:.9375rem;white-space:pre-wrap;overflow-wrap:anywhere}
.node-empty{color:var(--ink-3);font-size:.9375rem;padding:.75rem .875rem;border:2px dashed var(--line);border-radius:var(--r)}

/* signatures */
.sigpad{width:100%;height:10rem;border:2px dashed var(--ink-3);border-radius:var(--r);background:#FFFFFF;touch-action:none;display:block}
.sig-img{height:2.75rem;max-width:10rem;border:1px solid var(--line);border-radius:4px;background:#FFFFFF}
.sig-name{font-style:italic;font-size:1.25rem;font-weight:700;color:var(--navy)}
.thumb{max-width:100%;max-height:14rem;border-radius:var(--r-s);border:1px solid var(--line);display:block}
.sig-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-top:1px solid var(--line-2)}
.sig-row:first-of-type{border-top:0}
.sig-row .sig-img{max-height:2.875rem;max-width:7rem;flex:none}
.sig-row .sig-name{flex:none}
.esign-badge{flex:none;display:inline-flex;align-items:center;gap:.3125rem;padding:.375rem .625rem;border-radius:999px;background:var(--green-t);color:var(--green);font-weight:800;font-size:.875rem}

/* bottom sheets */
#sheetWrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:92%;overflow:auto;background:var(--card);border-radius:1.25rem 1.25rem 0 0;padding-left:max(1.125rem,env(safe-area-inset-left,0px));padding-right:max(1.125rem,env(safe-area-inset-right,0px));padding-block:.5rem calc(1.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1.125rem;overscroll-behavior:contain}
.sheet::before{content:"";align-self:center;width:2.5rem;height:.3125rem;border-radius:999px;background:var(--fill-2);flex:none}
.sheet-head{display:flex;align-items:flex-start;gap:.625rem;justify-content:space-between;padding-bottom:.25rem}
.sheet-head .h2{font-size:1.375rem}
.sheet-head .ibtn{color:var(--ink);font-size:1.75rem;line-height:1;background:var(--fill)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));z-index:60;background:var(--brand);color:#FFFFFF;padding:.875rem 1.125rem;border-radius:var(--r);font-size:1rem;font-weight:600;max-width:calc(100% - 2rem);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.busy{display:flex;align-items:center;gap:.625rem}
.spin{width:1.25rem;height:1.25rem;border-radius:50%;border:3px solid var(--fill-2);border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.trbar{background:var(--navy);color:#FFFFFF;font-size:.9375rem;font-weight:700;padding-block:.625rem}
.trbar .spin{border-color:rgba(255,255,255,.3);border-top-color:#FFFFFF}
.trbar .link{color:#FFFFFF}

/* lawyers and approvals */
.lawyer{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center}
.avatar{width:2.875rem;height:2.875rem;border-radius:50%;background:var(--navy);color:#FFFFFF;display:grid;place-items:center;font-weight:800;font-size:.9375rem;flex:none}
.fee{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.approval{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);padding:.875rem 1rem;background:var(--card);display:flex;flex-direction:column;gap:.25rem;text-align:left;width:100%}
.review{box-shadow:inset 0 0 0 2px var(--brand)}
.band-l{padding-top:.375rem}
details.legal summary{cursor:pointer;font-weight:800;padding:1rem 1.125rem;list-style:none;display:flex;justify-content:space-between;gap:.625rem;align-items:center;min-height:3.25rem}
details.legal summary::-webkit-details-marker{display:none}
details.legal summary::after{content:"+";font-size:1.5rem;color:var(--ink);font-weight:400}
details.legal[open] summary::after{content:"−"}
details.legal .in{padding:0 1.125rem 1.125rem;display:flex;flex-direction:column;gap:.625rem;font-size:.9375rem;color:var(--ink-2)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.langs button{border:2px solid var(--fill);background:var(--fill);border-radius:var(--r);padding:.875rem .375rem;font-weight:700;font-size:1.0625rem;min-height:3.25rem}
.langs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#FFFFFF}

/* report pill on the black bar */
.report-pill{display:inline-flex;align-items:center;gap:.3125rem;flex:none;border:0;border-radius:999px;padding:.5rem .75rem;background:rgba(255,120,110,.22);color:#FFD6D1;font-size:.875rem;font-weight:800;line-height:1;min-height:2.5rem}
.report-pill:hover{background:rgba(255,120,110,.32)}
.report-pill.on{background:var(--red);color:#FFFFFF}
.urgent{border-left:4px solid var(--red);background:var(--red-t);border-radius:0 var(--r-s) var(--r-s) 0;padding:.875rem 1rem}
.urgent b{color:var(--red)}

/* laws and standards */
.std-card{overflow:hidden}
.std-cat{display:flex;justify-content:space-between;align-items:center;gap:.625rem;padding:.875rem 1rem;border-bottom:1px solid var(--line-2)}
.std-sum{padding:.625rem 1rem;font-size:.9375rem;font-weight:700;color:var(--ink-2);background:var(--fill);border-bottom:1px solid var(--line-2)}
.std+.std{border-top:1px solid var(--line-2)}
.std summary{display:flex;gap:.75rem;align-items:flex-start;padding:.875rem 1rem;cursor:pointer;list-style:none;min-height:3.25rem}
.std summary::-webkit-details-marker{display:none}
.std .sic{flex:none;margin-top:.125rem;display:grid}
.std.s-fail .sic{color:var(--red)} .std.s-warn .sic{color:var(--amber)} .std.s-pass .sic{color:var(--green)} .std.s-info .sic{color:var(--ink-3)}
.std.s-fail{box-shadow:inset 4px 0 0 var(--red)}
.std b{font-size:1rem;display:block}
.cite{display:block;font-size:.8125rem;color:var(--ink-3);margin-top:.125rem}
.st-tag{flex:none;font-size:.8125rem;font-weight:800;color:var(--ink-3);margin-top:.125rem}
.std.s-fail .st-tag{color:var(--red)} .std.s-warn .st-tag{color:var(--amber)} .std.s-pass .st-tag{color:var(--green)}
.std .in{padding:0 1rem .875rem 2.75rem;display:flex;flex-direction:column;gap:.5rem}

/* live chat room */
.room-main{padding-bottom:0}
.room-bar{padding:.75rem 0 .375rem}
.live-dot{display:inline-block;width:.625rem;height:.625rem;border-radius:50%;background:var(--green);margin-right:.375rem;vertical-align:1px}
.room-cov{display:grid;grid-template-columns:auto 1fr;gap:.625rem;align-items:center;padding-bottom:.5rem}
.room-msgs{display:flex;flex-direction:column;gap:.625rem;padding:.5rem 0 1rem;min-height:30vh}
.rm{display:flex;flex-direction:column;align-items:flex-start;max-width:86%}
.rm.mine{align-self:flex-end;align-items:flex-end}
.rm-b{background:var(--fill);border-radius:1rem 1rem 1rem .25rem;padding:.625rem .875rem}
.rm.mine .rm-b{background:var(--brand);color:#FFFFFF;border-radius:1rem 1rem .25rem 1rem}
.rm.mine .rm-n{color:var(--on-navy-2)}
.rm-n{display:block;font-size:.8125rem;color:var(--ink-3);margin-bottom:.125rem}
.rm-warn{display:flex;align-items:center;gap:.3125rem;color:var(--red);font-size:.875rem;font-weight:700;margin-top:.25rem}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:.75rem 0 calc(.875rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.625rem}
.composer textarea{flex:1;min-height:3.25rem;max-height:9rem;resize:none;border-radius:1.625rem;padding-inline:1.125rem}
.chips-row{display:flex;flex-direction:column;gap:.375rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.125rem;scrollbar-width:none}
.sgchip{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:.625rem 1rem;font-size:.9375rem;font-weight:700;white-space:nowrap;min-height:2.75rem}
.sgchip:hover{background:var(--fill-2)}

/* dispute routes, invite steps */
.routes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
.routes li{display:grid;grid-template-columns:2rem 1fr;gap:.75rem}
.routes li.dim{opacity:.6}
.rn{width:2rem;height:2rem;border-radius:50%;background:var(--brand);color:#FFFFFF;display:grid;place-items:center;font-size:.9375rem;font-weight:800}
.code-box{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.125rem;border-radius:var(--r);background:var(--brand);color:#FFFFFF}
.code-box .lbl{color:var(--on-navy-2)}
.code-box b{font-size:1.625rem;letter-spacing:.14em;color:#FFFFFF}

/* formal agreement */
.doc.formal{font-family:"Times New Roman",Georgia,serif;font-size:1rem;line-height:1.65;padding:1.375rem 1.25rem}
.doc.formal .f-title{text-align:center;margin-bottom:.875rem}
.doc.formal .f-title h2{font-size:1.125rem;letter-spacing:.03em}
.doc.formal .f-title p{font:.8125rem/1.4 var(--font);color:var(--ink-3)}
.doc.formal h3{font-size:1rem;margin:1rem 0 .25rem}
.doc.formal p{margin:0 0 .5rem}
.doc.formal .f-c{text-align:center;font-weight:700}
.doc.formal table{border-collapse:collapse;width:100%;margin:.375rem 0;font-size:.875rem}
.doc.formal th,.doc.formal td{border:1px solid var(--line);padding:.375rem .5rem;text-align:left;vertical-align:top}
.doc.formal th{background:var(--fill);width:34%}
.doc.formal .f-h{font:.75rem ui-monospace,Menlo,monospace;word-break:break-all}
.doc.formal .f-s{font-size:.8125rem;color:var(--ink-3)}
.doc.formal .f-sigs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.625rem}
.doc.formal .f-line{border-top:1px solid var(--ink-2);margin-top:2.125rem;padding-top:.125rem;font-size:.8125rem}
.doc.formal .f-logos{display:flex;justify-content:space-between;align-items:center;margin-bottom:.625rem}
.doc.formal .f-logo{max-height:3.5rem;max-width:8rem}
.doc.formal .f-seal{max-height:4.5rem;margin-top:.375rem;opacity:.92}
.doc.formal .f-sigimg{max-height:3rem;max-width:9.5rem}

/* quotation, fees, logos */
.q-total{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1rem;background:var(--brand);color:#FFFFFF;border-radius:var(--r)}
.q-total b{font-size:1.375rem;color:#FFFFFF}
.kv.fees{background:var(--fill);border-radius:var(--r);padding:.875rem 1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.logo-row{display:flex;align-items:center;gap:.75rem}
.logo-slot{width:3.5rem;height:3.5rem;border-radius:var(--r-s);border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);flex:none;overflow:hidden;background:var(--fill)}
.logo-slot.seal{border-radius:50%}
.logo-slot img{max-width:100%;max-height:100%;object-fit:contain}

/* tamper check, compare, sample data */
.seal-card{box-shadow:inset 4px 0 0 var(--navy)}
.seal-mini{background:var(--fill);border:0}
.integ li{display:flex;gap:.625rem;align-items:flex-start;padding:.75rem 1rem}
.integ li+li{border-top:1px solid var(--line-2)}
.integ li.ok .sic{color:var(--green)} .integ li.bad .sic{color:var(--red)}
.integ li.bad{background:var(--red-t)}
.verdict{border-radius:var(--r);padding:1rem 1.125rem;background:var(--navy-t)}
.verdict b{font-size:1.125rem}
.verdict.v-A{background:var(--green-t)} .verdict.v-B{background:var(--navy-t)} .verdict.v-mixed{background:var(--amber-t)}
.cmp-rows{display:flex;flex-direction:column}
.cmp-row{padding:.75rem 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:.375rem}
.cmp-ab{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.875rem}
.cmp-ab span{background:var(--fill);border-radius:var(--r-s);padding:.5rem .625rem}

.cmp-list{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.375rem;font-size:.9375rem}

.sample-bar{display:flex;align-items:center;justify-content:space-between;gap:.625rem;padding:.75rem .875rem;border-radius:var(--r);background:var(--navy-t)}
.btn.say.on{background:var(--brand);color:#FFFFFF}
.reading{background:#FFF1B8!important;border-radius:4px;transition:background .2s}
.sec-h .say{flex:none}

/* tutorial */
.tut-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:1rem}
@media (min-width:600px){.tut-wrap{align-items:center}}
.tut-card{background:var(--card);border-radius:1.25rem;max-width:30rem;width:100%;padding:1.5rem 1.25rem}

.tut-ico{width:4rem;height:4rem;border-radius:50%;background:var(--brand);color:#FFFFFF;display:grid;place-items:center}
.dots-row{display:flex;gap:.375rem;justify-content:center}
.dots-row i{width:.5rem;height:.5rem;border-radius:50%;background:var(--fill-2)}
.dots-row i.on{background:var(--brand);width:1.25rem;border-radius:4px}

/* misc */
.acct-btn{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left}
.ad{display:flex;gap:.75rem;align-items:flex-start;padding:.875rem 1rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:var(--brand);color:#FFFFFF}
.splash .brand{font-size:1.75rem}
.splash .spin{border-color:rgba(255,255,255,.25);border-top-color:#FFFFFF}
.cloud-badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.8125rem;font-weight:700;padding:.0625rem .5rem;border-radius:999px;background:var(--green-t);color:var(--green);vertical-align:1px}
.cloud-badge.saving{background:var(--navy-t);color:var(--navy)} .cloud-badge.error{background:var(--red-t);color:var(--red)}
.ts-seg{margin-top:.25rem}
.ts-seg button:nth-child(1){font-size:.9375rem} .ts-seg button:nth-child(2){font-size:1.0625rem} .ts-seg button:nth-child(3){font-size:1.25rem}
[hidden]{display:none!important}
@media (min-width:900px){ .app,.nav-in,.sheet{max-width:720px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} .spin{animation-duration:3s} .reading{transition:none} }
@media (forced-colors:active){ .btn,.seg button[aria-pressed="true"],.chip{border:1px solid ButtonText} }
/* large text sizes: let tabs scroll and controls wrap instead of cutting words */
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding-inline:.875rem;overflow:visible}
.ts-seg{border-radius:1.25rem}
.ts-seg button{white-space:normal;line-height:1.2;border-radius:1rem}
html.ts-xl .report-pill span{display:none}

/* ---------- snip tool ---------- */
.snip-fab{position:fixed;z-index:45;display:flex;align-items:center;gap:.5rem;padding:.625rem 1.125rem .625rem .875rem;min-height:3.25rem;border-radius:999px;border:0;background:var(--brand);color:#FFFFFF;font:inherit;font-weight:800;font-size:1rem;box-shadow:0 10px 28px rgba(11,46,99,.38),0 0 0 3px #FFFFFF;touch-action:none;cursor:grab;transition:background .2s}
.snip-fab:hover{background:var(--brand-2)}
.snip-fab:active{cursor:grabbing}
.snip-fab .spin{border-color:rgba(255,255,255,.3);border-top-color:#FFFFFF}
.snip-fab.done{background:var(--green)} .snip-fab.err{background:var(--red)}
.snip-fab.done svg{animation:pop .35s ease-out}
body[data-view="room"] .snip-fab{bottom:auto!important;top:calc(4.5rem + env(safe-area-inset-top,0px));padding:.625rem;min-width:3.25rem;justify-content:center}
body[data-view="room"] .snip-fab .fab-l{display:none}
.snip-scrim{position:fixed;inset:0;z-index:46;background:rgba(10,27,51,.4)}
.snip-panel{position:fixed;z-index:47;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:1.25rem 1.25rem 0 0;padding:1rem max(1.125rem,env(safe-area-inset-right,0px)) calc(1.25rem + env(safe-area-inset-bottom,0px)) max(1.125rem,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.875rem;box-shadow:0 -10px 30px rgba(10,27,51,.25)}
.snip-panel.in-pip{position:static;max-width:none;max-height:none;border-radius:0;box-shadow:none;padding:1rem;min-height:100vh;box-sizing:border-box}
.pip-body{margin:0;background:var(--card)}
.snip-head{display:flex;align-items:center;gap:.625rem;font-size:1.125rem}
.snip-head .ibtn{color:var(--ink);background:var(--fill)}
.snip-ico{width:2.75rem;height:2.75rem;border-radius:.875rem;background:var(--brand);color:#FFFFFF;display:grid;place-items:center;flex:none}
.snip-ico.sm{width:2.125rem;height:2.125rem;border-radius:.625rem}
.snip-acts{display:flex;flex-direction:column;gap:.5rem}
.snip-acts .btn{width:100%;justify-content:flex-start}
label.btn{cursor:pointer}
.snip-status{display:flex;align-items:center;gap:.75rem;padding:.875rem 1rem;border-radius:var(--r);font-weight:600;font-size:.9375rem}
.snip-status.busy{background:var(--navy-t);color:var(--brand)}
.snip-status.ok{background:var(--green-t);color:var(--green)}
.snip-status.ok b{font-size:1.0625rem}
.snip-status.ok .tiny{color:var(--ink-2)}
.snip-status .tick{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--green);color:#FFFFFF;display:grid;place-items:center;flex:none;animation:pop .35s ease-out}
.snip-status.bad{background:var(--red-t);color:var(--red)}
.snip-status .link{margin-left:auto}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.snip-foot{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;align-items:center}
.snip-foot .link{display:inline-flex;align-items:center;gap:.375rem}
.danger-link{color:var(--red)!important}
.snip-card{display:flex;align-items:center;gap:.875rem;padding:1rem 1.125rem;width:100%;text-align:left;flex-wrap:wrap}
.snip-card .grow{flex:1 1 12rem;min-width:0}
.snip-card.on{background:var(--navy-t);border-color:transparent;flex-wrap:nowrap}
.crop-wrap{position:fixed;inset:0;z-index:90;background:#071733;color:#FFFFFF;display:flex;flex-direction:column}
.crop-bar{display:flex;gap:.5rem;align-items:center;padding:.625rem 1rem;background:var(--brand);flex-wrap:wrap}

.crop-bar .btn:not(.sec){background:#FFFFFF;color:var(--brand)} .crop-bar .btn:not(.sec):disabled{opacity:.45}

.crop-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.crop-box{position:absolute;border:2px solid #FFFFFF;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.crop-hint{text-align:center;color:#C4CCDA!important;padding:.5rem 1rem .875rem;margin:0}

/* ---------- home and calendar columns ---------- */
.home-grid{display:flex;flex-direction:column;gap:1.25rem}
.home-side,.home-main{min-width:0}
.desk{display:none}
.v-room .nav{display:none}
html.lay-phone .app,html.lay-phone .nav-in,html.lay-phone .sheet{max-width:600px}

/* ---------- laptop and desktop: sidebar, wider content, centred dialogs ---------- */
@media (min-width:1024px){
  html:not(.lay-phone) .app{max-width:none}

noAgreementText:["DraftIt writes a short, plain agreement from your chats. Open points stay marked. Nothing is decided for you.", "DraftIt आपकी चैट से छोटा, आसान समझौता लिखता है। जो बातें तय नहीं हैं, वे अलग दिखती हैं। आपकी जगह कुछ तय नहीं किया जाता।", "DraftIt तुमच्या चॅटमधून छोटा, सोपा करार लिहितो. न ठरलेल्या गोष्टी वेगळ्या दिसतात. तुमच्या वतीने काहीही ठरवले जात नाही.", "DraftIt మీ చాట్‌ల నుంచి చిన్న, సులభమైన ఒప్పందం రాస్తుంది. తేలని అంశాలు గుర్తించి ఉంటాయి. మీ తరఫున ఏదీ నిర్ణయించదు.", "DraftIt உங்கள் அரட்டைகளிலிருந்து சிறிய, எளிய ஒப்பந்தத்தை எழுதுகிறது. தீர்க்கப்படாதவை குறிக்கப்படும். உங்களுக்காக எதுவும் முடிவு செய்யப்படாது.", "DraftIt ನಿಮ್ಮ ಚಾಟ್‌ಗಳಿಂದ ಚಿಕ್ಕ, ಸರಳ ಒಪ್ಪಂದ ಬರೆಯುತ್ತದೆ. ತೀರ್ಮಾನವಾಗದ ಅಂಶಗಳನ್ನು ಗುರುತಿಸಲಾಗುತ್ತದೆ. ನಿಮ್ಮ ಪರವಾಗಿ ಏನನ್ನೂ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ."],

newChatsNote:["New chats came after this version. Start a new version to add them.","इस संस्करण के बाद नई चैट आई है। उन्हें जोड़ने के लिए नया संस्करण शुरू करें।","या आवृत्तीनंतर नवीन चॅट आले आहेत. ते जोडण्यासाठी नवीन आवृत्ती सुरू करा.","ఈ వెర్షన్ తర్వాత కొత్త చాట్‌లు వచ్చాయి. వాటిని చేర్చడానికి కొత్త వెర్షన్ ప్రారంభించండి.","இந்தப் பதிப்புக்குப் பின் புதிய அரட்டைகள் வந்துள்ளன. அவற்றைச் சேர்க்கப் புதிய பதிப்பைத் தொடங்குங்கள்.","ಈ ಆವೃತ್ತಿಯ ನಂತರ ಹೊಸ ಚಾಟ್‌ಗಳು ಬಂದಿವೆ. ಅವನ್ನು ಸೇರಿಸಲು ಹೊಸ ಆವೃತ್ತಿ ಆರಂಭಿಸಿ."],

actingNote:["In the real app each side uses their own phone. Switch here to try the other side.","असली ऐप में दोनों तरफ़ अपने-अपने फ़ोन से जुड़ते हैं। दूसरी तरफ़ आज़माने के लिए यहां बदलें।","खऱ्या अ‍ॅपमध्ये प्रत्येक बाजू स्वतःचा फोन वापरते. दुसरी बाजू पाहण्यासाठी इथे बदला.","అసలు యాప్‌లో ఎవరి ఫోన్ వారిదే. అవతలి వైపు ప్రయత్నించడానికి ఇక్కడ మార్చండి.","உண்மையான செயலியில் ஒவ்வொருவரும் தங்கள் போனைப் பயன்படுத்துவர். மறுதரப்பை முயற்சிக்க இங்கே மாற்றுங்கள்.","ನಿಜವಾದ ಆ್ಯಪ್‌ನಲ್ಲಿ ಪ್ರತಿಯೊಬ್ಬರೂ ತಮ್ಮ ಫೋನ್ ಬಳಸುತ್ತಾರೆ. ಇನ್ನೊಂದು ಕಡೆ ಪ್ರಯತ್ನಿಸಲು ಇಲ್ಲಿ ಬದಲಿಸಿ."],

pendBlock:["Accept or reject all changes before locking.","लॉक करने से पहले सभी बदलाव मंज़ूर या नामंज़ूर करें।","लॉक करण्यापूर्वी सर्व बदल स्वीकारा किंवा नाकारा.","లాక్ చేసే ముందు అన్ని మార్పులను అంగీకరించండి లేదా తిరస్కరించండి.","பூட்டுவதற்கு முன் எல்லா மாற்றங்களையும் ஏற்கவும் அல்லது நிராகரிக்கவும்.","ಲಾಕ್ ಮಾಡುವ ಮೊದಲು ಎಲ್ಲಾ ಬದಲಾವಣೆಗಳನ್ನು ಒಪ್ಪಿ ಅಥವಾ ತಿರಸ್ಕರಿಸಿ."],
openNote:["{n} points are still open. You can sign now; they stay marked as not agreed.","{n} बातें अभी खुली हैं। आप अभी साइन कर सकते हैं; वे “तय नहीं” के रूप में दर्ज रहेंगी।","{n} गोष्टी अजून खुल्या आहेत. तुम्ही आता सही करू शकता; त्या “ठरलेले नाही” म्हणून नोंदल्या जातील.","{n} అంశాలు ఇంకా తేలలేదు. మీరు ఇప్పుడే సంతకం చేయవచ్చు; అవి “ఒప్పుకోలేదు” అని నమోదవుతాయి.","{n} விஷயங்கள் இன்னும் திறந்துள்ளன. இப்போதே கையொப்பமிடலாம்; அவை “ஒப்புக்கொள்ளவில்லை” எனப் பதிவாகும்.","{n} ಅಂಶಗಳು ಇನ್ನೂ ತೆರೆದಿವೆ. ನೀವು ಈಗಲೇ ಸಹಿ ಮಾಡಬಹುದು; ಅವು “ಒಪ್ಪಿಲ್ಲ” ಎಂದು ದಾಖಲಾಗುತ್ತವೆ."],

freezeNote:["Locking saves a fingerprint of the exact text. Any later change will show.","लॉक करने पर हूबहू टेक्स्ट का फिंगरप्रिंट सेव होता है। बाद में कोई भी बदलाव पकड़ा जाएगा।","लॉक केल्यावर मजकुराचा फिंगरप्रिंट जतन होतो. नंतरचा कोणताही बदल लगेच दिसेल.","లాక్ చేస్తే పాఠం ఫింగర్‌ప్రింట్ సేవ్ అవుతుంది. తర్వాత ఏ మార్పు చేసినా తెలుస్తుంది.","பூட்டும்போது உரையின் கைரேகை சேமிக்கப்படும். பின்னர் எந்த மாற்றமும் தெரியவரும்.","ಲಾಕ್ ಮಾಡಿದಾಗ ಪಠ್ಯದ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ ಉಳಿಯುತ್ತದೆ. ನಂತರದ ಯಾವುದೇ ಬದಲಾವಣೆ ಗೊತ್ತಾಗುತ್ತದೆ."],

trOffline:["Some deal text needs Claude to translate, which is not available here. It is shown in English.","सौदे के कुछ टेक्स्ट के अनुवाद के लिए Claude चाहिए, जो यहां उपलब्ध नहीं। वह अंग्रेज़ी में दिख रहा है।","व्यवहाराच्या काही मजकुराच्या भाषांतरासाठी Claude लागते, जे इथे उपलब्ध नाही. तो इंग्रजीत दिसत आहे.","డీల్‌లోని కొంత పాఠం అనువాదానికి Claude కావాలి, ఇక్కడ అందుబాటులో లేదు. అది ఇంగ్లీష్‌లో చూపుతున్నాం.","ஒப்பந்தத்தின் சில உரையை மொழிபெயர்க்க Claude தேவை, அது இங்கு இல்லை. அது ஆங்கிலத்தில் காட்டப்படுகிறது.","ವ್ಯವಹಾರದ ಕೆಲವು ಪಠ್ಯ ಅನುವಾದಕ್ಕೆ Claude ಬೇಕು, ಅದು ಇಲ್ಲಿ ಲಭ್ಯವಿಲ್ಲ. ಅದನ್ನು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ತೋರಿಸಲಾಗಿದೆ."],

stampDuty:["Stamp duty","स्टाम्प ड्यूटी","मुद्रांक शुल्क","స్టాంప్ డ్యూటీ","முத்திரைத் தீர்வை","ಮುದ್ರಾಂಕ ಶುಲ್ಕ"],
stampText:["Stamp duty is set by each state and depends on the document type. If needed, pay it online through SHCIL e-stamping or your state portal, then add the certificate number.","स्टाम्प ड्यूटी हर राज्य तय करता है और यह दस्तावेज़ के प्रकार पर निर्भर है। ज़रूरत हो तो SHCIL ई-स्टाम्पिंग या अपने राज्य के पोर्टल से ऑनलाइन भरें, फिर सर्टिफ़िकेट नंबर यहां डालें।","मुद्रांक शुल्क प्रत्येक राज्य ठरवते आणि ते दस्तऐवजाच्या प्रकारावर अवलंबून असते. गरज असल्यास SHCIL ई-स्टॅम्पिंग किंवा राज्याच्या पोर्टलवर ऑनलाइन भरा आणि प्रमाणपत्र क्रमांक इथे टाका.","స్టాంప్ డ్యూటీని ప్రతి రాష్ట్రం నిర్ణయిస్తుంది, ఇది పత్రం రకంపై ఆధారపడి ఉంటుంది. అవసరమైతే SHCIL ఈ-స్టాంపింగ్ లేదా మీ రాష్ట్ర పోర్టల్‌లో ఆన్‌లైన్‌లో చెల్లించి, సర్టిఫికెట్ నంబర్ ఇక్కడ ఇవ్వండి.","முத்திரைத் தீர்வையை ஒவ்வொரு மாநிலமும் நிர்ணயிக்கிறது; இது ஆவண வகையைப் பொறுத்தது. தேவைப்பட்டால் SHCIL இ-ஸ்டாம்பிங் அல்லது உங்கள் மாநில இணையதளத்தில் ஆன்லைனில் செலுத்தி, சான்றிதழ் எண்ணை இங்கே சேர்க்கவும்.","ಮುದ್ರಾಂಕ ಶುಲ್ಕವನ್ನು ಪ್ರತಿ ರಾಜ್ಯ ನಿಗದಿಪಡಿಸುತ್ತದೆ ಮತ್ತು ಇದು ದಾಖಲೆಯ ಪ್ರಕಾರವನ್ನು ಅವಲಂಬಿಸಿದೆ. ಅಗತ್ಯವಿದ್ದರೆ SHCIL ಇ-ಸ್ಟ್ಯಾಂಪಿಂಗ್ ಅಥವಾ ನಿಮ್ಮ ರಾಜ್ಯದ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಪಾವತಿಸಿ, ಪ್ರಮಾಣಪತ್ರ ಸಂಖ್ಯೆ ಇಲ್ಲಿ ಸೇರಿಸಿ."],

lawyerAfter:["After both sides sign, a panel lawyer does a free final check.","दोनों के साइन के बाद पैनल का वकील मुफ़्त में आख़िरी जांच करता है।","दोघांच्या सह्यांनंतर पॅनेलवरील वकील मोफत अंतिम तपासणी करतात.","ఇద్దరూ సంతకం చేశాక ప్యానెల్ న్యాయవాది ఉచితంగా చివరి తనిఖీ చేస్తారు.","இருவரும் கையொப்பமிட்ட பின் குழு வழக்கறிஞர் இலவசமாக இறுதிச் சரிபார்ப்பு செய்வார்.","ಇಬ್ಬರೂ ಸಹಿ ಮಾಡಿದ ನಂತರ ಪ್ಯಾನೆಲ್ ವಕೀಲರು ಉಚಿತವಾಗಿ ಅಂತಿಮ ಪರಿಶೀಲನೆ ಮಾಡುತ್ತಾರೆ."],
lawyerReqText:["The lawyer reads this version and its chats, then approves it or sends notes.","वकील यह संस्करण और इसकी चैट पढ़कर मंज़ूरी देता है या सुझाव भेजता है।","वकील ही आवृत्ती व तिचे चॅट वाचून मंजुरी देतात किंवा सूचना पाठवतात.","న్యాయవాది ఈ వెర్షన్, దాని చాట్‌లు చదివి ఆమోదిస్తారు లేదా సూచనలు పంపుతారు.","வழக்கறிஞர் இந்தப் பதிப்பையும் அரட்டைகளையும் படித்து ஒப்புதல் தருவார் அல்லது குறிப்புகள் அனுப்புவார்.","ವಕೀಲರು ಈ ಆವೃತ್ತಿ ಮತ್ತು ಚಾಟ್‌ಗಳನ್ನು ಓದಿ ಅನುಮೋದಿಸುತ್ತಾರೆ ಅಥವಾ ಸಲಹೆ ಕಳುಹಿಸುತ್ತಾರೆ."],

lawyerNoteOpen:["Approved for signing. {n} points are still open; settle them on chat and add a new version.","साइन के लिए मंज़ूर। {n} बातें अभी खुली हैं; चैट पर तय करके नया संस्करण जोड़ें।","सहीसाठी मंजूर. {n} गोष्टी अजून खुल्या आहेत; चॅटवर ठरवून नवीन आवृत्ती जोडा.","సంతకానికి ఆమోదం. {n} అంశాలు ఇంకా తేలలేదు; చాట్‌లో తేల్చి కొత్త వెర్షన్ జోడించండి.","கையொப்பத்திற்கு ஒப்புதல். {n} விஷயங்கள் இன்னும் திறந்துள்ளன; அரட்டையில் தீர்த்துப் புதிய பதிப்பைச் சேருங்கள்.","ಸಹಿಗೆ ಅನುಮೋದನೆ. {n} ಅಂಶಗಳು ಇನ್ನೂ ತೆರೆದಿವೆ; ಚಾಟ್‌ನಲ್ಲಿ ತೀರ್ಮಾನಿಸಿ ಹೊಸ ಆವೃತ್ತಿ ಸೇರಿಸಿ."],
lawyerNoteOk:["Approved. The terms are clear and both signatures are on this version.","मंज़ूर। शर्तें साफ़ हैं और इस संस्करण पर दोनों के हस्ताक्षर हैं।","मंजूर. अटी स्पष्ट आहेत आणि या आवृत्तीवर दोघांच्या सह्या आहेत.","ఆమోదం. నిబంధనలు స్పష్టంగా ఉన్నాయి, ఈ వెర్షన్‌పై ఇద్దరి సంతకాలు ఉన్నాయి.","ஒப்புதல். நிபந்தனைகள் தெளிவாக உள்ளன, இந்தப் பதிப்பில் இருவரின் கையொப்பமும் உள்ளது.","ಅನುಮೋದನೆ. ಷರತ್ತುಗಳು ಸ್ಪಷ್ಟವಾಗಿವೆ ಮತ್ತು ಈ ಆವೃತ್ತಿಗೆ ಇಬ್ಬರ ಸಹಿ ಇದೆ."],

forCourtText:["One file with every original message, every version, every change, the signatures, the lawyer approval and all fingerprints.","एक फ़ाइल में हर मूल मैसेज, हर संस्करण, हर बदलाव, हस्ताक्षर, वकील की मंज़ूरी और सभी फिंगरप्रिंट।","एकाच फाइलमध्ये प्रत्येक मूळ संदेश, प्रत्येक आवृत्ती, प्रत्येक बदल, सह्या, वकिलांची मंजुरी आणि सर्व फिंगरप्रिंट.","ఒకే ఫైల్‌లో ప్రతి అసలు సందేశం, ప్రతి వెర్షన్, ప్రతి మార్పు, సంతకాలు, న్యాయవాది ఆమోదం, అన్ని ఫింగర్‌ప్రింట్‌లు.","ஒரே கோப்பில் ஒவ்வொரு அசல் செய்தி, ஒவ்வொரு பதிப்பு, ஒவ்வொரு மாற்றம், கையொப்பங்கள், வழக்கறிஞர் ஒப்புதல் மற்றும் அனைத்துக் கைரேகைகள்.","ಒಂದೇ ಫೈಲ್‌ನಲ್ಲಿ ಪ್ರತಿ ಮೂಲ ಸಂದೇಶ, ಪ್ರತಿ ಆವೃತ್ತಿ, ಪ್ರತಿ ಬದಲಾವಣೆ, ಸಹಿಗಳು, ವಕೀಲರ ಅನುಮೋದನೆ ಮತ್ತು ಎಲ್ಲಾ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್‌ಗಳು."],

revHelp:["Every locked version with its fingerprint, signatures and lawyer check.","हर लॉक संस्करण, उसका फिंगरप्रिंट, हस्ताक्षर और वकील जांच।","प्रत्येक लॉक आवृत्ती, तिचा फिंगरप्रिंट, सह्या आणि वकील तपासणी.","ప్రతి లాక్ చేసిన వెర్షన్, దాని ఫింగర్‌ప్రింట్, సంతకాలు, న్యాయవాది తనిఖీ.","பூட்டிய ஒவ்வொரு பதிப்பும், அதன் கைரேகை, கையொப்பங்கள், வழக்கறிஞர் சரிபார்ப்பு.","ಪ್ರತಿ ಲಾಕ್ ಆವೃತ್ತಿ, ಅದರ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್, ಸಹಿಗಳು ಮತ್ತು ವಕೀಲ ಪರಿಶೀಲನೆ."],

tsaNote:["Device clock (IST). The live app adds a certified time stamp (RFC 3161).","डिवाइस की घड़ी (IST)। असली ऐप प्रमाणित समय मुहर (RFC 3161) जोड़ता है।","डिव्हाइसचे घड्याळ (IST). खरे अ‍ॅप प्रमाणित वेळ शिक्का (RFC 3161) जोडते.","పరికరం గడియారం (IST). అసలు యాప్ ధృవీకృత సమయ ముద్ర (RFC 3161) జోడిస్తుంది.","சாதனக் கடிகாரம் (IST). உண்மையான செயலி சான்றளிக்கப்பட்ட நேர முத்திரையை (RFC 3161) சேர்க்கும்.","ಸಾಧನದ ಗಡಿಯಾರ (IST). ನಿಜವಾದ ಆ್ಯಪ್ ಪ್ರಮಾಣೀಕೃತ ಸಮಯ ಮುದ್ರೆ (RFC 3161) ಸೇರಿಸುತ್ತದೆ."],

copyOnlyNote:["Only a copy was changed, to show what happens.","सिर्फ़ एक कॉपी बदली गई, यह दिखाने के लिए कि क्या होता है।","काय होते ते दाखवण्यासाठी फक्त प्रत बदलली.","ఏమి జరుగుతుందో చూపడానికి ఒక కాపీ మాత్రమే మార్చాం.","என்ன நடக்கும் என்று காட்ட ஒரு நகல் மட்டுமே மாற்றப்பட்டது.","ಏನಾಗುತ್ತದೆ ಎಂದು ತೋರಿಸಲು ಒಂದು ಪ್ರತಿಯನ್ನು ಮಾತ್ರ ಬದಲಿಸಲಾಗಿದೆ."],

lawyerIntro:["You draft with DraftIt. A panel lawyer does the last check on the signed version, free for you, paid for by ads in the app.", "मसौदा आप DraftIt से बनाते हैं। पैनल का वकील साइन किए गए संस्करण की आख़िरी जांच आपके लिए मुफ़्त करता है; खर्च ऐप के विज्ञापन उठाते हैं।", "मसुदा तुम्ही DraftIt मध्ये बनवता. पॅनेलवरील वकील सही केलेल्या आवृत्तीची अंतिम तपासणी तुमच्यासाठी मोफत करतात; खर्च अ‍ॅपमधील जाहिराती उचलतात.", "ముసాయిదా మీరు DraftIt లో తయారు చేస్తారు. సంతకం చేసిన వెర్షన్‌ను ప్యానెల్ న్యాయవాది మీకు ఉచితంగా చివరిసారి తనిఖీ చేస్తారు; ఖర్చు యాప్‌లోని ప్రకటనలదే.", "வரைவை நீங்கள் DraftIt இல் உருவாக்குகிறீர்கள். கையொப்பமிட்ட பதிப்பைக் குழு வழக்கறிஞர் உங்களுக்கு இலவசமாக இறுதியாகச் சரிபார்ப்பார்; செலவைச் செயலியின் விளம்பரங்கள் ஏற்கின்றன.", "ಕರಡನ್ನು ನೀವು DraftIt ನಲ್ಲಿ ಮಾಡುತ್ತೀರಿ. ಸಹಿ ಮಾಡಿದ ಆವೃತ್ತಿಯನ್ನು ಪ್ಯಾನೆಲ್ ವಕೀಲರು ನಿಮಗೆ ಉಚಿತವಾಗಿ ಕೊನೆಯ ಬಾರಿ ಪರಿಶೀಲಿಸುತ್ತಾರೆ; ವೆಚ್ಚವನ್ನು ಆ್ಯಪ್‌ನ ಜಾಹೀರಾತುಗಳು ಭರಿಸುತ್ತವೆ."],

noVoice:["No voice for this language on this phone. Android: Settings › Text-to-speech › install the language. iPhone: Settings › Accessibility › Spoken Content › Voices.","इस फ़ोन में इस भाषा की आवाज़ नहीं है। Android: सेटिंग्स › टेक्स्ट-टू-स्पीच › भाषा इंस्टॉल करें। iPhone: सेटिंग्स › एक्सेसिबिलिटी › स्पोकन कंटेंट › वॉइस।","या फोनवर या भाषेचा आवाज नाही. Android: सेटिंग्ज › टेक्स्ट-टू-स्पीच › भाषा इंस्टॉल करा. iPhone: सेटिंग्ज › अ‍ॅक्सेसिबिलिटी › स्पोकन कंटेंट › व्हॉइसेस.","ఈ ఫోన్‌లో ఈ భాష స్వరం లేదు. Android: సెట్టింగ్‌లు › టెక్స్ట్-టు-స్పీచ్ › భాషను ఇన్‌స్టాల్ చేయండి. iPhone: సెట్టింగ్‌లు › యాక్సెసిబిలిటీ › స్పోకెన్ కంటెంట్ › వాయిసెస్.","இந்த போனில் இந்த மொழிக்கான குரல் இல்லை. Android: அமைப்புகள் › உரையிலிருந்து பேச்சு › மொழியை நிறுவவும். iPhone: அமைப்புகள் › அணுகல்தன்மை › பேசப்படும் உள்ளடக்கம் › குரல்கள்.","ಈ ಫೋನ್‌ನಲ್ಲಿ ಈ ಭಾಷೆಯ ಧ್ವನಿ ಇಲ್ಲ. Android: ಸೆಟ್ಟಿಂಗ್‌ಗಳು › ಟೆಕ್ಸ್ಟ್-ಟು-ಸ್ಪೀಚ್ › ಭಾಷೆ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ. iPhone: ಸೆಟ್ಟಿಂಗ್‌ಗಳು › ಆಕ್ಸೆಸಿಬಿಲಿಟಿ › ಸ್ಪೋಕನ್ ಕಂಟೆಂಟ್ › ವಾಯ್ಸ್‌ಗಳು."],

aiOn:["Available. It asks your permission the first time.","उपलब्ध है। पहली बार आपकी अनुमति मांगेगा।","उपलब्ध आहे. पहिल्यांदा तुमची परवानगी मागेल.","అందుబాటులో ఉంది. మొదటిసారి మీ అనుమతి అడుగుతుంది.","கிடைக்கிறது. முதல் முறை உங்கள் அனுமதியைக் கேட்கும்.","ಲಭ್ಯವಿದೆ. ಮೊದಲ ಬಾರಿ ನಿಮ್ಮ ಅನುಮತಿ ಕೇಳುತ್ತದೆ."],
aiOff:["Not available here. Basic offline reading is used.","यहां उपलब्ध नहीं। सामान्य ऑफ़लाइन पढ़ाई होगी।","इथे उपलब्ध नाही. साधे ऑफलाइन वाचन वापरले जाईल.","ఇక్కడ అందుబాటులో లేదు. సాధారణ ఆఫ్‌లైన్ పఠనం వాడతాం.","இங்கு கிடைக்கவில்லை. அடிப்படை ஆஃப்லைன் வாசிப்பு பயன்படும்.","ಇಲ್ಲಿ ಲಭ್ಯವಿಲ್ಲ. ಸಾಮಾನ್ಯ ಆಫ್‌ಲೈನ್ ಓದು ಬಳಸಲಾಗುತ್ತದೆ."],
legalNotes:["Is this legally valid?","क्या यह कानूनी रूप से मान्य है?","हे कायदेशीर आहे का?","ఇది చట్టపరంగా చెల్లుతుందా?","இது சட்டப்படி செல்லுமா?","ಇದು ಕಾನೂನುಬದ್ಧವೇ?"],
legal1:["Chats and voice notes are electronic records under Section 63 of the Bharatiya Sakshya Adhiniyam, 2023. In court they need a certificate that states their hash value. DraftIt saves this hash when you upload.", "चैट और वॉइस नोट भारतीय साक्ष्य अधिनियम, 2023 की धारा 63 के तहत इलेक्ट्रॉनिक रिकॉर्ड हैं। अदालत में इनके साथ एक सर्टिफ़िकेट चाहिए जिसमें इनका हैश वैल्यू लिखा हो। DraftIt अपलोड के समय यह हैश सेव करता है।", "चॅट आणि व्हॉइस नोट भारतीय साक्ष्य अधिनियम, 2023 च्या कलम 63 नुसार इलेक्ट्रॉनिक नोंदी आहेत. न्यायालयात त्यांच्यासोबत हॅश मूल्य नमूद केलेले प्रमाणपत्र लागते. DraftIt अपलोड करतानाच हा हॅश जतन करतो.", "చాట్‌లు, వాయిస్ నోట్‌లు భారతీయ సాక్ష్య అధినియం, 2023 సెక్షన్ 63 ప్రకారం ఎలక్ట్రానిక్ రికార్డులు. కోర్టులో వాటి హ్యాష్ విలువ ఉన్న సర్టిఫికెట్ కావాలి. అప్‌లోడ్ చేసినప్పుడే DraftIt ఈ హ్యాష్‌ను సేవ్ చేస్తుంది.", "அரட்டைகளும் குரல் பதிவுகளும் பாரதிய சாக்ஷ்ய அதினியம், 2023 பிரிவு 63இன் கீழ் மின்னணுப் பதிவுகள். நீதிமன்றத்தில் அவற்றின் ஹாஷ் மதிப்பைக் குறிப்பிடும் சான்றிதழ் தேவை. பதிவேற்றும்போதே DraftIt இந்த ஹாஷைச் சேமிக்கிறது.", "ಚಾಟ್ ಮತ್ತು ವಾಯ್ಸ್ ನೋಟ್‌ಗಳು ಭಾರತೀಯ ಸಾಕ್ಷ್ಯ ಅಧಿನಿಯಮ, 2023ರ ಸೆಕ್ಷನ್ 63ರಡಿ ಎಲೆಕ್ಟ್ರಾನಿಕ್ ದಾಖಲೆಗಳು. ನ್ಯಾಯಾಲಯದಲ್ಲಿ ಅವುಗಳ ಹ್ಯಾಶ್ ಮೌಲ್ಯ ತಿಳಿಸುವ ಪ್ರಮಾಣಪತ್ರ ಬೇಕು. ಅಪ್‌ಲೋಡ್ ಮಾಡುವಾಗಲೇ DraftIt ಈ ಹ್ಯಾಶ್ ಉಳಿಸುತ್ತದೆ."],
legal2:["Secretly recording someone can break their right to privacy. DraftIt only accepts a recording if you were part of the talk and the other side sent it or knew.", "किसी की चुपके से रिकॉर्डिंग उसकी निजता के अधिकार का उल्लंघन हो सकती है। DraftIt रिकॉर्डिंग तभी लेता है जब आप बातचीत में शामिल थे और दूसरी तरफ़ ने उसे भेजा या उन्हें पता था।", "एखाद्याचे गुपचूप रेकॉर्डिंग त्याच्या खासगीपणाच्या हक्काचे उल्लंघन ठरू शकते. तुम्ही संभाषणात होता आणि दुसऱ्या बाजूने ते पाठवले किंवा त्यांना माहीत होते, तरच DraftIt रेकॉर्डिंग स्वीकारतो.", "ఎవరినైనా రహస్యంగా రికార్డ్ చేయడం వారి గోప్యత హక్కును ఉల్లంఘించవచ్చు. మీరు ఆ సంభాషణలో ఉండి, అవతలి వారు పంపినా లేదా వారికి తెలిసినా మాత్రమే DraftIt రికార్డింగ్‌ను తీసుకుంటుంది.", "ஒருவரை ரகசியமாகப் பதிவு செய்வது அவரது தனியுரிமையை மீறலாம். நீங்கள் உரையாடலில் இருந்து, மறுதரப்பு அனுப்பியிருந்தால் அல்லது அவருக்குத் தெரிந்திருந்தால் மட்டுமே DraftIt பதிவை ஏற்கும்.", "ಯಾರನ್ನಾದರೂ ಗುಟ್ಟಾಗಿ ರೆಕಾರ್ಡ್ ಮಾಡುವುದು ಅವರ ಖಾಸಗಿತನದ ಹಕ್ಕನ್ನು ಉಲ್ಲಂಘಿಸಬಹುದು. ನೀವು ಮಾತುಕತೆಯಲ್ಲಿದ್ದು, ಇನ್ನೊಬ್ಬರು ಕಳುಹಿಸಿದ್ದರೆ ಅಥವಾ ಅವರಿಗೆ ಗೊತ್ತಿದ್ದರೆ ಮಾತ್ರ DraftIt ರೆಕಾರ್ಡಿಂಗ್ ಸ್ವೀಕರಿಸುತ್ತದೆ."],
legal3:["The IT Act, 2000 makes electronic contracts valid. Aadhaar eSign is the strongest e-signature; a drawn signature carries less weight.","आईटी अधिनियम, 2000 इलेक्ट्रॉनिक अनुबंधों को मान्य बनाता है। आधार ई-साइन सबसे मज़बूत ई-हस्ताक्षर है; हाथ से बने हस्ताक्षर का वज़न कम होता है।","आयटी कायदा, 2000 इलेक्ट्रॉनिक करार वैध ठरवतो. आधार ई-साइन ही सर्वात भक्कम ई-सही आहे; हाताने केलेल्या सहीचे वजन कमी असते.","ఐటీ చట్టం, 2000 ఎలక్ట్రానిక్ ఒప్పందాలను చెల్లుబాటు చేస్తుంది. ఆధార్ ఈ-సైన్ బలమైన ఈ-సంతకం; చేతితో చేసిన సంతకానికి బలం తక్కువ.","தகவல் தொழில்நுட்பச் சட்டம், 2000 மின்னணு ஒப்பந்தங்களைச் செல்லுபடியாக்குகிறது. ஆதார் இ-சைன் வலுவான மின் கையொப்பம்; கையால் இட்ட கையொப்பத்திற்கு வலு குறைவு.","ಐಟಿ ಕಾಯ್ದೆ, 2000 ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಒಪ್ಪಂದಗಳನ್ನು ಮಾನ್ಯ ಮಾಡುತ್ತದೆ. ಆಧಾರ್ ಇ-ಸೈನ್ ಅತ್ಯಂತ ಬಲವಾದ ಇ-ಸಹಿ; ಕೈಯಿಂದ ಮಾಡಿದ ಸಹಿಗೆ ತೂಕ ಕಡಿಮೆ."],
legal4:["DraftIt keeps records. It is not legal advice.", "DraftIt रिकॉर्ड रखता है। यह कानूनी सलाह नहीं है।", "DraftIt नोंदी ठेवतो. हा कायदेशीर सल्ला नाही.", "DraftIt రికార్డులు భద్రపరుస్తుంది. ఇది న్యాయ సలహా కాదు.", "DraftIt பதிவுகளை வைத்திருக்கிறது. இது சட்ட ஆலோசனை அல்ல.", "DraftIt ದಾಖಲೆ ಇಡುತ್ತದೆ. ಇದು ಕಾನೂನು ಸಲಹೆ ಅಲ್ಲ."],

resetSure:["Tap again to confirm","पक्का करने के लिए फिर दबाएं","खात्री करण्यासाठी पुन्हा दाबा","నిర్ధారించడానికి మళ్లీ నొక్కండి","உறுதிப்படுத்த மீண்டும் அழுத்தவும்","ಖಚಿತಪಡಿಸಲು ಮತ್ತೆ ಒತ್ತಿ"],

editNote:["{name} will see the change marked and can accept or reject it.","{name} को बदलाव दिखेगा और वे उसे मंज़ूर या नामंज़ूर कर सकेंगे।","{name} यांना बदल दिसेल आणि ते स्वीकारू किंवा नाकारू शकतील.","{name}కి మార్పు కనిపిస్తుంది, వారు అంగీకరించవచ్చు లేదా తిరస్కరించవచ్చు.","{name} மாற்றத்தைப் பார்த்து ஏற்கலாம் அல்லது நிராகரிக்கலாம்.","{name} ಅವರಿಗೆ ಬದಲಾವಣೆ ಕಾಣುತ್ತದೆ, ಅವರು ಒಪ್ಪಬಹುದು ಅಥವಾ ತಿರಸ್ಕರಿಸಬಹುದು."],
signingVersion:["You are signing version {n}. Your signature is tied to this exact text.","आप संस्करण {n} पर साइन कर रहे हैं। आपका हस्ताक्षर इसी टेक्स्ट से जुड़ा है।","तुम्ही आवृत्ती {n} वर सही करत आहात. तुमची सही याच मजकुराशी जोडलेली आहे.","మీరు వెర్షన్ {n}పై సంతకం చేస్తున్నారు. మీ సంతకం ఈ పాఠానికే ముడిపడి ఉంటుంది.","நீங்கள் பதிப்பு {n} இல் கையொப்பமிடுகிறீர்கள். உங்கள் கையொப்பம் இதே உரையுடன் இணைக்கப்படும்.","ನೀವು ಆವೃತ್ತಿ {n}ಗೆ ಸಹಿ ಮಾಡುತ್ತಿದ್ದೀರಿ. ನಿಮ್ಮ ಸಹಿ ಇದೇ ಪಠ್ಯಕ್ಕೆ ಜೋಡಿಸಲಾಗುತ್ತದೆ."],
method:["Method","तरीका","पद्धत","పద్ధతి","முறை","ವಿಧಾನ"],
drawSub:["Works now. Less legal weight than Aadhaar eSign.","अभी काम करता है। आधार ई-साइन से कम कानूनी वज़न।","आत्ता चालते. आधार ई-साइनपेक्षा कमी कायदेशीर वजन.","ఇప్పుడే పనిచేస్తుంది. ఆధార్ ఈ-సైన్ కంటే తక్కువ చట్ట బలం.","இப்போதே வேலை செய்யும். ஆதார் இ-சைனை விடச் சட்ட வலு குறைவு.","ಈಗಲೇ ಕೆಲಸ ಮಾಡುತ್ತದೆ. ಆಧಾರ್ ಇ-ಸೈನ್‌ಗಿಂತ ಕಡಿಮೆ ಕಾನೂನು ತೂಕ."],
aadhaarSub:["OTP to your Aadhaar-linked mobile. Simulated in this demo.","आधार से जुड़े मोबाइल पर OTP। इस डेमो में नकली।","आधारशी जोडलेल्या मोबाइलवर OTP. या डेमोमध्ये नकली.","ఆధార్‌తో లింక్ అయిన మొబైల్‌కు OTP. ఈ డెమోలో నమూనా మాత్రమే.","ஆதாருடன் இணைந்த மொபைலுக்கு OTP. இந்த டெமோவில் போலியாக.","ಆಧಾರ್ ಲಿಂಕ್ ಆದ ಮೊಬೈಲ್‌ಗೆ OTP. ಈ ಡೆಮೊದಲ್ಲಿ ನಕಲಿ."],

lawyerAfter:["After both sides sign, a panel lawyer can check and certify the agreement for a fixed fee.","दोनों के साइन के बाद पैनल का वकील तय फ़ीस पर समझौते की जांच और प्रमाणन कर सकता है।","दोघांच्या सह्यांनंतर पॅनेलवरील वकील ठराविक शुल्कात कराराची तपासणी व प्रमाणन करू शकतात.","ఇద్దరూ సంతకం చేశాక ప్యానెల్ న్యాయవాది నిర్ణీత ఫీజుతో ఒప్పందాన్ని తనిఖీ చేసి ధృవీకరిస్తారు.","இருவரும் கையொப்பமிட்ட பின், குழு வழக்கறிஞர் நிர்ணயக் கட்டணத்தில் ஒப்பந்தத்தைச் சரிபார்த்துச் சான்றளிக்கலாம்.","ಇಬ್ಬರೂ ಸಹಿ ಮಾಡಿದ ನಂತರ ಪ್ಯಾನೆಲ್ ವಕೀಲರು ನಿಗದಿತ ಶುಲ್ಕಕ್ಕೆ ಒಪ್ಪಂದವನ್ನು ಪರಿಶೀಲಿಸಿ ಪ್ರಮಾಣೀಕರಿಸಬಹುದು."],
requestCheck:["Request lawyer check","वकील जांच मांगें","वकील तपासणी मागा","న్యాయవాది తనిఖీ కోరండి","வழக்கறிஞர் சரிபார்ப்பைக் கோரு","ವಕೀಲ ಪರಿಶೀಲನೆ ಕೇಳಿ"],
lawyerIntro:["Draft with DraftIt for free. When you want certainty, a panel lawyer checks the signed version for a fixed fee, and a notary can attest it in person.", "मसौदा DraftIt पर मुफ़्त बनाएं। पक्के भरोसे के लिए पैनल का वकील तय फ़ीस पर साइन किया संस्करण जांचता है, और नोटरी व्यक्तिगत रूप से सत्यापित कर सकता है।", "मसुदा DraftIt वर मोफत बनवा. खात्रीसाठी पॅनेलवरील वकील ठराविक शुल्कात सही केलेली आवृत्ती तपासतात आणि नोटरी प्रत्यक्ष साक्षांकन करू शकतात.", "ముసాయిదా DraftIt లో ఉచితం. నమ్మకం కోసం ప్యానెల్ న్యాయవాది నిర్ణీత ఫీజుతో సంతకం చేసిన వెర్షన్‌ను తనిఖీ చేస్తారు, నోటరీ స్వయంగా ధృవీకరించవచ్చు.", "வரைவு DraftIt இல் இலவசம். உறுதிக்கு, குழு வழக்கறிஞர் நிர்ணயக் கட்டணத்தில் கையொப்பமிட்ட பதிப்பைச் சரிபார்ப்பார்; நோட்டரி நேரில் சான்றளிக்கலாம்.", "ಕರಡು DraftIt ನಲ್ಲಿ ಉಚಿತ. ಖಚಿತತೆಗಾಗಿ ಪ್ಯಾನೆಲ್ ವಕೀಲರು ನಿಗದಿತ ಶುಲ್ಕಕ್ಕೆ ಸಹಿ ಮಾಡಿದ ಆವೃತ್ತಿಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತಾರೆ; ನೋಟರಿ ಖುದ್ದಾಗಿ ದೃಢೀಕರಿಸಬಹುದು."],
lawyerReqText:["The lawyer reads this version, its chats and the standards checks, then certifies it with a digital signature or sends notes.","वकील यह संस्करण, इसकी चैट और मानकों की जांच पढ़कर डिजिटल हस्ताक्षर से प्रमाणित करता है या सुझाव भेजता है।","वकील ही आवृत्ती, तिचे चॅट आणि मानकांची तपासणी वाचून डिजिटल सहीने प्रमाणित करतात किंवा सूचना पाठवतात.","న్యాయవాది ఈ వెర్షన్, చాట్‌లు, ప్రమాణాల తనిఖీ చదివి డిజిటల్ సంతకంతో ధృవీకరిస్తారు లేదా సూచనలు పంపుతారు.","வழக்கறிஞர் இந்தப் பதிப்பு, அரட்டைகள், தரநிலைச் சரிபார்ப்புகளைப் படித்து டிஜிட்டல் கையொப்பத்துடன் சான்றளிப்பார் அல்லது குறிப்புகள் அனுப்புவார்.","ವಕೀಲರು ಈ ಆವೃತ್ತಿ, ಚಾಟ್‌ಗಳು ಮತ್ತು ಮಾನದಂಡ ಪರಿಶೀಲನೆಯನ್ನು ಓದಿ ಡಿಜಿಟಲ್ ಸಹಿಯೊಂದಿಗೆ ಪ್ರಮಾಣೀಕರಿಸುತ್ತಾರೆ ಅಥವಾ ಸಲಹೆ ಕಳುಹಿಸುತ್ತಾರೆ."],
welcomeTag:["Turn WhatsApp deals into clear, signed agreements.","WhatsApp पर हुए सौदों को साफ़, साइन किए समझौतों में बदलें।","WhatsApp वरील व्यवहारांचे स्पष्ट, सही केलेल्या करारात रूपांतर करा.","WhatsApp డీల్స్‌ను స్పష్టమైన, సంతకం చేసిన ఒప్పందాలుగా మార్చండి.","WhatsApp ஒப்பந்தங்களைத் தெளிவான, கையொப்பமிட்ட ஒப்பந்தங்களாக மாற்றுங்கள்.","WhatsApp ವ್ಯವಹಾರಗಳನ್ನು ಸ್ಪಷ್ಟ, ಸಹಿ ಮಾಡಿದ ಒಪ್ಪಂದಗಳಾಗಿ ಮಾಡಿ."],

agreeTerms:["I agree to the Terms of use and the Privacy notice.","मैं उपयोग की शर्तों और गोपनीयता सूचना से सहमत हूं।","मी वापराच्या अटी आणि गोपनीयता सूचनेशी सहमत आहे.","వినియోగ నిబంధనలు, గోప్యతా నోటీసుకు నేను అంగీకరిస్తున్నాను.","பயன்பாட்டு விதிமுறைகள் மற்றும் தனியுரிமை அறிவிப்புக்கு ஒப்புக்கொள்கிறேன்.","ಬಳಕೆಯ ನಿಯಮಗಳು ಮತ್ತು ಗೌಪ್ಯತಾ ಸೂಚನೆಗೆ ನಾನು ಒಪ್ಪುತ್ತೇನೆ."],

trainConsent:["Allow DraftIt to use my anonymised chats and agreements to train and improve its AI. Optional. You can change this any time in Settings.", "DraftIt को मेरी गुमनाम की गई चैट और समझौतों से अपना AI सिखाने और बेहतर करने की अनुमति दें। वैकल्पिक। सेटिंग्स में कभी भी बदल सकते हैं।", "DraftIt ला माझे अनामिक केलेले चॅट आणि करार वापरून AI शिकवण्याची व सुधारण्याची परवानगी द्या. ऐच्छिक. सेटिंग्जमध्ये कधीही बदलू शकता.", "నా పేరు తీసివేసిన చాట్‌లు, ఒప్పందాలతో AIకి శిక్షణ ఇచ్చి మెరుగుపరచడానికి DraftIt కు అనుమతి. ఐచ్ఛికం. సెట్టింగ్‌లలో ఎప్పుడైనా మార్చవచ్చు.", "பெயர் நீக்கிய என் அரட்டைகள், ஒப்பந்தங்களைக் கொண்டு AI ஐப் பயிற்றுவித்து மேம்படுத்தப் DraftIt க்கு அனுமதி. விருப்பம் மட்டும். அமைப்புகளில் எப்போதும் மாற்றலாம்.", "ಹೆಸರು ತೆಗೆದ ನನ್ನ ಚಾಟ್ ಮತ್ತು ಒಪ್ಪಂದಗಳಿಂದ AI ಕಲಿಸಲು ಮತ್ತು ಸುಧಾರಿಸಲು DraftIt ಗೆ ಅನುಮತಿ. ಐಚ್ಛಿಕ. ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಯಾವಾಗ ಬೇಕಾದರೂ ಬದಲಿಸಬಹುದು."],

emptyDeals:["No deals yet. Add the chat of your first deal.","अभी कोई सौदा नहीं। अपने पहले सौदे की चैट जोड़ें।","अजून व्यवहार नाही. पहिल्या व्यवहाराचे चॅट जोडा.","ఇంకా డీల్స్ లేవు. మీ మొదటి డీల్ చాట్ జోడించండి.","இன்னும் ஒப்பந்தங்கள் இல்லை. முதல் ஒப்பந்தத்தின் அரட்டையைச் சேருங்கள்.","ಇನ್ನೂ ವ್ಯವಹಾರಗಳಿಲ್ಲ. ಮೊದಲ ವ್ಯವಹಾರದ ಚಾಟ್ ಸೇರಿಸಿ."],

tut1T:["Add your chat","अपनी चैट जोड़ें","तुमचे चॅट जोडा","మీ చాట్ జోడించండి","உங்கள் அரட்டையைச் சேருங்கள்","ನಿಮ್ಮ ಚಾಟ್ ಸೇರಿಸಿ"],
tut1B:["Paste or upload the WhatsApp chat, a voice note, a bill or a photo. DraftIt keeps the original exactly as it is.", "WhatsApp चैट, वॉइस नोट, बिल या फ़ोटो पेस्ट या अपलोड करें। DraftIt मूल को बिल्कुल वैसा ही रखता है।", "WhatsApp चॅट, व्हॉइस नोट, बिल किंवा फोटो पेस्ट किंवा अपलोड करा. DraftIt मूळ जसेच्या तसे ठेवतो.", "WhatsApp చాట్, వాయిస్ నోట్, బిల్ లేదా ఫోటోను పేస్ట్ లేదా అప్‌లోడ్ చేయండి. DraftIt అసలును ఉన్నది ఉన్నట్లే ఉంచుతుంది.", "WhatsApp அரட்டை, குரல் பதிவு, பில் அல்லது புகைப்படத்தை ஒட்டவும் அல்லது பதிவேற்றவும். DraftIt அசலை அப்படியே வைக்கும்.", "WhatsApp ಚಾಟ್, ವಾಯ್ಸ್ ನೋಟ್, ಬಿಲ್ ಅಥವಾ ಫೋಟೋ ಅಂಟಿಸಿ ಅಥವಾ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ. DraftIt ಮೂಲವನ್ನು ಇದ್ದಂತೆಯೇ ಇಡುತ್ತದೆ."],
tut2T:["See what is settled","देखें क्या तय हुआ","काय ठरले ते पाहा","ఏమి ఖరారైందో చూడండి","எது உறுதியானது என்று பாருங்கள்","ಏನು ಖಚಿತವಾಗಿದೆ ನೋಡಿ"],
tut2B:["DraftIt shows what both sides agreed, what is waiting for a reply, and what nobody has discussed. It also checks the deal against Indian laws and standards.", "DraftIt दिखाता है कि दोनों ने क्या तय किया, किस पर जवाब बाकी है, और किस पर बात ही नहीं हुई। यह सौदे को भारतीय कानूनों और मानकों से भी जांचता है।", "DraftIt दाखवतो की दोघांनी काय ठरवले, कशावर उत्तर बाकी आहे आणि कशावर चर्चाच झाली नाही. तो व्यवहार भारतीय कायदे व मानकांशीही तपासतो.", "ఇద్దరూ ఏమి ఒప్పుకున్నారు, దేనికి సమాధానం రావాలి, దేని గురించి మాట్లాడలేదు అని DraftIt చూపుతుంది. డీల్‌ను భారతీయ చట్టాలు, ప్రమాణాలతో కూడా తనిఖీ చేస్తుంది.", "இருவரும் எதை ஒப்புக்கொண்டனர், எதற்குப் பதில் வரவில்லை, எதைப் பற்றிப் பேசவில்லை என்று DraftIt காட்டும். ஒப்பந்தத்தை இந்தியச் சட்டங்கள், தரநிலைகளுடனும் சரிபார்க்கும்.", "ಇಬ್ಬರೂ ಏನು ಒಪ್ಪಿದರು, ಯಾವುದಕ್ಕೆ ಉತ್ತರ ಬಾಕಿ, ಯಾವುದರ ಬಗ್ಗೆ ಮಾತಾಡಿಲ್ಲ ಎಂದು DraftIt ತೋರಿಸುತ್ತದೆ. ವ್ಯವಹಾರವನ್ನು ಭಾರತೀಯ ಕಾನೂನು ಮತ್ತು ಮಾನದಂಡಗಳೊಂದಿಗೆ ಪರಿಶೀಲಿಸುತ್ತದೆ."],
tut3T:["Settle points the friendly way","आसानी से बातें तय करें","सहजपणे गोष्टी ठरवा","స్నేహపూర్వకంగా తేల్చండి","நட்பான முறையில் தீர்த்துக்கொள்ளுங்கள்","ಸ್ನೇಹಪರವಾಗಿ ತೀರ್ಮಾನಿಸಿ"],
tut3B:["For every open point, copy a ready WhatsApp message, or talk in the live chat room where DraftIt suggests what to ask next.", "हर खुली बात के लिए तैयार WhatsApp मैसेज कॉपी करें, या लाइव चैट रूम में बात करें जहां DraftIt अगला सवाल सुझाता है।", "प्रत्येक खुल्या गोष्टीसाठी तयार WhatsApp संदेश कॉपी करा, किंवा लाइव्ह चॅट रूममध्ये बोला जिथे DraftIt पुढचा प्रश्न सुचवतो.", "ప్రతి తేలని అంశానికి సిద్ధంగా ఉన్న WhatsApp సందేశం కాపీ చేయండి, లేదా లైవ్ చాట్ రూమ్‌లో మాట్లాడండి, అక్కడ DraftIt తర్వాత ఏమి అడగాలో సూచిస్తుంది.", "ஒவ்வொரு திறந்த விஷயத்துக்கும் தயார் WhatsApp செய்தியை நகலெடுக்கவும், அல்லது நேரலை அரட்டை அறையில் பேசவும்; அங்கே அடுத்து என்ன கேட்பது என்று DraftIt பரிந்துரைக்கும்.", "ಪ್ರತಿ ತೆರೆದ ಅಂಶಕ್ಕೆ ಸಿದ್ಧ WhatsApp ಸಂದೇಶ ನಕಲಿಸಿ, ಅಥವಾ ಲೈವ್ ಚಾಟ್ ರೂಮ್‌ನಲ್ಲಿ ಮಾತಾಡಿ; ಅಲ್ಲಿ ಮುಂದೇನು ಕೇಳಬೇಕು ಎಂದು DraftIt ಸೂಚಿಸುತ್ತದೆ."],
tut4T:["Sign a court-ready agreement","अदालत में मान्य समझौता साइन करें","न्यायालयात चालणाऱ्या करारावर सही करा","కోర్టులో చెల్లే ఒప్పందంపై సంతకం చేయండి","நீதிமன்றத்தில் செல்லும் ஒப்பந்தத்தில் கையொப்பமிடுங்கள்","ನ್ಯಾಯಾಲಯದಲ್ಲಿ ಮಾನ್ಯವಾದ ಒಪ್ಪಂದಕ್ಕೆ ಸಹಿ ಮಾಡಿ"],
tut4B:["DraftIt writes a simple summary and a formal agreement. Both sides sign, every version gets a fingerprint, and a lawyer can certify it.", "DraftIt एक आसान सारांश और एक औपचारिक समझौता लिखता है। दोनों साइन करते हैं, हर संस्करण का फिंगरप्रिंट बनता है, और वकील प्रमाणित कर सकता है।", "DraftIt सोपा सारांश आणि औपचारिक करार लिहितो. दोघे सही करतात, प्रत्येक आवृत्तीचा फिंगरप्रिंट बनतो आणि वकील प्रमाणित करू शकतात.", "DraftIt సులభమైన సారాంశం, అధికారిక ఒప్పందం రాస్తుంది. ఇద్దరూ సంతకం చేస్తారు, ప్రతి వెర్షన్‌కు ఫింగర్‌ప్రింట్ వస్తుంది, న్యాయవాది ధృవీకరించవచ్చు.", "DraftIt எளிய சுருக்கமும் முறையான ஒப்பந்தமும் எழுதும். இருவரும் கையொப்பமிடுவர், ஒவ்வொரு பதிப்புக்கும் கைரேகை கிடைக்கும், வழக்கறிஞர் சான்றளிக்கலாம்.", "DraftIt ಸರಳ ಸಾರಾಂಶ ಮತ್ತು ಔಪಚಾರಿಕ ಒಪ್ಪಂದ ಬರೆಯುತ್ತದೆ. ಇಬ್ಬರೂ ಸಹಿ ಮಾಡುತ್ತಾರೆ, ಪ್ರತಿ ಆವೃತ್ತಿಗೆ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ ಸಿಗುತ್ತದೆ, ವಕೀಲರು ಪ್ರಮಾಣೀಕರಿಸಬಹುದು."],
tut5T:["Get help if things go wrong","कुछ गलत हो तो मदद लें","काही चुकले तर मदत घ्या","ఏదైనా తప్పు జరిగితే సాయం పొందండి","ஏதாவது தவறானால் உதவி பெறுங்கள்","ಏನಾದರೂ ತಪ್ಪಾದರೆ ಸಹಾಯ ಪಡೆಯಿರಿ"],
tut5B:["Tap Report on a deal if you are cheated, or Raise a dispute if you cannot agree. DraftIt seals the evidence and shows where to complain.", "धोखा हो तो सौदे पर रिपोर्ट दबाएं, या असहमति हो तो विवाद उठाएं। DraftIt सबूत सील करता है और बताता है कहां शिकायत करें।", "फसवणूक झाली तर व्यवहारावर तक्रार दाबा, किंवा मतभेद असल्यास वाद नोंदवा. DraftIt पुरावे सील करतो आणि कुठे तक्रार करायची ते सांगतो.", "మోసం జరిగితే డీల్‌పై ఫిర్యాదు నొక్కండి, ఒప్పందం కుదరకపోతే వివాదం లేవనెత్తండి. DraftIt సాక్ష్యాన్ని సీల్ చేసి ఎక్కడ ఫిర్యాదు చేయాలో చూపుతుంది.", "ஏமாற்றப்பட்டால் ஒப்பந்தத்தில் புகார் அழுத்துங்கள், ஒத்துப்போகாவிட்டால் தகராறை எழுப்புங்கள். DraftIt சான்றுகளை முத்திரையிட்டு எங்கே புகார் செய்வது என்று காட்டும்.", "ಮೋಸವಾದರೆ ವ್ಯವಹಾರದಲ್ಲಿ ದೂರು ಒತ್ತಿ, ಒಪ್ಪಿಗೆ ಆಗದಿದ್ದರೆ ವಿವಾದ ಎತ್ತಿ. DraftIt ಸಾಕ್ಷ್ಯವನ್ನು ಮೊಹರು ಮಾಡಿ ಎಲ್ಲಿ ದೂರು ನೀಡಬೇಕು ಎಂದು ತೋರಿಸುತ್ತದೆ."],
reportShort:["Report","रिपोर्ट","तक्रार","ఫిర్యాదు","புகார்","ದೂರು"],

rs_nogoods:["I paid but got nothing, or fake goods","मैंने पैसे दिए पर कुछ नहीं मिला, या नकली सामान मिला","मी पैसे दिले पण काही मिळाले नाही, किंवा बनावट माल मिळाला","నేను డబ్బు ఇచ్చాను కానీ ఏమీ రాలేదు, లేదా నకిలీ సరుకు వచ్చింది","பணம் தந்தேன், எதுவும் வரவில்லை அல்லது போலிப் பொருள் வந்தது","ನಾನು ಹಣ ಕೊಟ್ಟೆ, ಏನೂ ಬರಲಿಲ್ಲ ಅಥವಾ ನಕಲಿ ಸರಕು ಬಂತು"],

rsCall:["Call 1930, the National Cyber Crime Helpline. Then file the complaint at cybercrime.gov.in within 24 hours, using the acknowledgement number you get by SMS.","1930 पर कॉल करें, यह राष्ट्रीय साइबर अपराध हेल्पलाइन है। फिर SMS से मिले पावती नंबर के साथ 24 घंटे के अंदर cybercrime.gov.in पर शिकायत दर्ज करें।","1930 वर कॉल करा, ही राष्ट्रीय सायबर गुन्हे हेल्पलाइन आहे. मग SMS ने मिळालेल्या पोच क्रमांकासह 24 तासांत cybercrime.gov.in वर तक्रार नोंदवा.","1930కి కాల్ చేయండి, ఇది జాతీయ సైబర్ క్రైమ్ హెల్ప్‌లైన్. తర్వాత SMSలో వచ్చిన రసీదు నంబర్‌తో 24 గంటల్లో cybercrime.gov.inలో ఫిర్యాదు నమోదు చేయండి.","1930 ஐ அழையுங்கள், இது தேசிய சைபர் குற்ற உதவி எண். பின்னர் SMS இல் வரும் ஒப்புகை எண்ணுடன் 24 மணி நேரத்தில் cybercrime.gov.in இல் புகார் பதிவு செய்யுங்கள்.","1930ಗೆ ಕರೆ ಮಾಡಿ, ಇದು ರಾಷ್ಟ್ರೀಯ ಸೈಬರ್ ಅಪರಾಧ ಸಹಾಯವಾಣಿ. ನಂತರ SMS ನಲ್ಲಿ ಬರುವ ಸ್ವೀಕೃತಿ ಸಂಖ್ಯೆಯೊಂದಿಗೆ 24 ಗಂಟೆಗಳಲ್ಲಿ cybercrime.gov.in ನಲ್ಲಿ ದೂರು ದಾಖಲಿಸಿ."],
rsBank:["Tell your bank or UPI app at once, so they can try to hold the money.","तुरंत अपने बैंक या UPI ऐप को बताएं, ताकि वे पैसे रोकने की कोशिश कर सकें।","लगेच तुमच्या बँकेला किंवा UPI अ‍ॅपला कळवा, म्हणजे ते पैसे थांबवण्याचा प्रयत्न करू शकतील.","వెంటనే మీ బ్యాంక్ లేదా UPI యాప్‌కు చెప్పండి, వారు డబ్బును ఆపడానికి ప్రయత్నిస్తారు.","உடனே உங்கள் வங்கி அல்லது UPI செயலிக்குத் தெரிவியுங்கள்; அவர்கள் பணத்தை நிறுத்த முயல்வார்கள்.","ತಕ್ಷಣ ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಅಥವಾ UPI ಆ್ಯಪ್‌ಗೆ ತಿಳಿಸಿ, ಅವರು ಹಣ ತಡೆಯಲು ಪ್ರಯತ್ನಿಸುತ್ತಾರೆ."],

rsFreezeNote:["DraftIt seals every chat, version and signature in this deal with one fingerprint, so nothing can be changed later.", "DraftIt इस सौदे की हर चैट, संस्करण और हस्ताक्षर को एक फिंगरप्रिंट से सील करता है, ताकि बाद में कुछ बदला न जा सके।", "DraftIt या व्यवहारातील प्रत्येक चॅट, आवृत्ती आणि सही एका फिंगरप्रिंटने सील करतो, म्हणजे नंतर काहीही बदलता येणार नाही.", "DraftIt ఈ డీల్‌లోని ప్రతి చాట్, వెర్షన్, సంతకాన్ని ఒకే ఫింగర్‌ప్రింట్‌తో సీల్ చేస్తుంది, తర్వాత ఏదీ మార్చలేరు.", "DraftIt இந்த ஒப்பந்தத்தின் ஒவ்வொரு அரட்டை, பதிப்பு, கையொப்பத்தையும் ஒரே கைரேகையால் முத்திரையிடும்; பின்னர் எதையும் மாற்ற முடியாது.", "DraftIt ಈ ವ್ಯವಹಾರದ ಪ್ರತಿ ಚಾಟ್, ಆವೃತ್ತಿ ಮತ್ತು ಸಹಿಯನ್ನು ಒಂದೇ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್‌ನಿಂದ ಮೊಹರು ಮಾಡುತ್ತದೆ; ನಂತರ ಏನನ್ನೂ ಬದಲಿಸಲಾಗದು."],

rsEnglish:["In English, ready to paste into the portal.","अंग्रेज़ी में, पोर्टल में पेस्ट करने के लिए तैयार।","इंग्रजीत, पोर्टलवर पेस्ट करण्यासाठी तयार.","ఇంగ్లీష్‌లో, పోర్టల్‌లో పేస్ట్ చేయడానికి సిద్ధం.","ஆங்கிலத்தில், இணையதளத்தில் ஒட்டத் தயார்.","ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ, ಪೋರ್ಟಲ್‌ಗೆ ಅಂಟಿಸಲು ಸಿದ್ಧ."],
rsSubmit:["Mark this deal as reported","इस सौदे को रिपोर्ट किया मार्क करें","हा व्यवहार तक्रार केलेला म्हणून नोंदवा","ఈ డీల్‌ను ఫిర్యాదు చేసినట్లు గుర్తించండి","இந்த ஒப்பந்தத்தைப் புகாரளித்ததாகக் குறி","ಈ ವ್ಯವಹಾರವನ್ನು ದೂರು ನೀಡಿದ್ದು ಎಂದು ಗುರುತಿಸಿ"],
rsDone:["Deal marked as reported and evidence frozen.","सौदा रिपोर्ट किया मार्क हुआ और सबूत फ़्रीज़ हुए।","व्यवहार तक्रार केलेला म्हणून नोंदवला आणि पुरावे गोठवले.","డీల్‌ను ఫిర్యాదు చేసినట్లు గుర్తించాం, సాక్ష్యం ఫ్రీజ్ అయింది.","ஒப்பந்தம் புகாரளித்ததாகக் குறிக்கப்பட்டது, சான்றுகள் உறையவைக்கப்பட்டன.","ವ್ಯವಹಾರವನ್ನು ದೂರು ನೀಡಿದ್ದು ಎಂದು ಗುರುತಿಸಲಾಗಿದೆ, ಸಾಕ್ಷ್ಯ ಫ್ರೀಜ್ ಆಗಿದೆ."],
rsNote:["DraftIt does not file the police complaint for you. Use the helpline and portal above.", "DraftIt आपकी ओर से पुलिस शिकायत दर्ज नहीं करता। ऊपर दी हेल्पलाइन और पोर्टल का इस्तेमाल करें।", "DraftIt तुमच्या वतीने पोलीस तक्रार नोंदवत नाही. वरील हेल्पलाइन आणि पोर्टल वापरा.", "DraftIt మీ తరఫున పోలీస్ ఫిర్యాదు చేయదు. పైన ఉన్న హెల్ప్‌లైన్, పోర్టల్ వాడండి.", "DraftIt உங்கள் சார்பில் காவல் புகார் செய்யாது. மேலே உள்ள உதவி எண் மற்றும் இணையதளத்தைப் பயன்படுத்துங்கள்.", "DraftIt ನಿಮ್ಮ ಪರವಾಗಿ ಪೊಲೀಸ್ ದೂರು ದಾಖಲಿಸುವುದಿಲ್ಲ. ಮೇಲಿನ ಸಹಾಯವಾಣಿ ಮತ್ತು ಪೋರ್ಟಲ್ ಬಳಸಿ."],
dispBtn:["Can’t agree? Raise a dispute","सहमति नहीं बन रही? विवाद उठाएं","एकमत होत नाही? वाद नोंदवा","ఒప్పందం కుదరడం లేదా? వివాదం లేవనెత్తండి","ஒத்துப்போகவில்லையா? தகராறை எழுப்புங்கள்","ಒಪ್ಪಿಗೆ ಆಗುತ್ತಿಲ್ಲವೇ? ವಿವಾದ ಎತ್ತಿ"],

dispIntro:["Try these in order. Each step is cheaper and faster than the one after it.","इन्हें क्रम से आज़माएं। हर कदम अगले से सस्ता और जल्दी है।","हे क्रमाने वापरा. प्रत्येक पायरी पुढच्यापेक्षा स्वस्त आणि जलद आहे.","వీటిని క్రమంగా ప్రయత్నించండి. ప్రతి దశ తర్వాతి దానికంటే చవకైనది, వేగవంతమైనది.","இவற்றை வரிசையாக முயலுங்கள். ஒவ்வொரு படியும் அடுத்ததை விட மலிவானது, விரைவானது.","ಇವನ್ನು ಕ್ರಮವಾಗಿ ಪ್ರಯತ್ನಿಸಿ. ಪ್ರತಿ ಹಂತವೂ ಮುಂದಿನದಕ್ಕಿಂತ ಅಗ್ಗ ಮತ್ತು ವೇಗ."],
d1T:["Talk it through","बात करके सुलझाएं","बोलून सोडवा","మాట్లాడి పరిష్కరించుకోండి","பேசித் தீர்த்துக்கொள்ளுங்கள்","ಮಾತಾಡಿ ಬಗೆಹರಿಸಿ"],
d1B:["Send a calm message listing what was agreed and what is still open, with the evidence file.","शांत मैसेज भेजें जिसमें लिखा हो कि क्या तय हुआ और क्या बाकी है, साथ में सबूत फ़ाइल।","शांत संदेश पाठवा ज्यात काय ठरले आणि काय बाकी आहे ते असेल, सोबत पुरावा फाइल.","ఏమి ఖరారైంది, ఏమి మిగిలింది అని ప్రశాంతంగా సందేశం పంపండి, సాక్ష్యం ఫైల్‌తో.","எது ஒப்புக்கொள்ளப்பட்டது, எது மீதம் என்று அமைதியான செய்தியைச் சான்றுக் கோப்புடன் அனுப்புங்கள்.","ಏನು ಒಪ್ಪಲಾಗಿದೆ, ಏನು ಬಾಕಿ ಎಂದು ಶಾಂತ ಸಂದೇಶವನ್ನು ಸಾಕ್ಷ್ಯ ಫೈಲ್‌ನೊಂದಿಗೆ ಕಳುಹಿಸಿ."],
d2T:["Mediation","मध्यस्थता","मध्यस्थी","మధ్యవర్తిత్వం","சமரசம்","ಮಧ್ಯಸ್ಥಿಕೆ"],
d2B:["For a commercial dispute, mediation at your District Legal Services Authority must be tried before going to court, unless urgent relief is needed. It takes up to 3 months. (Commercial Courts Act, 2015, s.12A)","व्यावसायिक विवाद में अदालत जाने से पहले ज़िला विधिक सेवा प्राधिकरण में मध्यस्थता आज़मानी होती है, जब तक तुरंत राहत न चाहिए। इसमें 3 महीने तक लगते हैं। (वाणिज्यिक न्यायालय अधिनियम, 2015, धारा 12A)","व्यावसायिक वादात न्यायालयात जाण्यापूर्वी जिल्हा विधी सेवा प्राधिकरणात मध्यस्थी करून पाहावी लागते, तातडीची मदत हवी नसेल तर. यासाठी 3 महिन्यांपर्यंत लागतात. (वाणिज्यिक न्यायालय कायदा, 2015, कलम 12A)","వాణిజ్య వివాదంలో కోర్టుకు వెళ్లే ముందు జిల్లా న్యాయ సేవల ప్రాధికార సంస్థలో మధ్యవర్తిత్వం ప్రయత్నించాలి, అత్యవసర ఉపశమనం అవసరమైతే తప్ప. దీనికి 3 నెలల వరకు పడుతుంది. (వాణిజ్య న్యాయస్థానాల చట్టం, 2015, సెక్షన్ 12A)","வணிகத் தகராறில், அவசர நிவாரணம் தேவைப்படாவிட்டால், நீதிமன்றம் செல்லும் முன் மாவட்டச் சட்டப் பணிகள் ஆணையத்தில் சமரசம் முயல வேண்டும். இதற்கு 3 மாதம் வரை ஆகும். (வணிக நீதிமன்றங்கள் சட்டம், 2015, பிரிவு 12A)","ವಾಣಿಜ್ಯ ವಿವಾದದಲ್ಲಿ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗುವ ಮೊದಲು ಜಿಲ್ಲಾ ಕಾನೂನು ಸೇವಾ ಪ್ರಾಧಿಕಾರದಲ್ಲಿ ಮಧ್ಯಸ್ಥಿಕೆ ಪ್ರಯತ್ನಿಸಬೇಕು, ತುರ್ತು ಪರಿಹಾರ ಬೇಕಿಲ್ಲದಿದ್ದರೆ. ಇದಕ್ಕೆ 3 ತಿಂಗಳವರೆಗೆ ಬೇಕು. (ವಾಣಿಜ್ಯ ನ್ಯಾಯಾಲಯಗಳ ಕಾಯ್ದೆ, 2015, ಸೆಕ್ಷನ್ 12A)"],
d3T:["MSME Samadhaan (unpaid sellers)","MSME समाधान (भुगतान न पाने वाले विक्रेता)","MSME समाधान (पैसे न मिळालेले विक्रेते)","MSME సమాధాన్ (డబ్బు రాని అమ్మకందారులు)","MSME சமாதான் (பணம் பெறாத விற்பவர்கள்)","MSME ಸಮಾಧಾನ್ (ಹಣ ಸಿಗದ ಮಾರಾಟಗಾರರು)"],
d3B:["If you are a Udyam-registered micro or small enterprise and the buyer has not paid within 45 days, file at samadhaan.msme.gov.in. Interest runs at 3 times the RBI bank rate. (MSMED Act, 2006, s.15–16)","अगर आप उद्यम-पंजीकृत सूक्ष्म या लघु उद्यम हैं और खरीदार ने 45 दिन में भुगतान नहीं किया, तो samadhaan.msme.gov.in पर शिकायत करें। ब्याज RBI बैंक दर का 3 गुना लगता है। (MSMED अधिनियम, 2006, धारा 15–16)","तुम्ही उद्यम-नोंदणीकृत सूक्ष्म किंवा लघु उद्योग असाल आणि खरेदीदाराने 45 दिवसांत पैसे दिले नसतील, तर samadhaan.msme.gov.in वर तक्रार करा. व्याज RBI बँक दराच्या 3 पट लागते. (MSMED कायदा, 2006, कलम 15–16)","మీరు ఉద్యమ్‌లో నమోదైన సూక్ష్మ లేదా చిన్న సంస్థ అయి, కొనుగోలుదారు 45 రోజుల్లో చెల్లించకపోతే samadhaan.msme.gov.inలో ఫిర్యాదు చేయండి. వడ్డీ RBI బ్యాంక్ రేటుకు 3 రెట్లు. (MSMED చట్టం, 2006, సెక్షన్ 15–16)","நீங்கள் உத்யம் பதிவு பெற்ற குறு அல்லது சிறு நிறுவனமாக இருந்து, வாங்குபவர் 45 நாட்களில் பணம் தரவில்லையென்றால் samadhaan.msme.gov.in இல் புகார் செய்யுங்கள். வட்டி RBI வங்கி விகிதத்தின் 3 மடங்கு. (MSMED சட்டம், 2006, பிரிவு 15–16)","ನೀವು ಉದ್ಯಮ್ ನೋಂದಾಯಿತ ಸೂಕ್ಷ್ಮ ಅಥವಾ ಸಣ್ಣ ಉದ್ಯಮವಾಗಿದ್ದು, ಖರೀದಿದಾರ 45 ದಿನಗಳಲ್ಲಿ ಪಾವತಿಸದಿದ್ದರೆ samadhaan.msme.gov.in ನಲ್ಲಿ ದೂರು ನೀಡಿ. ಬಡ್ಡಿ RBI ಬ್ಯಾಂಕ್ ದರದ 3 ಪಟ್ಟು. (MSMED ಕಾಯ್ದೆ, 2006, ಸೆಕ್ಷನ್ 15–16)"],
d4T:["Consumer complaint","उपभोक्ता शिकायत","ग्राहक तक्रार","వినియోగదారుల ఫిర్యాదు","நுகர்வோர் புகார்","ಗ್ರಾಹಕ ದೂರು"],
d4B:["Only if the buyer bought for personal use, not for resale or business. Call 1915 or file on e-Jagriti. (Consumer Protection Act, 2019, s.2(7))","सिर्फ़ तब, जब खरीदार ने निजी इस्तेमाल के लिए खरीदा हो, दोबारा बेचने या व्यापार के लिए नहीं। 1915 पर कॉल करें या ई-जागृति पर शिकायत करें। (उपभोक्ता संरक्षण अधिनियम, 2019, धारा 2(7))","खरेदीदाराने वैयक्तिक वापरासाठी घेतले असेल तरच, पुनर्विक्री किंवा व्यवसायासाठी नाही. 1915 वर कॉल करा किंवा ई-जागृतीवर तक्रार करा. (ग्राहक संरक्षण कायदा, 2019, कलम 2(7))","కొనుగోలుదారు సొంత వాడకానికి కొన్నప్పుడే, మళ్లీ అమ్మడానికి లేదా వ్యాపారానికి కాదు. 1915కి కాల్ చేయండి లేదా ఇ-జాగృతిలో ఫిర్యాదు చేయండి. (వినియోగదారుల రక్షణ చట్టం, 2019, సెక్షన్ 2(7))","வாங்குபவர் சொந்தப் பயன்பாட்டுக்கு வாங்கியிருந்தால் மட்டுமே, மறுவிற்பனை அல்லது வணிகத்துக்கு அல்ல. 1915 ஐ அழையுங்கள் அல்லது இ-ஜாக்ருதியில் புகார் செய்யுங்கள். (நுகர்வோர் பாதுகாப்புச் சட்டம், 2019, பிரிவு 2(7))","ಖರೀದಿದಾರ ಸ್ವಂತ ಬಳಕೆಗೆ ಖರೀದಿಸಿದ್ದರೆ ಮಾತ್ರ, ಮರುಮಾರಾಟ ಅಥವಾ ವ್ಯಾಪಾರಕ್ಕೆ ಅಲ್ಲ. 1915ಗೆ ಕರೆ ಮಾಡಿ ಅಥವಾ ಇ-ಜಾಗೃತಿಯಲ್ಲಿ ದೂರು ನೀಡಿ. (ಗ್ರಾಹಕ ಸಂರಕ್ಷಣಾ ಕಾಯ್ದೆ, 2019, ಸೆಕ್ಷನ್ 2(7))"],
d5T:["Fraud or cheating","धोखाधड़ी या ठगी","फसवणूक किंवा ठगबाजी","మోసం లేదా దగా","மோசடி அல்லது ஏமாற்றுதல்","ಮೋಸ ಅಥವಾ ವಂಚನೆ"],
d5B:["Call 1930 and report at cybercrime.gov.in, or go to the police.","1930 पर कॉल करें और cybercrime.gov.in पर रिपोर्ट करें, या पुलिस के पास जाएं।","1930 वर कॉल करा आणि cybercrime.gov.in वर तक्रार करा, किंवा पोलिसांकडे जा.","1930కి కాల్ చేసి cybercrime.gov.inలో ఫిర్యాదు చేయండి, లేదా పోలీసుల దగ్గరకు వెళ్లండి.","1930 ஐ அழைத்து cybercrime.gov.in இல் புகாரளியுங்கள், அல்லது காவல்துறையை அணுகுங்கள்.","1930ಗೆ ಕರೆ ಮಾಡಿ cybercrime.gov.in ನಲ್ಲಿ ದೂರು ನೀಡಿ, ಅಥವಾ ಪೊಲೀಸರ ಬಳಿ ಹೋಗಿ."],
d6T:["Legal notice through a lawyer","वकील के ज़रिए कानूनी नोटिस","वकिलामार्फत कायदेशीर नोटीस","న్యాయవాది ద్వారా లీగల్ నోటీసు","வழக்கறிஞர் மூலம் சட்ட அறிவிப்பு","ವಕೀಲರ ಮೂಲಕ ಕಾನೂನು ನೋಟಿಸ್"],
d6B:["A panel lawyer can send a formal legal notice using your evidence file.","पैनल का वकील आपकी सबूत फ़ाइल से औपचारिक कानूनी नोटिस भेज सकता है।","पॅनेलवरील वकील तुमच्या पुरावा फाइलच्या आधारे औपचारिक कायदेशीर नोटीस पाठवू शकतात.","ప్యానెల్ న్యాయవాది మీ సాక్ష్యం ఫైల్‌తో అధికారిక లీగల్ నోటీసు పంపగలరు.","குழு வழக்கறிஞர் உங்கள் சான்றுக் கோப்பைக் கொண்டு முறையான சட்ட அறிவிப்பு அனுப்பலாம்.","ಪ್ಯಾನೆಲ್ ವಕೀಲರು ನಿಮ್ಮ ಸಾಕ್ಷ್ಯ ಫೈಲ್ ಬಳಸಿ ಔಪಚಾರಿಕ ಕಾನೂನು ನೋಟಿಸ್ ಕಳುಹಿಸಬಹುದು."],

dispMsg:["{name} ji, as per our chat, these points were agreed: {agreed}. These are still open: {open}. Can we sort this out this week?","{name} जी, हमारी चैट के हिसाब से ये बातें तय हुई थीं: {agreed}। ये अभी बाकी हैं: {open}। क्या हम इसी हफ़्ते इसे सुलझा सकते हैं?","{name} जी, आपल्या चॅटनुसार या गोष्टी ठरल्या होत्या: {agreed}. या अजून बाकी आहेत: {open}. आपण या आठवड्यात हे सोडवू शकतो का?","{name} గారు, మన చాట్ ప్రకారం ఈ అంశాలు ఖరారయ్యాయి: {agreed}. ఇవి ఇంకా మిగిలాయి: {open}. ఈ వారంలో దీన్ని పరిష్కరించుకుందామా?","{name} ஜி, நம் அரட்டைப்படி இவை ஒப்புக்கொள்ளப்பட்டன: {agreed}. இவை இன்னும் மீதம்: {open}. இந்த வாரத்திலேயே தீர்த்துக்கொள்ளலாமா?","{name} ಅವರೇ, ನಮ್ಮ ಚಾಟ್ ಪ್ರಕಾರ ಇವು ಒಪ್ಪಲಾಗಿದೆ: {agreed}. ಇವು ಇನ್ನೂ ಬಾಕಿ: {open}. ಈ ವಾರದಲ್ಲೇ ಬಗೆಹರಿಸೋಣವೇ?"],

catPickNote:["DraftIt checks the deal against the laws and standards for this kind of business.", "DraftIt इस तरह के व्यापार के कानूनों और मानकों से सौदे की जांच करता है।", "DraftIt या प्रकारच्या व्यवसायाच्या कायदे व मानकांनुसार व्यवहार तपासतो.", "ఈ రకమైన వ్యాపారానికి సంబంధించిన చట్టాలు, ప్రమాణాలతో DraftIt డీల్‌ను తనిఖీ చేస్తుంది.", "இந்த வகை வணிகத்துக்கான சட்டங்கள், தரநிலைகளுடன் DraftIt ஒப்பந்தத்தைச் சரிபார்க்கும்.", "ಈ ರೀತಿಯ ವ್ಯಾಪಾರದ ಕಾನೂನು ಮತ್ತು ಮಾನದಂಡಗಳೊಂದಿಗೆ DraftIt ವ್ಯವಹಾರವನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ."],
