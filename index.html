sd_contract:["A valid deal needs clear parties, a lawful price and free consent from both sides.","मान्य सौदे के लिए साफ़ पक्ष, वैध कीमत और दोनों की स्वतंत्र सहमति चाहिए।","वैध व्यवहारासाठी स्पष्ट पक्ष, कायदेशीर किंमत आणि दोघांची मुक्त संमती हवी.","చెల్లుబాటు అయ్యే డీల్‌కు స్పష్టమైన పక్షాలు, చట్టబద్ధమైన ధర, ఇద్దరి స్వేచ్ఛా అంగీకారం కావాలి.","செல்லுபடியாகும் ஒப்பந்தத்துக்குத் தெளிவான தரப்பினர், சட்டப்பூர்வ விலை, இருவரின் சுதந்திர ஒப்புதல் தேவை.","ಮಾನ್ಯ ವ್ಯವಹಾರಕ್ಕೆ ಸ್ಪಷ್ಟ ಪಕ್ಷಗಳು, ಕಾನೂನುಬದ್ಧ ಬೆಲೆ ಮತ್ತು ಇಬ್ಬರ ಸ್ವತಂತ್ರ ಒಪ್ಪಿಗೆ ಬೇಕು."],
sd_lawful:["A deal that hides tax or breaks a law is void. Nothing in the chat should suggest skipping the bill or GST.","टैक्स छिपाने या कानून तोड़ने वाला सौदा शून्य होता है। चैट में बिल या GST छोड़ने जैसी कोई बात नहीं होनी चाहिए।","कर लपवणारा किंवा कायदा मोडणारा व्यवहार शून्य असतो. चॅटमध्ये बिल किंवा GST टाळण्यासारखे काही नसावे.","పన్ను దాచే లేదా చట్టాన్ని ఉల్లంఘించే డీల్ చెల్లదు. చాట్‌లో బిల్ లేదా GST దాటవేయడం లాంటిది ఉండకూడదు.","வரியை மறைக்கும் அல்லது சட்டத்தை மீறும் ஒப்பந்தம் செல்லாது. அரட்டையில் பில் அல்லது GST ஐத் தவிர்க்கும் பேச்சு இருக்கக்கூடாது.","ತೆರಿಗೆ ಮರೆಮಾಡುವ ಅಥವಾ ಕಾನೂನು ಮುರಿಯುವ ವ್ಯವಹಾರ ಅಸಿಂಧು. ಚಾಟ್‌ನಲ್ಲಿ ಬಿಲ್ ಅಥವಾ GST ತಪ್ಪಿಸುವ ಮಾತು ಇರಬಾರದು."],
sd_cash:["No one may receive ₹2 lakh or more in cash from one person in a day, in one transaction or for one event. Use UPI or bank transfer.","कोई भी एक व्यक्ति से एक दिन में, एक लेनदेन में या एक मौके पर ₹2 लाख या ज़्यादा नकद नहीं ले सकता। UPI या बैंक ट्रांसफ़र इस्तेमाल करें।","कोणीही एका व्यक्तीकडून एका दिवसात, एका व्यवहारात किंवा एका प्रसंगासाठी ₹2 लाख किंवा जास्त रोख घेऊ शकत नाही. UPI किंवा बँक ट्रान्सफर वापरा.","ఎవరూ ఒక వ్యక్తి నుంచి ఒక రోజులో, ఒక లావాదేవీలో లేదా ఒక సందర్భానికి ₹2 లక్షలు లేదా ఎక్కువ నగదు తీసుకోకూడదు. UPI లేదా బ్యాంక్ ట్రాన్స్‌ఫర్ వాడండి.","யாரும் ஒருவரிடமிருந்து ஒரு நாளில், ஒரு பரிவர்த்தனையில் அல்லது ஒரு நிகழ்வுக்கு ₹2 லட்சம் அல்லது அதற்கு மேல் ரொக்கமாகப் பெறக்கூடாது. UPI அல்லது வங்கிப் பரிமாற்றம் பயன்படுத்துங்கள்.","ಯಾರೂ ಒಬ್ಬರಿಂದ ಒಂದು ದಿನದಲ್ಲಿ, ಒಂದು ವಹಿವಾಟಿನಲ್ಲಿ ಅಥವಾ ಒಂದು ಸಂದರ್ಭಕ್ಕೆ ₹2 ಲಕ್ಷ ಅಥವಾ ಹೆಚ್ಚು ನಗದು ಪಡೆಯುವಂತಿಲ್ಲ. UPI ಅಥವಾ ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆ ಬಳಸಿ."],
sd_gst:["Every supply must be billed on a GST tax invoice with GSTIN, HSN or SAC code and the tax rate.","हर आपूर्ति का GST टैक्स इनवॉइस बनना चाहिए, जिसमें GSTIN, HSN या SAC कोड और टैक्स दर हो।","प्रत्येक पुरवठ्याचे GSTIN, HSN किंवा SAC कोड आणि कर दरासह GST कर बीजक बनायला हवे.","ప్రతి సరఫరాకు GSTIN, HSN లేదా SAC కోడ్, పన్ను రేటుతో GST ట్యాక్స్ ఇన్‌వాయిస్ ఉండాలి.","ஒவ்வொரு விநியோகத்துக்கும் GSTIN, HSN அல்லது SAC குறியீடு, வரி விகிதத்துடன் GST வரி விலைப்பட்டியல் வேண்டும்.","ಪ್ರತಿ ಪೂರೈಕೆಗೆ GSTIN, HSN ಅಥವಾ SAC ಕೋಡ್ ಮತ್ತು ತೆರಿಗೆ ದರದೊಂದಿಗೆ GST ತೆರಿಗೆ ಇನ್‌ವಾಯ್ಸ್ ಬೇಕು."],
sd_penalty:["A late fee is allowed, but a court awards only reasonable compensation, up to the agreed amount.","देरी का शुल्क रखा जा सकता है, पर अदालत तय रकम तक सिर्फ़ उचित मुआवज़ा देती है।","उशिराचे शुल्क ठेवता येते, पण न्यायालय ठरलेल्या रकमेपर्यंत फक्त वाजवी भरपाई देते.","ఆలస్య రుసుము పెట్టవచ్చు, కానీ కోర్టు ఒప్పుకున్న మొత్తం వరకు సహేతుకమైన పరిహారం మాత్రమే ఇస్తుంది.","தாமதக் கட்டணம் வைக்கலாம், ஆனால் நீதிமன்றம் ஒப்புக்கொண்ட தொகை வரை நியாயமான இழப்பீடு மட்டுமே வழங்கும்.","ತಡದ ಶುಲ್ಕ ಇಡಬಹುದು, ಆದರೆ ನ್ಯಾಯಾಲಯ ಒಪ್ಪಿದ ಮೊತ್ತದವರೆಗೆ ಸಮಂಜಸ ಪರಿಹಾರ ಮಾತ್ರ ನೀಡುತ್ತದೆ."],
sd_msme:["If the seller is a Udyam-registered micro or small enterprise, the buyer must pay within 45 days. Late payment carries interest at 3 times the RBI bank rate.","अगर विक्रेता उद्यम-पंजीकृत सूक्ष्म या लघु उद्यम है, तो खरीदार को 45 दिन में भुगतान करना होगा। देरी पर RBI बैंक दर का 3 गुना ब्याज लगता है।","विक्रेता उद्यम-नोंदणीकृत सूक्ष्म किंवा लघु उद्योग असल्यास खरेदीदाराने 45 दिवसांत पैसे द्यावेत. उशिरा पैसे दिल्यास RBI बँक दराच्या 3 पट व्याज लागते.","అమ్మేవారు ఉద్యమ్‌లో నమోదైన సూక్ష్మ లేదా చిన్న సంస్థ అయితే, కొనుగోలుదారు 45 రోజుల్లో చెల్లించాలి. ఆలస్యమైతే RBI బ్యాంక్ రేటుకు 3 రెట్లు వడ్డీ.","விற்பவர் உத்யம் பதிவு பெற்ற குறு அல்லது சிறு நிறுவனமானால், வாங்குபவர் 45 நாட்களுக்குள் பணம் செலுத்த வேண்டும். தாமதத்துக்கு RBI வங்கி விகிதத்தின் 3 மடங்கு வட்டி.","ಮಾರಾಟಗಾರ ಉದ್ಯಮ್ ನೋಂದಾಯಿತ ಸೂಕ್ಷ್ಮ ಅಥವಾ ಸಣ್ಣ ಉದ್ಯಮವಾದರೆ, ಖರೀದಿದಾರ 45 ದಿನಗಳಲ್ಲಿ ಪಾವತಿಸಬೇಕು. ತಡವಾದರೆ RBI ಬ್ಯಾಂಕ್ ದರದ 3 ಪಟ್ಟು ಬಡ್ಡಿ."],
sd_econtract:["Contracts made electronically are valid. Aadhaar eSign or a digital signature certificate is the strongest way to sign.","इलेक्ट्रॉनिक तरीके से बने अनुबंध मान्य हैं। आधार ई-साइन या डिजिटल सिग्नेचर सर्टिफ़िकेट सबसे मज़बूत तरीका है।","इलेक्ट्रॉनिक पद्धतीने केलेले करार वैध आहेत. आधार ई-साइन किंवा डिजिटल सिग्नेचर प्रमाणपत्र ही सर्वात भक्कम पद्धत आहे.","ఎలక్ట్రానిక్‌గా చేసిన ఒప్పందాలు చెల్లుతాయి. ఆధార్ ఈ-సైన్ లేదా డిజిటల్ సిగ్నేచర్ సర్టిఫికెట్ బలమైన మార్గం.","மின்னணு முறையில் செய்த ஒப்பந்தங்கள் செல்லும். ஆதார் இ-சைன் அல்லது டிஜிட்டல் கையொப்பச் சான்றிதழ் வலுவான வழி.","ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಆಗಿ ಮಾಡಿದ ಒಪ್ಪಂದಗಳು ಮಾನ್ಯ. ಆಧಾರ್ ಇ-ಸೈನ್ ಅಥವಾ ಡಿಜಿಟಲ್ ಸಿಗ್ನೇಚರ್ ಪ್ರಮಾಣಪತ್ರ ಅತ್ಯಂತ ಬಲವಾದ ವಿಧಾನ."],
sd_stamp:["Stamp duty depends on your state and the type of document. Pay it through e-stamping if needed.","स्टाम्प ड्यूटी आपके राज्य और दस्तावेज़ के प्रकार पर निर्भर है। ज़रूरत हो तो ई-स्टाम्पिंग से भरें।","मुद्रांक शुल्क तुमच्या राज्यावर आणि दस्तऐवजाच्या प्रकारावर अवलंबून असते. गरज असल्यास ई-स्टॅम्पिंगने भरा.","స్టాంప్ డ్యూటీ మీ రాష్ట్రం, పత్రం రకంపై ఆధారపడి ఉంటుంది. అవసరమైతే ఈ-స్టాంపింగ్ ద్వారా చెల్లించండి.","முத்திரைத் தீர்வை உங்கள் மாநிலம், ஆவண வகையைப் பொறுத்தது. தேவைப்பட்டால் இ-ஸ்டாம்பிங் மூலம் செலுத்துங்கள்.","ಮುದ್ರಾಂಕ ಶುಲ್ಕ ನಿಮ್ಮ ರಾಜ್ಯ ಮತ್ತು ದಾಖಲೆಯ ಪ್ರಕಾರವನ್ನು ಅವಲಂಬಿಸಿದೆ. ಅಗತ್ಯವಿದ್ದರೆ ಇ-ಸ್ಟ್ಯಾಂಪಿಂಗ್ ಮೂಲಕ ಪಾವತಿಸಿ."],
sd_dispute:["For commercial suits, mediation must be tried first, unless urgent relief is needed. Agree on this in the deal.","व्यावसायिक मुकदमों में पहले मध्यस्थता आज़मानी होती है, जब तक तुरंत राहत न चाहिए। सौदे में यह तय कर लें।","व्यावसायिक दाव्यांमध्ये आधी मध्यस्थी करून पाहावी लागते, तातडीची मदत हवी नसेल तर. व्यवहारात हे ठरवा.","వాణిజ్య దావాల్లో ముందు మధ్యవర్తిత్వం ప్రయత్నించాలి, అత్యవసర ఉపశమనం అవసరమైతే తప్ప. డీల్‌లో దీన్ని ఒప్పుకోండి.","வணிக வழக்குகளில், அவசர நிவாரணம் தேவைப்படாவிட்டால் முதலில் சமரசம் முயல வேண்டும். ஒப்பந்தத்தில் இதை ஒப்புக்கொள்ளுங்கள்.","ವಾಣಿಜ್ಯ ದಾವೆಗಳಲ್ಲಿ ಮೊದಲು ಮಧ್ಯಸ್ಥಿಕೆ ಪ್ರಯತ್ನಿಸಬೇಕು, ತುರ್ತು ಪರಿಹಾರ ಬೇಕಿಲ್ಲದಿದ್ದರೆ. ವ್ಯವಹಾರದಲ್ಲಿ ಇದನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಿ."],
sd_resale:["Say whether the goods may be resold. Packaged goods must never be sold above the printed MRP.","बताएं कि सामान दोबारा बेचा जा सकता है या नहीं। पैक सामान छपे MRP से ज़्यादा पर कभी नहीं बिकना चाहिए।","वस्तू पुन्हा विकता येतील का ते सांगा. पॅक केलेल्या वस्तू छापील MRP पेक्षा जास्त किमतीला कधीही विकू नयेत.","సరుకును మళ్లీ అమ్మవచ్చో లేదో చెప్పండి. ప్యాక్ చేసిన సరుకు ముద్రించిన MRP కంటే ఎక్కువకు ఎప్పుడూ అమ్మకూడదు.","பொருட்களை மறுவிற்பனை செய்யலாமா என்று சொல்லுங்கள். பேக் செய்த பொருட்களை அச்சிட்ட MRP க்கு மேல் ஒருபோதும் விற்கக்கூடாது.","ಸರಕು ಮರುಮಾರಾಟ ಮಾಡಬಹುದೇ ಎಂದು ಹೇಳಿ. ಪ್ಯಾಕ್ ಮಾಡಿದ ಸರಕನ್ನು ಮುದ್ರಿತ MRP ಗಿಂತ ಹೆಚ್ಚಿಗೆ ಎಂದಿಗೂ ಮಾರಬಾರದು."],
sd_fssai_pack:["Boxes that touch food must be food-grade, and the printed side must not touch the food.","खाने को छूने वाले डिब्बे फ़ूड-ग्रेड होने चाहिए, और छपी हुई तरफ़ खाने को नहीं छूनी चाहिए।","अन्नाला स्पर्श करणारे बॉक्स फूड-ग्रेड असावेत आणि छापील बाजू अन्नाला लागू नये.","ఆహారాన్ని తాకే బాక్సులు ఫుడ్-గ్రేడ్ అయి ఉండాలి, ముద్రించిన వైపు ఆహారాన్ని తాకకూడదు.","உணவைத் தொடும் பெட்டிகள் உணவுத் தரமாக இருக்க வேண்டும்; அச்சிட்ட பக்கம் உணவைத் தொடக்கூடாது.","ಆಹಾರ ತಾಕುವ ಬಾಕ್ಸ್‌ಗಳು ಫುಡ್-ಗ್ರೇಡ್ ಆಗಿರಬೇಕು, ಮುದ್ರಿತ ಭಾಗ ಆಹಾರವನ್ನು ತಾಕಬಾರದು."],
sd_ink:["Inks on food packaging must follow IS 15495, which bars harmful solvents such as toluene.","खाने की पैकेजिंग पर स्याही IS 15495 के अनुसार होनी चाहिए, जो टॉलुईन जैसे हानिकारक सॉल्वेंट पर रोक लगाता है।","अन्न पॅकेजिंगवरील शाई IS 15495 नुसार असावी, ज्यात टोल्युईनसारख्या घातक द्रावकांवर बंदी आहे.","ఆహార ప్యాకేజింగ్‌పై ఇంక్ IS 15495 ప్రకారం ఉండాలి, ఇది టొలుయీన్ లాంటి హానికర ద్రావకాలను నిషేధిస్తుంది.","உணவுப் பேக்கேஜிங் மை IS 15495 ஐப் பின்பற்ற வேண்டும்; இது டொலுயீன் போன்ற தீங்கான கரைப்பான்களைத் தடை செய்கிறது.","ಆಹಾರ ಪ್ಯಾಕೇಜಿಂಗ್ ಶಾಯಿ IS 15495 ಪ್ರಕಾರ ಇರಬೇಕು; ಇದು ಟೊಲುಯೀನ್‌ನಂತಹ ಹಾನಿಕರ ದ್ರಾವಕಗಳನ್ನು ನಿಷೇಧಿಸುತ್ತದೆ."],
sd_tm_logo:["The buyer should confirm they own the logo you print, and you print it only for their order.","खरीदार पुष्टि करे कि जो लोगो आप छाप रहे हैं वह उनका है, और आप उसे सिर्फ़ उनके ऑर्डर के लिए छापेंगे।","खरेदीदाराने खात्री द्यावी की तुम्ही छापत असलेला लोगो त्यांचा आहे, आणि तुम्ही तो फक्त त्यांच्या ऑर्डरसाठी छापाल.","మీరు ముద్రించే లోగో తమదేనని కొనుగోలుదారు ధృవీకరించాలి, మీరు దాన్ని వారి ఆర్డర్ కోసమే ముద్రించాలి.","நீங்கள் அச்சிடும் லோகோ தங்களுடையது என்று வாங்குபவர் உறுதிப்படுத்த வேண்டும்; அதை அவர்களின் ஆர்டருக்கு மட்டுமே அச்சிட வேண்டும்.","ನೀವು ಮುದ್ರಿಸುವ ಲೋಗೋ ತಮ್ಮದು ಎಂದು ಖರೀದಿದಾರ ಖಚಿತಪಡಿಸಬೇಕು, ನೀವು ಅದನ್ನು ಅವರ ಆರ್ಡರ್‌ಗೆ ಮಾತ್ರ ಮುದ್ರಿಸಬೇಕು."],
sd_fssai_lic:["Anyone selling food needs an FSSAI licence or registration. Put the number on the bill.","खाना बेचने वाले को FSSAI लाइसेंस या पंजीकरण चाहिए। नंबर बिल पर लिखें।","अन्न विकणाऱ्याला FSSAI परवाना किंवा नोंदणी लागते. क्रमांक बिलावर लिहा.","ఆహారం అమ్మేవారికి FSSAI లైసెన్స్ లేదా నమోదు అవసరం. నంబర్‌ను బిల్‌పై రాయండి.","உணவு விற்பவருக்கு FSSAI உரிமம் அல்லது பதிவு வேண்டும். எண்ணை பில்லில் எழுதுங்கள்.","ಆಹಾರ ಮಾರುವವರಿಗೆ FSSAI ಪರವಾನಗಿ ಅಥವಾ ನೋಂದಣಿ ಬೇಕು. ಸಂಖ್ಯೆಯನ್ನು ಬಿಲ್‌ನಲ್ಲಿ ಬರೆಯಿರಿ."],
sd_legal_metro:["Packaged goods must show MRP, net quantity and maker details, and cannot be sold above MRP.","पैक सामान पर MRP, कुल मात्रा और निर्माता का विवरण होना चाहिए, और MRP से ज़्यादा पर नहीं बिक सकता।","पॅक केलेल्या वस्तूंवर MRP, निव्वळ प्रमाण आणि उत्पादकाचा तपशील असावा, आणि त्या MRP पेक्षा जास्त किमतीला विकता येत नाहीत.","ప్యాక్ చేసిన సరుకుపై MRP, నికర పరిమాణం, తయారీదారు వివరాలు ఉండాలి, MRP కంటే ఎక్కువకు అమ్మకూడదు.","பேக் செய்த பொருட்களில் MRP, நிகர அளவு, தயாரிப்பாளர் விவரம் இருக்க வேண்டும்; MRP க்கு மேல் விற்கக்கூடாது.","ಪ್ಯಾಕ್ ಮಾಡಿದ ಸರಕಿನಲ್ಲಿ MRP, ನಿವ್ವಳ ಪ್ರಮಾಣ ಮತ್ತು ತಯಾರಕರ ವಿವರ ಇರಬೇಕು, MRP ಗಿಂತ ಹೆಚ್ಚಿಗೆ ಮಾರಬಾರದು."],
sd_drug_lic:["Selling medicines needs a drug licence. Prescription medicines need a doctor’s prescription.","दवा बेचने के लिए ड्रग लाइसेंस चाहिए। पर्ची वाली दवाओं के लिए डॉक्टर की पर्ची ज़रूरी है।","औषधे विकण्यासाठी औषध परवाना लागतो. प्रिस्क्रिप्शनच्या औषधांसाठी डॉक्टरांचे प्रिस्क्रिप्शन आवश्यक.","మందులు అమ్మడానికి డ్రగ్ లైసెన్స్ కావాలి. ప్రిస్క్రిప్షన్ మందులకు డాక్టర్ ప్రిస్క్రిప్షన్ అవసరం.","மருந்து விற்க மருந்து உரிமம் வேண்டும். மருந்துச்சீட்டு மருந்துகளுக்கு மருத்துவரின் சீட்டு வேண்டும்.","ಔಷಧ ಮಾರಲು ಔಷಧ ಪರವಾನಗಿ ಬೇಕು. ಪ್ರಿಸ್ಕ್ರಿಪ್ಷನ್ ಔಷಧಗಳಿಗೆ ವೈದ್ಯರ ಚೀಟಿ ಬೇಕು."],
sd_dpco:["Medicines cannot be sold above the printed MRP or the government ceiling price.","दवाएं छपे MRP या सरकारी अधिकतम कीमत से ज़्यादा पर नहीं बेची जा सकतीं।","औषधे छापील MRP किंवा सरकारी कमाल किमतीपेक्षा जास्त दराने विकता येत नाहीत.","మందులను ముద్రించిన MRP లేదా ప్రభుత్వ గరిష్ఠ ధర కంటే ఎక్కువకు అమ్మకూడదు.","மருந்துகளை அச்சிட்ட MRP அல்லது அரசின் உச்சவரம்பு விலைக்கு மேல் விற்கக்கூடாது.","ಔಷಧಗಳನ್ನು ಮುದ್ರಿತ MRP ಅಥವಾ ಸರ್ಕಾರದ ಗರಿಷ್ಠ ಬೆಲೆಗಿಂತ ಹೆಚ್ಚಿಗೆ ಮಾರಬಾರದು."],
sd_copyright:["The designer owns the work unless rights are assigned in writing, naming the rights, territory and period. If not stated, it lasts 5 years and only in India.","जब तक अधिकार लिखित में, अधिकार, क्षेत्र और अवधि बताकर, ट्रांसफ़र न हों, काम डिज़ाइनर का रहता है। न लिखा हो तो यह 5 साल और सिर्फ़ भारत में लागू होता है।","हक्क लेखी स्वरूपात, हक्क, क्षेत्र आणि कालावधी नमूद करून हस्तांतरित होईपर्यंत काम डिझायनरचे राहते. नमूद नसल्यास ते 5 वर्षे आणि फक्त भारतात लागू होते.","హక్కులను రాతపూర్వకంగా, హక్కులు, ప్రాంతం, కాలం చెప్పి బదిలీ చేసే వరకు పని డిజైనర్‌దే. చెప్పకపోతే అది 5 ఏళ్లు, భారత్‌లో మాత్రమే.","உரிமைகள் எழுத்தில், உரிமைகள், பிரதேசம், காலம் குறிப்பிட்டு மாற்றப்படும் வரை படைப்பு வடிவமைப்பாளருடையது. குறிப்பிடாவிட்டால் 5 ஆண்டுகள், இந்தியாவில் மட்டும்.","ಹಕ್ಕುಗಳನ್ನು ಲಿಖಿತವಾಗಿ, ಹಕ್ಕು, ಪ್ರದೇಶ ಮತ್ತು ಅವಧಿ ಹೇಳಿ ವರ್ಗಾಯಿಸುವವರೆಗೆ ಕೆಲಸ ವಿನ್ಯಾಸಕರದ್ದು. ಹೇಳದಿದ್ದರೆ 5 ವರ್ಷ, ಭಾರತದಲ್ಲಿ ಮಾತ್ರ."],
sd_tm_assign:["A logo can be transferred only in writing. The new owner records it with the Trade Marks Registry on Form TM-P.","लोगो सिर्फ़ लिखित में ट्रांसफ़र हो सकता है। नया मालिक इसे ट्रेड मार्क्स रजिस्ट्री में फ़ॉर्म TM-P पर दर्ज कराता है।","लोगो फक्त लेखी स्वरूपात हस्तांतरित होऊ शकतो. नवा मालक तो ट्रेड मार्क्स रजिस्ट्रीत फॉर्म TM-P वर नोंदवतो.","లోగోను రాతపూర్వకంగా మాత్రమే బదిలీ చేయగలరు. కొత్త యజమాని దాన్ని ట్రేడ్ మార్క్స్ రిజిస్ట్రీలో ఫారం TM-P ద్వారా నమోదు చేస్తారు.","லோகோவை எழுத்தில் மட்டுமே மாற்ற முடியும். புதிய உரிமையாளர் அதை வர்த்தகக் குறி பதிவகத்தில் படிவம் TM-P மூலம் பதிவு செய்வார்.","ಲೋಗೋವನ್ನು ಲಿಖಿತವಾಗಿ ಮಾತ್ರ ವರ್ಗಾಯಿಸಬಹುದು. ಹೊಸ ಮಾಲೀಕರು ಅದನ್ನು ಟ್ರೇಡ್ ಮಾರ್ಕ್ಸ್ ರಿಜಿಸ್ಟ್ರಿಯಲ್ಲಿ ಫಾರ್ಮ್ TM-P ಮೂಲಕ ದಾಖಲಿಸುತ್ತಾರೆ."],
sd_handover:["Write down who owns the domain, hosting, source code and passwords at handover.","लिखें कि हैंडओवर के समय डोमेन, होस्टिंग, सोर्स कोड और पासवर्ड किसके होंगे।","हस्तांतरणाच्या वेळी डोमेन, होस्टिंग, सोर्स कोड आणि पासवर्ड कोणाचे असतील ते लिहा.","హ్యాండోవర్ సమయంలో డొమైన్, హోస్టింగ్, సోర్స్ కోడ్, పాస్‌వర్డ్‌లు ఎవరివో రాయండి.","ஒப்படைப்பின்போது டொமைன், ஹோஸ்டிங், மூலக் குறியீடு, கடவுச்சொற்கள் யாருடையவை என்று எழுதுங்கள்.","ಹಸ್ತಾಂತರದ ವೇಳೆ ಡೊಮೈನ್, ಹೋಸ್ಟಿಂಗ್, ಸೋರ್ಸ್ ಕೋಡ್ ಮತ್ತು ಪಾಸ್‌ವರ್ಡ್ ಯಾರದು ಎಂದು ಬರೆಯಿರಿ."],
sd_privacy:["If the website collects customer details, it needs a privacy notice and clear consent.","अगर वेबसाइट ग्राहकों की जानकारी लेती है, तो उसे गोपनीयता सूचना और साफ़ सहमति चाहिए।","वेबसाइट ग्राहकांची माहिती घेत असल्यास तिला गोपनीयता सूचना आणि स्पष्ट संमती हवी.","వెబ్‌సైట్ కస్టమర్ వివరాలు సేకరిస్తే, దానికి గోప్యతా నోటీసు, స్పష్టమైన అనుమతి కావాలి.","இணையதளம் வாடிக்கையாளர் விவரங்களைச் சேகரித்தால், தனியுரிமை அறிவிப்பும் தெளிவான ஒப்புதலும் வேண்டும்.","ವೆಬ್‌ಸೈಟ್ ಗ್ರಾಹಕರ ವಿವರ ಸಂಗ್ರಹಿಸಿದರೆ, ಅದಕ್ಕೆ ಗೌಪ್ಯತಾ ಸೂಚನೆ ಮತ್ತು ಸ್ಪಷ್ಟ ಒಪ್ಪಿಗೆ ಬೇಕು."],
sd_bis:["Many electronics must carry BIS registration before sale. Check the R-number on the product.","कई इलेक्ट्रॉनिक सामान बेचने से पहले BIS पंजीकरण ज़रूरी है। प्रोडक्ट पर R-नंबर जांचें।","अनेक इलेक्ट्रॉनिक वस्तूंना विक्रीपूर्वी BIS नोंदणी आवश्यक आहे. उत्पादनावरील R-क्रमांक तपासा.","చాలా ఎలక్ట్రానిక్స్‌కు అమ్మకానికి ముందు BIS నమోదు అవసరం. ఉత్పత్తిపై R-నంబర్ చూడండి.","பல மின்னணுப் பொருட்களுக்கு விற்பனைக்கு முன் BIS பதிவு வேண்டும். பொருளில் R-எண்ணைப் பாருங்கள்.","ಅನೇಕ ಎಲೆಕ್ಟ್ರಾನಿಕ್ಸ್‌ಗೆ ಮಾರಾಟಕ್ಕೆ ಮುನ್ನ BIS ನೋಂದಣಿ ಬೇಕು. ಉತ್ಪನ್ನದ ಮೇಲಿನ R-ಸಂಖ್ಯೆ ನೋಡಿ."],
sd_ewaste:["Makers and sellers of electronics have take-back duties for e-waste.","इलेक्ट्रॉनिक्स बनाने और बेचने वालों पर ई-कचरा वापस लेने की ज़िम्मेदारी है।","इलेक्ट्रॉनिक्स बनवणाऱ्या आणि विकणाऱ्यांवर ई-कचरा परत घेण्याची जबाबदारी आहे.","ఎలక్ట్రానిక్స్ తయారీదారులు, అమ్మేవారికి ఈ-వ్యర్థాలను తిరిగి తీసుకునే బాధ్యత ఉంది.","மின்னணுப் பொருட்களைத் தயாரிப்பவர்களுக்கும் விற்பவர்களுக்கும் மின்-கழிவைத் திரும்பப் பெறும் கடமை உண்டு.","ಎಲೆಕ್ಟ್ರಾನಿಕ್ಸ್ ತಯಾರಕರು ಮತ್ತು ಮಾರಾಟಗಾರರಿಗೆ ಇ-ತ್ಯಾಜ್ಯ ಮರಳಿ ಪಡೆಯುವ ಹೊಣೆ ಇದೆ."],
sd_bis_build:["Where the government has issued a Quality Control Order, building material must carry the BIS mark.","जहां सरकार ने गुणवत्ता नियंत्रण आदेश जारी किया है, वहां निर्माण सामग्री पर BIS मार्क होना चाहिए।","जिथे सरकारने गुणवत्ता नियंत्रण आदेश जारी केला आहे, तिथे बांधकाम साहित्यावर BIS चिन्ह असावे.","ప్రభుత్వం నాణ్యత నియంత్రణ ఆదేశం ఇచ్చిన చోట నిర్మాణ సామగ్రిపై BIS గుర్తు ఉండాలి.","அரசு தரக் கட்டுப்பாட்டு ஆணை பிறப்பித்த இடங்களில், கட்டுமானப் பொருட்களில் BIS குறி இருக்க வேண்டும்.","ಸರ್ಕಾರ ಗುಣಮಟ್ಟ ನಿಯಂತ್ರಣ ಆದೇಶ ಹೊರಡಿಸಿದಲ್ಲಿ, ನಿರ್ಮಾಣ ಸಾಮಗ್ರಿಯ ಮೇಲೆ BIS ಗುರುತು ಇರಬೇಕು."],
fixLbl:["How to fix","कैसे ठीक करें","कसे दुरुस्त करावे","ఎలా సరిచేయాలి","எப்படிச் சரிசெய்வது","ಹೇಗೆ ಸರಿಪಡಿಸುವುದು"],
sx_food:["{name} ji, I’ll use food-grade board and food-safe inks (IS 15495), printed side outside. Ok?","{name} जी, मैं फ़ूड-ग्रेड बोर्ड और फ़ूड-सेफ़ स्याही (IS 15495) इस्तेमाल करूंगा, छपी तरफ़ बाहर। ठीक है?","{name} जी, मी फूड-ग्रेड बोर्ड आणि फूड-सेफ शाई (IS 15495) वापरेन, छापील बाजू बाहेर. चालेल?","{name} గారు, నేను ఫుడ్-గ్రేడ్ బోర్డు, ఫుడ్-సేఫ్ ఇంక్ (IS 15495) వాడతాను, ముద్రించిన వైపు బయటకు. సరేనా?","{name} ஜி, உணவுத் தர அட்டை, உணவுக்குப் பாதுகாப்பான மை (IS 15495) பயன்படுத்துவேன், அச்சுப் பக்கம் வெளியே. சரியா?","{name} ಅವರೇ, ನಾನು ಫುಡ್-ಗ್ರೇಡ್ ಬೋರ್ಡ್ ಮತ್ತು ಫುಡ್-ಸೇಫ್ ಶಾಯಿ (IS 15495) ಬಳಸುತ್ತೇನೆ, ಮುದ್ರಿತ ಭಾಗ ಹೊರಗೆ. ಸರಿಯೇ?"],
sx_tax:["{name} ji, let’s keep it on a proper GST invoice, with payment by UPI or bank transfer. Ok?","{name} जी, सब कुछ सही GST बिल पर रखें, और भुगतान UPI या बैंक ट्रांसफ़र से। ठीक है?","{name} जी, सगळे योग्य GST बिलावर ठेवू, आणि पैसे UPI किंवा बँक ट्रान्सफरने. चालेल?","{name} గారు, అంతా సరైన GST బిల్‌పై ఉంచుదాం, చెల్లింపు UPI లేదా బ్యాంక్ ట్రాన్స్‌ఫర్ ద్వారా. సరేనా?","{name} ஜி, எல்லாவற்றையும் முறையான GST பில்லில் வைப்போம், பணம் UPI அல்லது வங்கிப் பரிமாற்றம் மூலம். சரியா?","{name} ಅವರೇ, ಎಲ್ಲವನ್ನೂ ಸರಿಯಾದ GST ಬಿಲ್‌ನಲ್ಲಿ ಇಡೋಣ, ಪಾವತಿ UPI ಅಥವಾ ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆ ಮೂಲಕ. ಸರಿಯೇ?"],
sx_ip:["{name} ji, after full payment I’ll sign a written transfer of all rights, with the source files. Ok?","{name} जी, पूरा भुगतान होने पर मैं सभी अधिकारों का लिखित ट्रांसफ़र साइन करूंगा, सोर्स फ़ाइलों के साथ। ठीक है?","{name} जी, पूर्ण पैसे मिळाल्यावर मी सर्व हक्कांचे लेखी हस्तांतरण सही करेन, सोर्स फाइल्ससह. चालेल?","{name} గారు, పూర్తి చెల్లింపు తర్వాత అన్ని హక్కుల రాతపూర్వక బదిలీపై సంతకం చేస్తాను, సోర్స్ ఫైళ్లతో. సరేనా?","{name} ஜி, முழுப் பணம் கிடைத்ததும் அனைத்து உரிமைகளின் எழுத்துப்பூர்வ மாற்றத்தில் கையொப்பமிடுவேன், மூலக் கோப்புகளுடன். சரியா?","{name} ಅವರೇ, ಪೂರ್ತಿ ಪಾವತಿಯ ನಂತರ ಎಲ್ಲಾ ಹಕ್ಕುಗಳ ಲಿಖಿತ ವರ್ಗಾವಣೆಗೆ ಸಹಿ ಮಾಡುತ್ತೇನೆ, ಸೋರ್ಸ್ ಫೈಲ್‌ಗಳೊಂದಿಗೆ. ಸರಿಯೇ?"],
sx_logo:["{name} ji, please confirm you own this logo. I’ll print it only for your order.","{name} जी, कृपया पुष्टि करें कि यह लोगो आपका है। मैं इसे सिर्फ़ आपके ऑर्डर के लिए छापूंगा।","{name} जी, कृपया हा लोगो तुमचा आहे याची खात्री द्या. मी तो फक्त तुमच्या ऑर्डरसाठी छापेन.","{name} గారు, ఈ లోగో మీదేనని ధృవీకరించండి. దాన్ని మీ ఆర్డర్ కోసమే ముద్రిస్తాను.","{name} ஜி, இந்த லோகோ உங்களுடையது என்று உறுதிப்படுத்துங்கள். உங்கள் ஆர்டருக்கு மட்டுமே அச்சிடுவேன்.","{name} ಅವರೇ, ಈ ಲೋಗೋ ನಿಮ್ಮದು ಎಂದು ಖಚಿತಪಡಿಸಿ. ನಿಮ್ಮ ಆರ್ಡರ್‌ಗೆ ಮಾತ್ರ ಮುದ್ರಿಸುತ್ತೇನೆ."],
sx_msme:["{name} ji, balance within 45 days of delivery, as per MSME rules. Ok?","{name} जी, बाकी रकम डिलीवरी के 45 दिन के अंदर, MSME नियमों के अनुसार। ठीक है?","{name} जी, उर्वरित रक्कम डिलिव्हरीनंतर 45 दिवसांत, MSME नियमांनुसार. चालेल?","{name} గారు, మిగిలిన మొత్తం డెలివరీ అయిన 45 రోజుల్లో, MSME నియమాల ప్రకారం. సరేనా?","{name} ஜி, மீதித் தொகை டெலிவரியான 45 நாட்களுக்குள், MSME விதிகளின்படி. சரியா?","{name} ಅವರೇ, ಬಾಕಿ ಮೊತ್ತ ಡೆಲಿವರಿಯಾದ 45 ದಿನಗಳಲ್ಲಿ, MSME ನಿಯಮಗಳ ಪ್ರಕಾರ. ಸರಿಯೇ?"],

mi_payment_mode:["How payments are made: UPI, bank transfer or cheque, so money can be traced.","भुगतान कैसे होगा: UPI, बैंक ट्रांसफ़र या चेक, ताकि पैसे का पता रहे।","पैसे कसे दिले जातील: UPI, बँक ट्रान्सफर किंवा चेक, म्हणजे पैशांचा माग राहील.","చెల్లింపు ఎలా: UPI, బ్యాంక్ ట్రాన్స్‌ఫర్ లేదా చెక్, డబ్బు జాడ తెలిసేలా.","பணம் எப்படிச் செலுத்தப்படும்: UPI, வங்கிப் பரிமாற்றம் அல்லது காசோலை, பணத்தைக் கண்காணிக்கும்படி.","ಪಾವತಿ ಹೇಗೆ: UPI, ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆ ಅಥವಾ ಚೆಕ್, ಹಣದ ಜಾಡು ಸಿಗುವಂತೆ."],
mi_ip:["Who owns the designs, logos, files and other rights, and whether they are transferred.","डिज़ाइन, लोगो, फ़ाइलें और बाकी अधिकार किसके हैं, और क्या वे ट्रांसफ़र होंगे।","डिझाइन, लोगो, फाइल्स व इतर हक्क कोणाचे आहेत आणि ते हस्तांतरित होतील का.","డిజైన్లు, లోగోలు, ఫైళ్లు, ఇతర హక్కులు ఎవరివి, అవి బదిలీ అవుతాయా.","வடிவமைப்புகள், லோகோக்கள், கோப்புகள், பிற உரிமைகள் யாருடையவை, அவை மாற்றப்படுமா.","ವಿನ್ಯಾಸ, ಲೋಗೋ, ಫೈಲ್ ಮತ್ತು ಇತರ ಹಕ್ಕುಗಳು ಯಾರದು, ಅವು ವರ್ಗಾವಣೆಯಾಗುತ್ತವೆಯೇ."],
mi_resale:["Whether the buyer may resell, and that resale must not be above MRP.","क्या खरीदार दोबारा बेच सकता है, और दोबारा बिक्री MRP से ज़्यादा पर न हो।","खरेदीदार पुन्हा विकू शकतो का, आणि पुनर्विक्री MRP पेक्षा जास्त नसावी.","కొనుగోలుదారు మళ్లీ అమ్మవచ్చా, మళ్లీ అమ్మకం MRP కంటే ఎక్కువ కాకూడదు.","வாங்குபவர் மறுவிற்பனை செய்யலாமா, மறுவிற்பனை MRP க்கு மேல் இருக்கக்கூடாது.","ಖರೀದಿದಾರ ಮರುಮಾರಾಟ ಮಾಡಬಹುದೇ, ಮರುಮಾರಾಟ MRP ಗಿಂತ ಹೆಚ್ಚಿರಬಾರದು."],

formalNote:["The formal agreement is in English, as is usual for documents filed in Indian courts. The simple summary shows the same terms in your language.","औपचारिक समझौता अंग्रेज़ी में है, जैसा भारतीय अदालतों में दाखिल दस्तावेज़ों में आम है। आसान सारांश में वही शर्तें आपकी भाषा में हैं।","औपचारिक करार इंग्रजीत आहे, जसे भारतीय न्यायालयात दाखल दस्तऐवजांसाठी सामान्य आहे. सोप्या सारांशात त्याच अटी तुमच्या भाषेत आहेत.","భారతీయ కోర్టుల్లో దాఖలు చేసే పత్రాల్లాగే అధికారిక ఒప్పందం ఇంగ్లీష్‌లో ఉంది. సులభ సారాంశం అవే నిబంధనలను మీ భాషలో చూపుతుంది.","இந்திய நீதிமன்றங்களில் தாக்கல் செய்யும் ஆவணங்களைப் போல முறையான ஒப்பந்தம் ஆங்கிலத்தில் உள்ளது. எளிய சுருக்கம் அதே நிபந்தனைகளை உங்கள் மொழியில் காட்டும்.","ಭಾರತೀಯ ನ್ಯಾಯಾಲಯಗಳಲ್ಲಿ ಸಲ್ಲಿಸುವ ದಾಖಲೆಗಳಂತೆ ಔಪಚಾರಿಕ ಒಪ್ಪಂದ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿದೆ. ಸರಳ ಸಾರಾಂಶ ಅದೇ ಷರತ್ತುಗಳನ್ನು ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ತೋರಿಸುತ್ತದೆ."],

hsnHint:["DraftIt suggests a code from the category. Confirm the code and rate with your CA.", "DraftIt श्रेणी से कोड सुझाता है। कोड और दर अपने CA से पक्की करें।", "DraftIt प्रकारावरून कोड सुचवतो. कोड व दर तुमच्या CA कडून पक्के करा.", "DraftIt వర్గం నుంచి కోడ్ సూచిస్తుంది. కోడ్, రేటును మీ CAతో ధృవీకరించండి.", "DraftIt வகையிலிருந்து குறியீட்டைப் பரிந்துரைக்கும். குறியீட்டையும் விகிதத்தையும் உங்கள் CA உடன் உறுதிப்படுத்துங்கள்.", "DraftIt ವರ್ಗದಿಂದ ಕೋಡ್ ಸೂಚಿಸುತ್ತದೆ. ಕೋಡ್ ಮತ್ತು ದರವನ್ನು ನಿಮ್ಮ CA ಜೊತೆ ಖಚಿತಪಡಿಸಿ."],
gstNoteBox:["Paper boxes (HSN 4819): corrugated boxes are 5% from 22 Sept 2025; folding cartons may still be 18%.","कागज़ के डिब्बे (HSN 4819): 22 सितंबर 2025 से कोरुगेटेड डिब्बों पर 5%; फ़ोल्डिंग कार्टन पर अब भी 18% हो सकता है।","कागदी बॉक्स (HSN 4819): 22 सप्टेंबर 2025 पासून कोरुगेटेड बॉक्सवर 5%; फोल्डिंग कार्टनवर अजूनही 18% असू शकतो.","కాగితపు బాక్సులు (HSN 4819): 22 సెప్టెంబర్ 2025 నుంచి కొరుగేటెడ్ బాక్సులకు 5%; ఫోల్డింగ్ కార్టన్లకు ఇంకా 18% ఉండవచ్చు.","காகிதப் பெட்டிகள் (HSN 4819): 22 செப்டம்பர் 2025 முதல் நெளி அட்டைப் பெட்டிகளுக்கு 5%; மடிப்பு அட்டைகளுக்கு இன்னும் 18% இருக்கலாம்.","ಕಾಗದದ ಬಾಕ್ಸ್ (HSN 4819): 22 ಸೆಪ್ಟೆಂಬರ್ 2025 ರಿಂದ ಕೊರುಗೇಟೆಡ್ ಬಾಕ್ಸ್‌ಗೆ 5%; ಫೋಲ್ಡಿಂಗ್ ಕಾರ್ಟನ್‌ಗೆ ಈಗಲೂ 18% ಇರಬಹುದು."],
downloadQuote:["Download quotation","कोटेशन डाउनलोड करें","कोटेशन डाउनलोड करा","కొటేషన్ డౌన్‌లోడ్ చేయండి","விலைப்புள்ளியைப் பதிவிறக்கு","ಕೊಟೇಶನ್ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ"],
quoteNote:["A quotation is not a tax invoice. Raise a GST invoice when you supply.","कोटेशन टैक्स इनवॉइस नहीं है। आपूर्ति के समय GST इनवॉइस बनाएं।","कोटेशन हे कर बीजक नाही. पुरवठा करताना GST बीजक बनवा.","కొటేషన్ ట్యాక్స్ ఇన్‌వాయిస్ కాదు. సరఫరా చేసేటప్పుడు GST ఇన్‌వాయిస్ ఇవ్వండి.","விலைப்புள்ளி வரி விலைப்பட்டியல் அல்ல. விநியோகிக்கும்போது GST விலைப்பட்டியல் தாருங்கள்.","ಕೊಟೇಶನ್ ತೆರಿಗೆ ಇನ್‌ವಾಯ್ಸ್ ಅಲ್ಲ. ಪೂರೈಸುವಾಗ GST ಇನ್‌ವಾಯ್ಸ್ ನೀಡಿ."],

sg_payment_mode:["Can we keep all payments by UPI or bank transfer?","क्या सारे भुगतान UPI या बैंक ट्रांसफ़र से रखें?","सर्व पैसे UPI किंवा बँक ट्रान्सफरने ठेवूया का?","అన్ని చెల్లింపులు UPI లేదా బ్యాంక్ ట్రాన్స్‌ఫర్ ద్వారా పెట్టుకుందామా?","எல்லாப் பணத்தையும் UPI அல்லது வங்கிப் பரிமாற்றத்தில் வைப்போமா?","ಎಲ್ಲಾ ಪಾವತಿಗಳನ್ನು UPI ಅಥವಾ ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆಯಲ್ಲಿ ಇಡೋಣವೇ?"],
sg_late_penalty:["What happens if delivery is late?","डिलीवरी देर से हुई तो क्या होगा?","डिलिव्हरी उशिरा झाली तर काय?","డెలివరీ ఆలస్యమైతే ఏమిటి?","டெலிவரி தாமதமானால் என்ன?","ಡೆಲಿವರಿ ತಡವಾದರೆ ಏನು?"],
sg_quality:["If something arrives damaged, can it be replaced within 2 days?","अगर कुछ खराब आया, तो क्या 2 दिन में बदल देंगे?","काही खराब आले, तर 2 दिवसांत बदलून द्याल का?","ఏదైనా పాడై వస్తే 2 రోజుల్లో మార్చి ఇస్తారా?","ஏதாவது சேதமாக வந்தால் 2 நாளில் மாற்றித் தருவீர்களா?","ಏನಾದರೂ ಹಾಳಾಗಿ ಬಂದರೆ 2 ದಿನದಲ್ಲಿ ಬದಲಿಸುತ್ತೀರಾ?"],
sg_cancellation:["If the order is cancelled after work starts, who covers the cost?","काम शुरू होने के बाद ऑर्डर रद्द हुआ, तो खर्च कौन देगा?","काम सुरू झाल्यावर ऑर्डर रद्द झाली, तर खर्च कोण देईल?","పని మొదలయ్యాక ఆర్డర్ రద్దయితే ఖర్చు ఎవరు భరిస్తారు?","வேலை தொடங்கிய பின் ஆர்டர் ரத்தானால் செலவை யார் ஏற்பார்?","ಕೆಲಸ ಶುರುವಾದ ಮೇಲೆ ಆರ್ಡರ್ ರದ್ದಾದರೆ ವೆಚ್ಚ ಯಾರು ಭರಿಸುತ್ತಾರೆ?"],
sg_ip:["Who will own the designs and files after payment?","भुगतान के बाद डिज़ाइन और फ़ाइलें किसकी होंगी?","पैसे दिल्यानंतर डिझाइन आणि फाइल्स कोणाच्या असतील?","చెల్లింపు తర్వాత డిజైన్లు, ఫైళ్లు ఎవరివి?","பணம் செலுத்திய பின் வடிவமைப்புகளும் கோப்புகளும் யாருடையவை?","ಪಾವತಿಯ ನಂತರ ವಿನ್ಯಾಸ ಮತ್ತು ಫೈಲ್ ಯಾರದು?"],
sg_resale:["Will these be resold? Resale must not be above MRP.","क्या इन्हें दोबारा बेचा जाएगा? दोबारा बिक्री MRP से ज़्यादा पर नहीं होनी चाहिए।","या पुन्हा विकल्या जातील का? पुनर्विक्री MRP पेक्षा जास्त नसावी.","వీటిని మళ్లీ అమ్ముతారా? MRP కంటే ఎక్కువకు అమ్మకూడదు.","இவை மறுவிற்பனை செய்யப்படுமா? MRP க்கு மேல் விற்கக்கூடாது.","ಇವನ್ನು ಮರುಮಾರಾಟ ಮಾಡುತ್ತೀರಾ? MRP ಗಿಂತ ಹೆಚ್ಚಿಗೆ ಮಾರಬಾರದು."],
sg_disputes:["If we ever disagree, can we try mediation first?","अगर कभी असहमति हुई, तो क्या पहले मध्यस्थता आज़माएं?","कधी मतभेद झाला, तर आधी मध्यस्थी करून पाहूया का?","ఎప్పుడైనా అభిప్రాయభేదం వస్తే ముందు మధ్యవర్తిత్వం ప్రయత్నిద్దామా?","எப்போதாவது கருத்து வேறுபாடு வந்தால் முதலில் சமரசம் முயல்வோமா?","ಎಂದಾದರೂ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಬಂದರೆ ಮೊದಲು ಮಧ್ಯಸ್ಥಿಕೆ ಪ್ರಯತ್ನಿಸೋಣವೇ?"],

feeNote:["The lawyer keeps their full fee. DraftIt charges you a small platform fee, and lawyers pay a flat listing fee, so no one shares legal fees.", "वकील पूरी फ़ीस रखता है। DraftIt आपसे छोटी प्लेटफ़ॉर्म फ़ीस लेता है, और वकील तय लिस्टिंग फ़ीस देते हैं, ताकि कानूनी फ़ीस का बंटवारा न हो।", "वकील पूर्ण फी ठेवतात. DraftIt तुमच्याकडून छोटी प्लॅटफॉर्म फी घेतो आणि वकील ठराविक लिस्टिंग फी देतात, म्हणजे कायदेशीर फीची वाटणी होत नाही.", "న్యాయవాది పూర్తి ఫీజు తీసుకుంటారు. DraftIt మీ నుంచి చిన్న ప్లాట్‌ఫాం ఫీజు తీసుకుంటుంది, న్యాయవాదులు స్థిర లిస్టింగ్ ఫీజు చెల్లిస్తారు, కాబట్టి న్యాయ ఫీజు పంచుకోవడం ఉండదు.", "வழக்கறிஞர் முழுக் கட்டணத்தையும் பெறுவார். DraftIt உங்களிடம் சிறிய தளக் கட்டணம் வசூலிக்கும்; வழக்கறிஞர்கள் நிலையான பட்டியல் கட்டணம் செலுத்துவர்; எனவே சட்டக் கட்டணப் பகிர்வு இல்லை.", "ವಕೀಲರು ಪೂರ್ತಿ ಶುಲ್ಕ ಪಡೆಯುತ್ತಾರೆ. DraftIt ನಿಮ್ಮಿಂದ ಸಣ್ಣ ಪ್ಲಾಟ್‌ಫಾರ್ಮ್ ಶುಲ್ಕ ಪಡೆಯುತ್ತದೆ, ವಕೀಲರು ನಿಗದಿತ ಲಿಸ್ಟಿಂಗ್ ಶುಲ್ಕ ಕೊಡುತ್ತಾರೆ; ಹೀಗಾಗಿ ಕಾನೂನು ಶುಲ್ಕ ಹಂಚಿಕೆ ಇಲ್ಲ."],

notaryB:["A notary attests in person. Book a slot, then carry the printed agreement and photo ID. The notary fee is as per the Notaries Rules.","नोटरी व्यक्तिगत रूप से सत्यापित करता है। स्लॉट बुक करें, फिर छपा समझौता और फ़ोटो ID साथ ले जाएं। नोटरी फ़ीस नोटरी नियमों के अनुसार।","नोटरी प्रत्यक्ष साक्षांकन करतात. स्लॉट बुक करा, मग छापील करार आणि फोटो ओळखपत्र सोबत न्या. नोटरी फी नोटरी नियमांनुसार.","నోటరీ స్వయంగా ధృవీకరిస్తారు. స్లాట్ బుక్ చేసి, ముద్రించిన ఒప్పందం, ఫోటో ID తీసుకెళ్లండి. నోటరీ ఫీజు నోటరీ నియమాల ప్రకారం.","நோட்டரி நேரில் சான்றொப்பம் இடுவார். நேரத்தைப் பதிவு செய்து, அச்சிட்ட ஒப்பந்தமும் புகைப்பட அடையாளமும் கொண்டு செல்லுங்கள். நோட்டரி கட்டணம் நோட்டரி விதிகளின்படி.","ನೋಟರಿ ಖುದ್ದಾಗಿ ದೃಢೀಕರಿಸುತ್ತಾರೆ. ಸ್ಲಾಟ್ ಬುಕ್ ಮಾಡಿ, ಮುದ್ರಿತ ಒಪ್ಪಂದ ಮತ್ತು ಫೋಟೋ ID ತೆಗೆದುಕೊಂಡು ಹೋಗಿ. ನೋಟರಿ ಶುಲ್ಕ ನೋಟರಿ ನಿಯಮಗಳ ಪ್ರಕಾರ."],

dataB1:["Your chats, files, agreements, signatures and their fingerprints, and your name, mobile and role.","आपकी चैट, फ़ाइलें, समझौते, हस्ताक्षर और उनके फिंगरप्रिंट, और आपका नाम, मोबाइल और भूमिका।","तुमचे चॅट, फाइल्स, करार, सह्या आणि त्यांचे फिंगरप्रिंट, तसेच तुमचे नाव, मोबाइल आणि भूमिका.","మీ చాట్‌లు, ఫైళ్లు, ఒప్పందాలు, సంతకాలు, వాటి ఫింగర్‌ప్రింట్‌లు, మీ పేరు, మొబైల్, పాత్ర.","உங்கள் அரட்டைகள், கோப்புகள், ஒப்பந்தங்கள், கையொப்பங்கள், அவற்றின் கைரேகைகள், உங்கள் பெயர், மொபைல், பங்கு.","ನಿಮ್ಮ ಚಾಟ್, ಫೈಲ್, ಒಪ್ಪಂದ, ಸಹಿ ಮತ್ತು ಅವುಗಳ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್, ನಿಮ್ಮ ಹೆಸರು, ಮೊಬೈಲ್ ಮತ್ತು ಪಾತ್ರ."],
dataT2:["Where it is stored","कहां रखा जाता है","कुठे ठेवला जातो","ఎక్కడ ఉంచుతాము","எங்கே சேமிக்கப்படுகிறது","ಎಲ್ಲಿ ಇಡಲಾಗುತ್ತದೆ"],
dataB2:["In this demo, only in this phone’s browser. In the live app, encrypted, on servers in India.","इस डेमो में सिर्फ़ इस फ़ोन के ब्राउज़र में। असली ऐप में एन्क्रिप्ट करके, भारत के सर्वर पर।","या डेमोमध्ये फक्त या फोनच्या ब्राउझरमध्ये. खऱ्या अ‍ॅपमध्ये एन्क्रिप्ट करून, भारतातील सर्व्हरवर.","ఈ డెమోలో ఈ ఫోన్ బ్రౌజర్‌లో మాత్రమే. అసలు యాప్‌లో ఎన్‌క్రిప్ట్ చేసి, భారత్‌లోని సర్వర్లలో.","இந்த டெமோவில் இந்த போனின் உலாவியில் மட்டும். உண்மையான செயலியில் குறியாக்கம் செய்து, இந்தியச் சேவையகங்களில்.","ಈ ಡೆಮೊದಲ್ಲಿ ಈ ಫೋನ್‌ನ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮಾತ್ರ. ನಿಜವಾದ ಆ್ಯಪ್‌ನಲ್ಲಿ ಎನ್‌ಕ್ರಿಪ್ಟ್ ಮಾಡಿ, ಭಾರತದ ಸರ್ವರ್‌ಗಳಲ್ಲಿ."],
dataT3:["Who can see it","इसे कौन देख सकता है","तो कोण पाहू शकतो","ఎవరు చూడగలరు","யார் பார்க்கலாம்","ಯಾರು ನೋಡಬಹುದು"],
dataB3:["Only the people in a deal, and a lawyer you choose. Never sold to anyone.","सिर्फ़ सौदे के लोग, और जिस वकील को आप चुनें। किसी को कभी नहीं बेचा जाता।","फक्त व्यवहारातील लोक आणि तुम्ही निवडलेले वकील. कधीही कोणालाही विकला जात नाही.","డీల్‌లోని వ్యక్తులు, మీరు ఎంచుకున్న న్యాయవాది మాత్రమే. ఎవరికీ అమ్మము.","ஒப்பந்தத்தில் உள்ளவர்களும், நீங்கள் தேர்ந்தெடுக்கும் வழக்கறிஞரும் மட்டும். யாருக்கும் விற்கப்படாது.","ವ್ಯವಹಾರದಲ್ಲಿರುವವರು ಮತ್ತು ನೀವು ಆಯ್ಕೆ ಮಾಡುವ ವಕೀಲರು ಮಾತ್ರ. ಯಾರಿಗೂ ಮಾರುವುದಿಲ್ಲ."],
dataT4:["AI training","AI ट्रेनिंग","AI प्रशिक्षण","AI శిక్షణ","AI பயிற்சி","AI ತರಬೇತಿ"],
dataB4:["Off unless you allow it. If you allow it, names and numbers are removed first. You can turn it off any time.","जब तक आप अनुमति न दें, बंद है। अनुमति दें तो पहले नाम और नंबर हटाए जाते हैं। कभी भी बंद कर सकते हैं।","तुम्ही परवानगी देईपर्यंत बंद. परवानगी दिल्यास आधी नावे व नंबर काढले जातात. कधीही बंद करू शकता.","మీరు అనుమతించే వరకు ఆఫ్. అనుమతిస్తే ముందుగా పేర్లు, నంబర్లు తీసేస్తాం. ఎప్పుడైనా ఆపవచ్చు.","நீங்கள் அனுமதிக்கும் வரை அணைந்திருக்கும். அனுமதித்தால் முதலில் பெயர்கள், எண்கள் நீக்கப்படும். எப்போதும் அணைக்கலாம்.","ನೀವು ಅನುಮತಿಸುವವರೆಗೆ ಆಫ್. ಅನುಮತಿಸಿದರೆ ಮೊದಲು ಹೆಸರು ಮತ್ತು ಸಂಖ್ಯೆ ತೆಗೆಯಲಾಗುತ್ತದೆ. ಯಾವಾಗ ಬೇಕಾದರೂ ಆಫ್ ಮಾಡಬಹುದು."],

dataB5:["Under the DPDP Act, 2023 you can see, correct or delete your data and withdraw consent. Contact the grievance officer at grievance@draftit.example (demo).","DPDP अधिनियम, 2023 के तहत आप अपना डेटा देख, सुधार या हटा सकते हैं और सहमति वापस ले सकते हैं। शिकायत अधिकारी: grievance@draftit.example (डेमो)।","DPDP कायदा, 2023 नुसार तुम्ही तुमचा डेटा पाहू, दुरुस्त किंवा हटवू शकता आणि संमती मागे घेऊ शकता. तक्रार अधिकारी: grievance@draftit.example (डेमो).","DPDP చట్టం, 2023 ప్రకారం మీరు మీ డేటాను చూడవచ్చు, సరిచేయవచ్చు, తొలగించవచ్చు, అనుమతి ఉపసంహరించవచ్చు. ఫిర్యాదుల అధికారి: grievance@draftit.example (డెమో).","DPDP சட்டம், 2023 இன்படி உங்கள் தரவைப் பார்க்க, திருத்த, நீக்க, ஒப்புதலைத் திரும்பப் பெறலாம். குறைதீர் அலுவலர்: grievance@draftit.example (டெமோ).","DPDP ಕಾಯ್ದೆ, 2023ರ ಅಡಿ ನಿಮ್ಮ ಡೇಟಾ ನೋಡಬಹುದು, ತಿದ್ದಬಹುದು, ಅಳಿಸಬಹುದು ಮತ್ತು ಒಪ್ಪಿಗೆ ಹಿಂಪಡೆಯಬಹುದು. ಕುಂದುಕೊರತೆ ಅಧಿಕಾರಿ: grievance@draftit.example (ಡೆಮೊ)."],

dataB6:["Until you delete it. Keep deal records for at least 3 years, the usual time limit to sue on a contract.","जब तक आप न हटाएं। सौदे के रिकॉर्ड कम से कम 3 साल रखें, अनुबंध पर मुकदमे की आम समय सीमा यही है।","तुम्ही हटवेपर्यंत. व्यवहाराच्या नोंदी किमान 3 वर्षे ठेवा, करारावर दावा करण्याची सामान्य मुदत तीच आहे.","మీరు తొలగించే వరకు. డీల్ రికార్డులను కనీసం 3 ఏళ్లు ఉంచండి, ఒప్పందంపై దావా వేయడానికి సాధారణ గడువు అదే.","நீங்கள் நீக்கும் வரை. ஒப்பந்தப் பதிவுகளைக் குறைந்தது 3 ஆண்டுகள் வையுங்கள்; ஒப்பந்தத்தின் மீது வழக்குத் தொடர வழக்கமான காலவரம்பு அதுவே.","ನೀವು ಅಳಿಸುವವರೆಗೆ. ವ್ಯವಹಾರದ ದಾಖಲೆಗಳನ್ನು ಕನಿಷ್ಠ 3 ವರ್ಷ ಇಡಿ; ಒಪ್ಪಂದದ ಮೇಲೆ ದಾವೆ ಹೂಡುವ ಸಾಮಾನ್ಯ ಗಡುವು ಅದೇ."],

fraudDetail:["The chat talks about doing this without a bill to save GST. That is tax evasion, it makes this part of the deal void, and you lose the proof you need if the other side does not pay. Cash is fine, but keep it billed and recorded.","चैट में GST बचाने के लिए बिना बिल काम करने की बात है। यह टैक्स चोरी है, इससे सौदे का यह हिस्सा शून्य हो जाता है, और अगर सामने वाला पैसे न दे तो आपके पास सबूत नहीं रहता। नकद ठीक है, पर बिल बनाएं और रिकॉर्ड रखें।","चॅटमध्ये GST वाचवण्यासाठी बिलाशिवाय काम करण्याची चर्चा आहे. ही करचोरी आहे, त्यामुळे व्यवहाराचा हा भाग शून्य ठरतो, आणि समोरच्याने पैसे दिले नाहीत तर तुमच्याकडे पुरावा राहत नाही. रोख चालेल, पण बिल करा आणि नोंद ठेवा.","చాట్‌లో GST మిగల్చడానికి బిల్ లేకుండా చేయాలనే మాట ఉంది. అది పన్ను ఎగవేత, దీనివల్ల డీల్‌లో ఈ భాగం చెల్లదు, అవతలివారు డబ్బు ఇవ్వకపోతే మీ దగ్గర రుజువు ఉండదు. నగదు సరే, కానీ బిల్ ఇచ్చి రికార్డు ఉంచండి.","அரட்டையில் GST மிச்சப்படுத்த பில் இல்லாமல் செய்யும் பேச்சு உள்ளது. இது வரி ஏய்ப்பு; இதனால் ஒப்பந்தத்தின் இந்தப் பகுதி செல்லாது; மறுதரப்பு பணம் தராவிட்டால் உங்களிடம் சான்று இருக்காது. ரொக்கம் சரி, ஆனால் பில் போட்டுப் பதிவு வையுங்கள்.","ಚಾಟ್‌ನಲ್ಲಿ GST ಉಳಿಸಲು ಬಿಲ್ ಇಲ್ಲದೆ ಮಾಡುವ ಮಾತಿದೆ. ಇದು ತೆರಿಗೆ ವಂಚನೆ; ಇದರಿಂದ ವ್ಯವಹಾರದ ಈ ಭಾಗ ಅಸಿಂಧು; ಎದುರಿನವರು ಹಣ ಕೊಡದಿದ್ದರೆ ನಿಮ್ಮ ಬಳಿ ಪುರಾವೆ ಇರುವುದಿಲ್ಲ. ನಗದು ಸರಿ, ಆದರೆ ಬಿಲ್ ಮಾಡಿ ದಾಖಲೆ ಇಡಿ."],

readsEnglish:["Reads in English, the language of the formal agreement.","औपचारिक समझौते की भाषा, अंग्रेज़ी में पढ़ता है।","औपचारिक कराराच्या भाषेत, इंग्रजीत वाचतो.","అధికారిక ఒప్పందం భాష అయిన ఇంగ్లీష్‌లో చదువుతుంది.","முறையான ஒப்பந்தத்தின் மொழியான ஆங்கிலத்தில் படிக்கும்.","ಔಪಚಾರಿಕ ಒಪ್ಪಂದದ ಭಾಷೆಯಾದ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಓದುತ್ತದೆ."],

logoNote:["Logos appear at the top of the formal agreement and quotation. Seals appear next to signatures. Their fingerprints are sealed into the next locked version.","लोगो औपचारिक समझौते और कोटेशन में ऊपर दिखते हैं। मुहर हस्ताक्षर के पास दिखती है। इनके फिंगरप्रिंट अगले लॉक संस्करण में सील होते हैं।","लोगो औपचारिक करार आणि कोटेशनच्या वर दिसतात. शिक्का सहीजवळ दिसतो. त्यांचे फिंगरप्रिंट पुढील लॉक आवृत्तीत सील होतात.","లోగోలు అధికారిక ఒప్పందం, కొటేషన్ పైభాగంలో కనిపిస్తాయి. ముద్ర సంతకం దగ్గర కనిపిస్తుంది. వాటి ఫింగర్‌ప్రింట్‌లు తర్వాతి లాక్ వెర్షన్‌లో సీల్ అవుతాయి.","லோகோக்கள் முறையான ஒப்பந்தம், விலைப்புள்ளியின் மேலே தெரியும். முத்திரை கையொப்பத்தின் அருகே தெரியும். அவற்றின் கைரேகைகள் அடுத்த பூட்டிய பதிப்பில் முத்திரையிடப்படும்.","ಲೋಗೋಗಳು ಔಪಚಾರಿಕ ಒಪ್ಪಂದ ಮತ್ತು ಕೊಟೇಶನ್‌ನ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಕಾಣುತ್ತವೆ. ಮೊಹರು ಸಹಿಯ ಬಳಿ ಕಾಣುತ್ತದೆ. ಅವುಗಳ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ ಮುಂದಿನ ಲಾಕ್ ಆವೃತ್ತಿಯಲ್ಲಿ ಮೊಹರಾಗುತ್ತವೆ."],
signNote:["Each side signs on their own phone. Every signature is tied to this version’s fingerprint.","हर पक्ष अपने फ़ोन से साइन करता है। हर हस्ताक्षर इस संस्करण के फिंगरप्रिंट से बंधा है।","प्रत्येक पक्ष आपल्या फोनवरून सही करतो. प्रत्येक सही या आवृत्तीच्या फिंगरप्रिंटशी बांधलेली आहे.","ప్రతి పక్షం తమ ఫోన్‌లో సంతకం చేస్తారు. ప్రతి సంతకం ఈ వెర్షన్ ఫింగర్‌ప్రింట్‌కు కట్టుబడి ఉంటుంది.","ஒவ்வொரு தரப்பும் தங்கள் போனில் கையொப்பமிடுவர். ஒவ்வொரு கையொப்பமும் இந்தப் பதிப்பின் கைரேகையுடன் பிணைக்கப்பட்டது.","ಪ್ರತಿ ಪಕ್ಷ ತಮ್ಮ ಫೋನ್‌ನಲ್ಲಿ ಸಹಿ ಮಾಡುತ್ತಾರೆ. ಪ್ರತಿ ಸಹಿ ಈ ಆವೃತ್ತಿಯ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್‌ಗೆ ಬಂಧಿತ."],

aadhaarPrivacy:["DraftIt never stores your Aadhaar number. Only the last 4 digits appear on the certificate.", "DraftIt आपका आधार नंबर कभी सेव नहीं करता। सर्टिफ़िकेट पर सिर्फ़ आख़िरी 4 अंक दिखते हैं।", "DraftIt तुमचा आधार क्रमांक कधीही जतन करत नाही. प्रमाणपत्रावर फक्त शेवटचे 4 अंक दिसतात.", "DraftIt మీ ఆధార్ నంబర్‌ను ఎప్పుడూ సేవ్ చేయదు. సర్టిఫికెట్‌పై చివరి 4 అంకెలే కనిపిస్తాయి.", "DraftIt உங்கள் ஆதார் எண்ணை ஒருபோதும் சேமிக்காது. சான்றிதழில் கடைசி 4 இலக்கங்கள் மட்டுமே தெரியும்.", "DraftIt ನಿಮ್ಮ ಆಧಾರ್ ಸಂಖ್ಯೆಯನ್ನು ಎಂದಿಗೂ ಉಳಿಸುವುದಿಲ್ಲ. ಪ್ರಮಾಣಪತ್ರದಲ್ಲಿ ಕೊನೆಯ 4 ಅಂಕಿ ಮಾತ್ರ ಕಾಣುತ್ತವೆ."],
needAadhaar:["Enter a 12-digit Aadhaar number or 16-digit Virtual ID.","12 अंकों का आधार नंबर या 16 अंकों की वर्चुअल ID डालें।","12 अंकी आधार क्रमांक किंवा 16 अंकी व्हर्च्युअल ID टाका.","12 అంకెల ఆధార్ లేదా 16 అంకెల వర్చువల్ ID ఇవ్వండి.","12 இலக்க ஆதார் எண் அல்லது 16 இலக்க மெய்நிகர் ID ஐ உள்ளிடவும்.","12 ಅಂಕಿಯ ಆಧಾರ್ ಅಥವಾ 16 ಅಂಕಿಯ ವರ್ಚುವಲ್ ID ನಮೂದಿಸಿ."],
esignOtpSent:["OTP sent to the mobile linked with Aadhaar ending {last}.","{last} पर ख़त्म होने वाले आधार से जुड़े मोबाइल पर OTP भेजा गया।","{last} ने संपणाऱ्या आधारशी जोडलेल्या मोबाइलवर OTP पाठवला.","{last}తో ముగిసే ఆధార్‌కు లింక్ అయిన మొబైల్‌కు OTP పంపాం.","{last} இல் முடியும் ஆதாருடன் இணைந்த மொபைலுக்கு OTP அனுப்பப்பட்டது.","{last} ರಲ್ಲಿ ಕೊನೆಗೊಳ್ಳುವ ಆಧಾರ್‌ಗೆ ಜೋಡಿಸಿದ ಮೊಬೈಲ್‌ಗೆ OTP ಕಳುಹಿಸಲಾಗಿದೆ."],
esignConsent:["I agree to sign version {n} (fingerprint {hash}) with Aadhaar eSign.","मैं संस्करण {n} (फिंगरप्रिंट {hash}) पर आधार ई-साइन से हस्ताक्षर करने के लिए सहमत हूं।","मी आवृत्ती {n} (फिंगरप्रिंट {hash}) वर आधार ई-साइनने सही करण्यास संमती देतो.","వెర్షన్ {n} (ఫింగర్‌ప్రింట్ {hash})పై ఆధార్ ఈ-సైన్‌తో సంతకం చేయడానికి నేను అంగీకరిస్తున్నాను.","பதிப்பு {n} (கைரேகை {hash}) இல் ஆதார் இ-சைன் மூலம் கையொப்பமிட ஒப்புக்கொள்கிறேன்.","ಆವೃತ್ತಿ {n} (ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ {hash}) ಗೆ ಆಧಾರ್ ಇ-ಸೈನ್ ಮೂಲಕ ಸಹಿ ಮಾಡಲು ಒಪ್ಪುತ್ತೇನೆ."],
esignNow:["eSign this version","इस संस्करण पर ई-साइन करें","या आवृत्तीवर ई-साइन करा","ఈ వెర్షన్‌పై ఈ-సైన్ చేయండి","இந்தப் பதிப்பில் இ-சைன் செய்","ಈ ಆವೃತ್ತಿಗೆ ಇ-ಸೈನ್ ಮಾಡಿ"],
esignDemoNote:["Demo of Aadhaar eSign: any 6 digits work. The live app sends this to a government-licensed eSign provider, which returns a signed certificate.","आधार ई-साइन का डेमो: कोई भी 6 अंक चलेंगे। असली ऐप इसे सरकार से लाइसेंसशुदा ई-साइन प्रदाता को भेजता है, जो साइन किया सर्टिफ़िकेट लौटाता है।","आधार ई-साइनचा डेमो: कोणतेही 6 अंक चालतील. खरे अ‍ॅप हे सरकारमान्य ई-साइन प्रदात्याकडे पाठवते, जो सही केलेले प्रमाणपत्र परत देतो.","ఆధార్ ఈ-సైన్ డెమో: ఏ 6 అంకెలైనా సరే. అసలు యాప్ దీన్ని ప్రభుత్వ లైసెన్స్ ఉన్న ఈ-సైన్ సంస్థకు పంపుతుంది, అది సంతకం చేసిన సర్టిఫికెట్ ఇస్తుంది.","ஆதார் இ-சைன் டெமோ: எந்த 6 இலக்கமும் போதும். உண்மையான செயலி இதை அரசு உரிமம் பெற்ற இ-சைன் வழங்குநருக்கு அனுப்பும்; அது கையொப்பமிட்ட சான்றிதழைத் தரும்.","ಆಧಾರ್ ಇ-ಸೈನ್ ಡೆಮೊ: ಯಾವುದೇ 6 ಅಂಕಿ ಸಾಕು. ನಿಜವಾದ ಆ್ಯಪ್ ಇದನ್ನು ಸರ್ಕಾರದ ಪರವಾನಗಿ ಪಡೆದ ಇ-ಸೈನ್ ಸೇವಾದಾರರಿಗೆ ಕಳುಹಿಸುತ್ತದೆ, ಅವರು ಸಹಿ ಮಾಡಿದ ಪ್ರಮಾಣಪತ್ರ ನೀಡುತ್ತಾರೆ."],

fileCheckB:["Choose any copy of this file, for example from your phone or a court bundle. DraftIt compares its fingerprint with the one saved on upload.", "इस फ़ाइल की कोई भी कॉपी चुनें, जैसे फ़ोन से या अदालत के बंडल से। DraftIt उसका फिंगरप्रिंट अपलोड के समय सेव किए फिंगरप्रिंट से मिलाता है।", "या फाइलची कोणतीही प्रत निवडा, उदा. फोनमधून किंवा न्यायालयीन संचातून. DraftIt तिचा फिंगरप्रिंट अपलोडवेळी जतन केलेल्याशी जुळवतो.", "ఈ ఫైల్ ఏ కాపీనైనా ఎంచుకోండి, ఉదా. ఫోన్ నుంచి లేదా కోర్టు బండిల్ నుంచి. DraftIt దాని ఫింగర్‌ప్రింట్‌ను అప్‌లోడ్ సమయంలో సేవ్ చేసినదానితో పోలుస్తుంది.", "இந்தக் கோப்பின் எந்த நகலையும் தேர்ந்தெடுங்கள், உதாரணமாக போனிலிருந்து அல்லது நீதிமன்றத் தொகுப்பிலிருந்து. DraftIt அதன் கைரேகையைப் பதிவேற்றும்போது சேமித்ததுடன் ஒப்பிடும்.", "ಈ ಫೈಲ್‌ನ ಯಾವುದೇ ನಕಲು ಆಯ್ಕೆಮಾಡಿ, ಉದಾ. ಫೋನ್‌ನಿಂದ ಅಥವಾ ನ್ಯಾಯಾಲಯದ ಕಡತದಿಂದ. DraftIt ಅದರ ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ ಅನ್ನು ಅಪ್‌ಲೋಡ್ ವೇಳೆ ಉಳಿಸಿದುದರೊಂದಿಗೆ ಹೋಲಿಸುತ್ತದೆ."],

cmpWhy_A:["Only your DraftIt agreement covers this.", "यह सिर्फ़ आपके DraftIt समझौते में है।", "हे फक्त तुमच्या DraftIt करारात आहे.", "ఇది మీ DraftIt ఒప్పందంలో మాత్రమే ఉంది.", "இது உங்கள் DraftIt ஒப்பந்தத்தில் மட்டுமே உள்ளது.", "ಇದು ನಿಮ್ಮ DraftIt ಒಪ್ಪಂದದಲ್ಲಿ ಮಾತ್ರ ಇದೆ."],
cmpWhy_B:["Only the uploaded agreement covers this. Check if you want to add it.","यह सिर्फ़ अपलोड किए समझौते में है। देखें कि क्या इसे जोड़ना है।","हे फक्त अपलोड केलेल्या करारात आहे. ते जोडायचे का ते पाहा.","ఇది అప్‌లోడ్ చేసిన ఒప్పందంలో మాత్రమే ఉంది. జోడించాలో చూడండి.","இது பதிவேற்றிய ஒப்பந்தத்தில் மட்டுமே உள்ளது. சேர்க்க வேண்டுமா என்று பாருங்கள்.","ಇದು ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಒಪ್ಪಂದದಲ್ಲಿ ಮಾತ್ರ ಇದೆ. ಸೇರಿಸಬೇಕೇ ಎಂದು ನೋಡಿ."],
cmpWhy_same:["Both cover this. Read the two side by side.","दोनों में है। दोनों को साथ रखकर पढ़ें।","दोन्हीत आहे. दोन्ही शेजारी ठेवून वाचा.","రెండింటిలో ఉంది. పక్కపక్కనే చదవండి.","இரண்டிலும் உள்ளது. அருகருகே வைத்துப் படியுங்கள்.","ಎರಡರಲ್ಲೂ ಇದೆ. ಅಕ್ಕಪಕ್ಕ ಇಟ್ಟು ಓದಿ."],
cmpWhy_neither:["Neither agreement covers this yet.","अभी किसी समझौते में यह नहीं है।","अजून कोणत्याच करारात हे नाही.","ఇంకా ఏ ఒప్పందంలోనూ ఇది లేదు.","இன்னும் எந்த ஒப்பந்தத்திலும் இது இல்லை.","ಇನ್ನೂ ಯಾವ ಒಪ್ಪಂದದಲ್ಲೂ ಇದು ಇಲ್ಲ."],
cmpSum_A:["Your DraftIt agreement covers {a} points the uploaded one misses, and the uploaded one has {r} risky terms.", "आपका DraftIt समझौता {a} ऐसी बातें कवर करता है जो अपलोड किए में नहीं हैं, और अपलोड किए में {r} जोखिम भरी शर्तें हैं।", "तुमचा DraftIt करार {a} मुद्दे समाविष्ट करतो जे अपलोड केलेल्यात नाहीत, आणि अपलोड केलेल्यात {r} धोकादायक अटी आहेत.", "అప్‌లోడ్ చేసినదానిలో లేని {a} అంశాలు మీ DraftIt ఒప్పందంలో ఉన్నాయి, అప్‌లోడ్ చేసినదానిలో {r} ప్రమాదకర నిబంధనలు ఉన్నాయి.", "பதிவேற்றியதில் இல்லாத {a} அம்சங்கள் உங்கள் DraftIt ஒப்பந்தத்தில் உள்ளன; பதிவேற்றியதில் {r} ஆபத்தான நிபந்தனைகள் உள்ளன.", "ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ್ದರಲ್ಲಿ ಇಲ್ಲದ {a} ಅಂಶಗಳು ನಿಮ್ಮ DraftIt ಒಪ್ಪಂದದಲ್ಲಿವೆ, ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ್ದರಲ್ಲಿ {r} ಅಪಾಯಕಾರಿ ಷರತ್ತುಗಳಿವೆ."],
cmpSum_B:["The uploaded agreement covers {b} points yours misses and has no obvious risky terms.","अपलोड किया समझौता {b} ऐसी बातें कवर करता है जो आपके में नहीं हैं, और उसमें कोई साफ़ जोखिम भरी शर्त नहीं है।","अपलोड केलेला करार {b} मुद्दे समाविष्ट करतो जे तुमच्यात नाहीत, आणि त्यात स्पष्ट धोकादायक अटी नाहीत.","మీదానిలో లేని {b} అంశాలు అప్‌లోడ్ చేసినదానిలో ఉన్నాయి, స్పష్టమైన ప్రమాదకర నిబంధనలు లేవు.","உங்களுடையதில் இல்லாத {b} அம்சங்கள் பதிவேற்றியதில் உள்ளன; வெளிப்படையான ஆபத்தான நிபந்தனைகள் இல்லை.","ನಿಮ್ಮದರಲ್ಲಿ ಇಲ್ಲದ {b} ಅಂಶಗಳು ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ್ದರಲ್ಲಿವೆ, ಸ್ಪಷ್ಟ ಅಪಾಯಕಾರಿ ಷರತ್ತುಗಳಿಲ್ಲ."],
cmpSum_mixed:["Each covers some points the other misses ({a} for yours, {b} for theirs), with {r} risky terms in the uploaded one.","दोनों में कुछ बातें हैं जो दूसरे में नहीं (आपके में {a}, उनके में {b}), और अपलोड किए में {r} जोखिम भरी शर्तें हैं।","दोन्हीत काही मुद्दे आहेत जे दुसऱ्यात नाहीत (तुमच्यात {a}, त्यांच्यात {b}), आणि अपलोड केलेल्यात {r} धोकादायक अटी आहेत.","ఒకదానిలో లేనివి మరొకదానిలో ఉన్నాయి (మీదిలో {a}, వారిదిలో {b}), అప్‌లోడ్ చేసినదానిలో {r} ప్రమాదకర నిబంధనలు ఉన్నాయి.","ஒன்றில் இல்லாதவை மற்றதில் உள்ளன (உங்களுடையதில் {a}, அவர்களுடையதில் {b}); பதிவேற்றியதில் {r} ஆபத்தான நிபந்தனைகள் உள்ளன.","ಒಂದರಲ್ಲಿ ಇಲ್ಲದ್ದು ಇನ್ನೊಂದರಲ್ಲಿದೆ (ನಿಮ್ಮದರಲ್ಲಿ {a}, ಅವರದರಲ್ಲಿ {b}), ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ್ದರಲ್ಲಿ {r} ಅಪಾಯಕಾರಿ ಷರತ್ತುಗಳಿವೆ."],
cmpSuggest:["Do not sign the uploaded version as it is. Send them your DraftIt agreement, or ask them to change the risky terms.", "अपलोड किए संस्करण पर ऐसे ही साइन न करें। उन्हें अपना DraftIt समझौता भेजें, या जोखिम भरी शर्तें बदलने को कहें।", "अपलोड केलेल्या आवृत्तीवर जशीच्या तशी सही करू नका. त्यांना तुमचा DraftIt करार पाठवा, किंवा धोकादायक अटी बदलायला सांगा.", "అప్‌లోడ్ చేసిన వెర్షన్‌పై అలాగే సంతకం చేయకండి. మీ DraftIt ఒప్పందం పంపండి, లేదా ప్రమాదకర నిబంధనలు మార్చమని అడగండి.", "பதிவேற்றிய பதிப்பில் அப்படியே கையொப்பமிடாதீர்கள். உங்கள் DraftIt ஒப்பந்தத்தை அனுப்புங்கள், அல்லது ஆபத்தான நிபந்தனைகளை மாற்றச் சொல்லுங்கள்.", "ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಆವೃತ್ತಿಗೆ ಹಾಗೆಯೇ ಸಹಿ ಮಾಡಬೇಡಿ. ನಿಮ್ಮ DraftIt ಒಪ್ಪಂದ ಕಳುಹಿಸಿ, ಅಥವಾ ಅಪಾಯಕಾರಿ ಷರತ್ತು ಬದಲಿಸಲು ಕೇಳಿ."],

rk_unlimited:["Unlimited liability: you could owe any amount, with no cap.","असीमित ज़िम्मेदारी: आपको कितनी भी रकम देनी पड़ सकती है, कोई सीमा नहीं।","अमर्याद जबाबदारी: तुम्हाला कितीही रक्कम द्यावी लागू शकते, मर्यादा नाही.","అపరిమిత బాధ్యత: ఎంత మొత్తమైనా చెల్లించాల్సి రావచ్చు, పరిమితి లేదు.","வரம்பற்ற பொறுப்பு: எந்தத் தொகையும் செலுத்த வேண்டியிருக்கலாம், வரம்பு இல்லை.","ಅಪರಿಮಿತ ಹೊಣೆ: ಎಷ್ಟು ಮೊತ್ತವಾದರೂ ಕೊಡಬೇಕಾಗಬಹುದು, ಮಿತಿ ಇಲ್ಲ."],
rk_longpay:["Long payment period, beyond the 45 days that MSME law allows.","भुगतान की लंबी अवधि, MSME कानून की 45 दिन की सीमा से ज़्यादा।","पैसे देण्याचा दीर्घ कालावधी, MSME कायद्याच्या 45 दिवसांपेक्षा जास्त.","సుదీర్ఘ చెల్లింపు గడువు, MSME చట్టం అనుమతించే 45 రోజులకు మించి.","நீண்ட பணம் செலுத்தும் காலம், MSME சட்டம் அனுமதிக்கும் 45 நாட்களுக்கு மேல்.","ದೀರ್ಘ ಪಾವತಿ ಅವಧಿ, MSME ಕಾಯ್ದೆ ಅನುಮತಿಸುವ 45 ದಿನಕ್ಕಿಂತ ಹೆಚ್ಚು."],
rk_discretion:["They can reject goods at their “sole discretion”, without a clear test.","वे “अपनी मर्ज़ी” से सामान लौटा सकते हैं, कोई साफ़ पैमाना नहीं।","ते “स्वतःच्या मर्जीने” माल नाकारू शकतात, स्पष्ट निकष नाही.","వారు “తమ ఇష్టానుసారం” సరుకు తిరస్కరించవచ్చు, స్పష్టమైన ప్రమాణం లేదు.","அவர்கள் “தங்கள் விருப்பப்படி” பொருளை நிராகரிக்கலாம், தெளிவான அளவுகோல் இல்லை.","ಅವರು “ತಮ್ಮ ಇಚ್ಛೆಯಂತೆ” ಸರಕು ತಿರಸ್ಕರಿಸಬಹುದು, ಸ್ಪಷ್ಟ ಮಾನದಂಡ ಇಲ್ಲ."],
rk_nonrefund:["Advance is non-refundable even if they cancel.","वे रद्द करें तब भी एडवांस वापस नहीं मिलेगा।","त्यांनी रद्द केले तरी आगाऊ रक्कम परत मिळणार नाही.","వారు రద్దు చేసినా అడ్వాన్స్ తిరిగి రాదు.","அவர்கள் ரத்து செய்தாலும் முன்பணம் திரும்பக் கிடைக்காது.","ಅವರು ರದ್ದು ಮಾಡಿದರೂ ಮುಂಗಡ ಹಿಂತಿರುಗುವುದಿಲ್ಲ."],
rk_jurisdiction:["Disputes only in a far-away court, which makes it costly for you.","विवाद सिर्फ़ दूर की अदालत में, जो आपके लिए महंगा है।","वाद फक्त दूरच्या न्यायालयात, जे तुमच्यासाठी खर्चिक आहे.","వివాదాలు దూరంలోని కోర్టులో మాత్రమే, ఇది మీకు ఖర్చుతో కూడినది.","தகராறுகள் தொலைவிலுள்ள நீதிமன்றத்தில் மட்டும், இது உங்களுக்குச் செலவு.","ವಿವಾದಗಳು ದೂರದ ನ್ಯಾಯಾಲಯದಲ್ಲಿ ಮಾತ್ರ, ಇದು ನಿಮಗೆ ದುಬಾರಿ."],
rk_autorenew:["It renews by itself unless cancelled in writing.","लिखित में रद्द न करें तो यह अपने आप नवीनीकृत होता है।","लेखी रद्द न केल्यास हे आपोआप नूतनीकरण होते.","రాతపూర్వకంగా రద్దు చేయకపోతే ఇది దానంతట అదే పునరుద్ధరించబడుతుంది.","எழுத்தில் ரத்து செய்யாவிட்டால் இது தானாகப் புதுப்பிக்கப்படும்.","ಲಿಖಿತವಾಗಿ ರದ್ದು ಮಾಡದಿದ್ದರೆ ಇದು ತಾನಾಗಿ ನವೀಕರಣಗೊಳ್ಳುತ್ತದೆ."],
rk_penaltyPct:["A high daily penalty with no upper limit.","बिना ऊपरी सीमा के रोज़ का भारी जुर्माना।","कमाल मर्यादा नसलेला मोठा दैनिक दंड.","గరిష్ఠ పరిమితి లేని భారీ రోజువారీ జరిమానా.","உச்சவரம்பு இல்லாத அதிக தினசரி அபராதம்.","ಗರಿಷ್ಠ ಮಿತಿ ಇಲ್ಲದ ಭಾರಿ ದೈನಂದಿನ ದಂಡ."],
rk_nocomp:["They can cancel without paying you anything for work done.","वे बिना कुछ दिए रद्द कर सकते हैं, किए गए काम का भी नहीं।","ते काहीही न देता रद्द करू शकतात, केलेल्या कामाचेही नाही.","చేసిన పనికి కూడా ఏమీ ఇవ్వకుండా వారు రద్దు చేయవచ్చు.","செய்த வேலைக்குக் கூட எதுவும் தராமல் அவர்கள் ரத்து செய்யலாம்.","ಮಾಡಿದ ಕೆಲಸಕ್ಕೂ ಏನೂ ಕೊಡದೆ ಅವರು ರದ್ದು ಮಾಡಬಹುದು."],
inviteText2:["{name} ji, let’s settle our deal on DraftIt. Open {link} or open DraftIt and join with code {code}.", "{name} जी, आइए अपना सौदा DraftIt पर तय करें। {link} खोलें, या DraftIt खोलकर कोड {code} से जुड़ें।", "{name} जी, आपला व्यवहार DraftIt वर ठरवूया. {link} उघडा, किंवा DraftIt उघडून कोड {code} ने सामील व्हा.", "{name} గారు, మన డీల్‌ను DraftIt లో తేల్చుకుందాం. {link} తెరవండి, లేదా DraftIt తెరిచి కోడ్ {code}తో చేరండి.", "{name} ஜி, நம் ஒப்பந்தத்தைப் DraftIt இல் முடிப்போம். {link} ஐத் திறங்கள், அல்லது DraftIt ஐத் திறந்து குறியீடு {code} மூலம் சேருங்கள்.", "{name} ಅವರೇ, ನಮ್ಮ ವ್ಯವಹಾರವನ್ನು DraftIt ನಲ್ಲಿ ತೀರ್ಮಾನಿಸೋಣ. {link} ತೆರೆಯಿರಿ, ಅಥವಾ DraftIt ತೆರೆದು ಕೋಡ್ {code} ಮೂಲಕ ಸೇರಿ."],

inv1B:["This demo page is private. Use the Share button at the top of the page once to add {name}. They need to be signed in to Claude.","यह डेमो पेज निजी है। पेज के ऊपर Share बटन से एक बार {name} को जोड़ें। उन्हें Claude में साइन इन होना चाहिए।","हे डेमो पेज खाजगी आहे. पेजच्या वरच्या Share बटणाने एकदा {name} यांना जोडा. त्यांनी Claude मध्ये साइन इन केलेले असावे.","ఈ డెమో పేజీ ప్రైవేట్. పేజీ పైన ఉన్న Share బటన్‌తో ఒకసారి {name}ని జోడించండి. వారు Claudeలో సైన్ ఇన్ అయి ఉండాలి.","இந்த டெமோ பக்கம் தனிப்பட்டது. பக்கத்தின் மேலே உள்ள Share பொத்தானால் ஒருமுறை {name} ஐச் சேர்க்கவும். அவர்கள் Claude இல் உள்நுழைந்திருக்க வேண்டும்.","ಈ ಡೆಮೊ ಪುಟ ಖಾಸಗಿ. ಪುಟದ ಮೇಲಿನ Share ಬಟನ್‌ನಿಂದ ಒಮ್ಮೆ {name} ಅವರನ್ನು ಸೇರಿಸಿ. ಅವರು Claude ನಲ್ಲಿ ಸೈನ್ ಇನ್ ಆಗಿರಬೇಕು."],

inv3B:["If the link does not open the chat, they open DraftIt, tap “Join a chat” and type {code}.", "अगर लिंक से चैट न खुले, तो वे DraftIt खोलें, “चैट से जुड़ें” दबाएं और {code} लिखें।", "लिंकने चॅट उघडले नाही, तर ते DraftIt उघडून “चॅटमध्ये सामील व्हा” दाबतात आणि {code} टाइप करतात.", "లింక్‌తో చాట్ తెరవకపోతే, వారు DraftIt తెరిచి “చాట్‌లో చేరండి” నొక్కి {code} టైప్ చేయాలి.", "இணைப்பால் அரட்டை திறக்கவில்லையென்றால், DraftIt ஐத் திறந்து “அரட்டையில் சேர்” அழுத்தி {code} என்று தட்டச்சு செய்யலாம்.", "ಲಿಂಕ್‌ನಿಂದ ಚಾಟ್ ತೆರೆಯದಿದ್ದರೆ, ಅವರು DraftIt ತೆರೆದು “ಚಾಟ್‌ಗೆ ಸೇರಿ” ಒತ್ತಿ {code} ಟೈಪ್ ಮಾಡುತ್ತಾರೆ."],
invNote:["Messages travel live while both of you have the page open. DraftIt keeps your copy on your phone; save the chat as evidence when you are done.", "जब तक दोनों के पास पेज खुला है, मैसेज लाइव जाते हैं। DraftIt आपकी कॉपी आपके फ़ोन पर रखता है; बात पूरी होने पर चैट को सबूत के रूप में सेव करें।", "दोघांकडे पेज उघडे असेपर्यंत संदेश थेट जातात. DraftIt तुमची प्रत तुमच्या फोनवर ठेवतो; बोलणे झाल्यावर चॅट पुरावा म्हणून जतन करा.", "ఇద్దరి దగ్గర పేజీ తెరిచి ఉన్నంతసేపు సందేశాలు లైవ్‌గా వెళ్తాయి. DraftIt మీ కాపీని మీ ఫోన్‌లో ఉంచుతుంది; పూర్తయ్యాక చాట్‌ను సాక్ష్యంగా సేవ్ చేయండి.", "இருவரிடமும் பக்கம் திறந்திருக்கும் வரை செய்திகள் நேரலையாகச் செல்லும். DraftIt உங்கள் நகலை உங்கள் போனில் வைக்கும்; முடிந்ததும் அரட்டையைச் சான்றாகச் சேமியுங்கள்.", "ಇಬ್ಬರ ಬಳಿಯೂ ಪುಟ ತೆರೆದಿರುವವರೆಗೆ ಸಂದೇಶಗಳು ಲೈವ್ ಆಗಿ ಹೋಗುತ್ತವೆ. DraftIt ನಿಮ್ಮ ನಕಲನ್ನು ನಿಮ್ಮ ಫೋನ್‌ನಲ್ಲಿ ಇಡುತ್ತದೆ; ಮುಗಿದ ಮೇಲೆ ಚಾಟ್ ಅನ್ನು ಸಾಕ್ಷ್ಯವಾಗಿ ಉಳಿಸಿ."],

quip1:["“Ok done 👍” is not a contract. DraftIt turns it into one.","“Ok done 👍” कोई अनुबंध नहीं है। DraftIt उसे अनुबंध बना देता है।","“Ok done 👍” म्हणजे करार नव्हे. DraftIt त्याचा करार बनवतो.","“Ok done 👍” ఒప్పందం కాదు. DraftIt దాన్ని ఒప్పందంగా మారుస్తుంది.","“Ok done 👍” ஒப்பந்தம் அல்ல. DraftIt அதை ஒப்பந்தமாக்கும்.","“Ok done 👍” ಒಪ್ಪಂದವಲ್ಲ. DraftIt ಅದನ್ನು ಒಪ್ಪಂದವಾಗಿಸುತ್ತದೆ."],
quip2:["Your WhatsApp chats, now with a law degree.","आपकी WhatsApp चैट, अब क़ानून की डिग्री के साथ।","तुमचे WhatsApp चॅट, आता कायद्याच्या पदवीसह.","మీ WhatsApp చాట్‌లు, ఇప్పుడు న్యాయ పట్టాతో.","உங்கள் WhatsApp அரட்டைகள், இப்போது சட்டப் பட்டத்துடன்.","ನಿಮ್ಮ WhatsApp ಚಾಟ್‌ಗಳು, ಈಗ ಕಾನೂನು ಪದವಿಯೊಂದಿಗೆ."],
quip3:["“Bhai pe trust hai” is lovely. It just doesn’t work in court.","“भाई पे ट्रस्ट है” प्यारी बात है। बस अदालत में नहीं चलती।","“भाऊवर विश्वास आहे” छान आहे. फक्त न्यायालयात चालत नाही.","“అన్న మీద నమ్మకం ఉంది” మంచి మాటే. కానీ కోర్టులో చెల్లదు.","“அண்ணன் மேல நம்பிக்கை” அழகுதான். ஆனால் நீதிமன்றத்தில் செல்லாது.","“ಅಣ್ಣನ ಮೇಲೆ ನಂಬಿಕೆ ಇದೆ” ಚೆನ್ನಾಗಿದೆ. ಆದರೆ ನ್ಯಾಯಾಲಯದಲ್ಲಿ ನಡೆಯೋದಿಲ್ಲ."],
quip4:["We read the 300-message chat so you don’t have to.","300 मैसेज वाली चैट हम पढ़ लेते हैं, ताकि आपको न पढ़नी पड़े।","300 संदेशांचे चॅट आम्ही वाचतो, म्हणजे तुम्हाला वाचावे लागत नाही.","300 సందేశాల చాట్ మేం చదువుతాం, మీరు చదవక్కర్లేదు.","300 செய்தி அரட்டையை நாங்கள் படிக்கிறோம், நீங்கள் படிக்க வேண்டாம்.","300 ಸಂದೇಶಗಳ ಚಾಟ್ ಅನ್ನು ನಾವು ಓದುತ್ತೇವೆ, ನೀವು ಓದಬೇಕಿಲ್ಲ."],
quip5:["Less “but you said…”. More “it’s in writing”.","“पर आपने तो कहा था…” कम। “लिखित में है” ज़्यादा।","“पण तुम्ही तर म्हणाला होतात…” कमी. “लेखी आहे” जास्त.","“కానీ మీరు అన్నారు కదా…” తక్కువ. “రాతలో ఉంది” ఎక్కువ.","“நீங்க தானே சொன்னீங்க…” குறைவு. “எழுத்தில் இருக்கு” அதிகம்.","“ಆದರೆ ನೀವೇ ಹೇಳಿದ್ರಲ್ಲ…” ಕಡಿಮೆ. “ಲಿಖಿತದಲ್ಲಿದೆ” ಹೆಚ್ಚು."],
quip6:["Handshakes are nice. Handshakes with a SHA-256 fingerprint are nicer.","हाथ मिलाना अच्छा है। SHA-256 फिंगरप्रिंट के साथ हाथ मिलाना और भी अच्छा।","हस्तांदोलन छान आहे. SHA-256 फिंगरप्रिंटसह हस्तांदोलन आणखी छान.","కరచాలనం బాగుంటుంది. SHA-256 ఫింగర్‌ప్రింట్‌తో కరచాలనం ఇంకా బాగుంటుంది.","கை குலுக்குவது நல்லது. SHA-256 கைரேகையுடன் கை குலுக்குவது இன்னும் நல்லது.","ಕೈಕುಲುಕುವುದು ಚೆನ್ನ. SHA-256 ಫಿಂಗರ್‌ಪ್ರಿಂಟ್‌ನೊಂದಿಗೆ ಕೈಕುಲುಕುವುದು ಇನ್ನೂ ಚೆನ್ನ."],
apiKeyT:["Claude AI (optional)","Claude AI (वैकल्पिक)","Claude AI (ऐच्छिक)","Claude AI (ఐచ్ఛికం)","Claude AI (விருப்பம்)","Claude AI (ಐಚ್ಛಿಕ)"],
apiKeyB:["This copy runs outside Claude. Add your own Anthropic API key to turn on chat reading, translation, photo reading and comparisons. The key stays only in this browser.","यह कॉपी Claude के बाहर चल रही है। चैट पढ़ने, अनुवाद, फ़ोटो पढ़ने और तुलना के लिए अपनी Anthropic API कुंजी जोड़ें। कुंजी सिर्फ़ इसी ब्राउज़र में रहती है।","ही प्रत Claude बाहेर चालते. चॅट वाचणे, भाषांतर, फोटो वाचणे आणि तुलना सुरू करण्यासाठी तुमची Anthropic API की जोडा. की फक्त याच ब्राउझरमध्ये राहते.","ఈ కాపీ Claude బయట నడుస్తోంది. చాట్ చదవడం, అనువాదం, ఫోటో చదవడం, పోలిక కోసం మీ Anthropic API కీ జోడించండి. కీ ఈ బ్రౌజర్‌లోనే ఉంటుంది.","இந்த நகல் Claude க்கு வெளியே இயங்குகிறது. அரட்டை படித்தல், மொழிபெயர்ப்பு, புகைப்படம் படித்தல், ஒப்பீடு ஆகியவற்றுக்கு உங்கள் Anthropic API விசையைச் சேர்க்கவும். விசை இந்த உலாவியில் மட்டுமே இருக்கும்.","ಈ ನಕಲು Claude ಹೊರಗೆ ನಡೆಯುತ್ತಿದೆ. ಚಾಟ್ ಓದುವುದು, ಅನುವಾದ, ಫೋಟೋ ಓದುವುದು ಮತ್ತು ಹೋಲಿಕೆಗಾಗಿ ನಿಮ್ಮ Anthropic API ಕೀ ಸೇರಿಸಿ. ಕೀ ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮಾತ್ರ ಇರುತ್ತದೆ."],

apiSaved:["Key saved. AI features are on.","कुंजी सेव हुई। AI सुविधाएं चालू हैं।","की जतन झाली. AI सुविधा सुरू आहेत.","కీ సేవ్ అయింది. AI సదుపాయాలు ఆన్‌లో ఉన్నాయి.","விசை சேமிக்கப்பட்டது. AI வசதிகள் இயங்குகின்றன.","ಕೀ ಉಳಿಸಲಾಗಿದೆ. AI ಸೌಲಭ್ಯಗಳು ಆನ್ ಆಗಿವೆ."],

apiRemoved:["Key removed.","कुंजी हटा दी गई।","की काढली.","కీ తీసేశాం.","விசை நீக்கப்பட்டது.","ಕೀ ತೆಗೆಯಲಾಗಿದೆ."],
apiOff:["Without a key, DraftIt still works: it reads chats with simple rules on this device.","कुंजी के बिना भी DraftIt चलता है: यह इसी डिवाइस पर आसान नियमों से चैट पढ़ता है।","की नसतानाही DraftIt चालते: ते याच डिव्हाइसवर साध्या नियमांनी चॅट वाचते.","కీ లేకున్నా DraftIt పనిచేస్తుంది: ఈ పరికరంలోనే సాధారణ నియమాలతో చాట్ చదువుతుంది.","விசை இல்லாமலும் DraftIt இயங்கும்: இந்தச் சாதனத்திலேயே எளிய விதிகளால் அரட்டையைப் படிக்கும்.","ಕೀ ಇಲ್ಲದೆಯೂ DraftIt ಕೆಲಸ ಮಾಡುತ್ತದೆ: ಈ ಸಾಧನದಲ್ಲೇ ಸರಳ ನಿಯಮಗಳಿಂದ ಚಾಟ್ ಓದುತ್ತದೆ."],
apiBad:["That key did not work. Check it and try again.","यह कुंजी नहीं चली। जांचकर फिर कोशिश करें।","ही की चालली नाही. तपासून पुन्हा प्रयत्न करा.","ఆ కీ పనిచేయలేదు. సరిచూసి మళ్లీ ప్రయత్నించండి.","அந்த விசை வேலை செய்யவில்லை. சரிபார்த்து மீண்டும் முயலுங்கள்.","ಆ ಕೀ ಕೆಲಸ ಮಾಡಲಿಲ್ಲ. ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."],
invWebNote:["Live chat between two phones runs on the shared Claude version of DraftIt. In this copy the room works in demo mode: you can send as either side from one phone.","दो फ़ोन के बीच लाइव चैट DraftIt के साझा Claude संस्करण पर चलती है। इस कॉपी में रूम डेमो मोड में है: एक ही फ़ोन से दोनों तरफ़ से भेज सकते हैं।","दोन फोनमधील लाइव्ह चॅट DraftIt च्या शेअर केलेल्या Claude आवृत्तीवर चालते. या प्रतीत रूम डेमो मोडमध्ये आहे: एकाच फोनवरून दोन्ही बाजूंनी पाठवू शकता.","రెండు ఫోన్‌ల మధ్య లైవ్ చాట్ DraftIt షేర్ చేసిన Claude వెర్షన్‌లో నడుస్తుంది. ఈ కాపీలో రూమ్ డెమో మోడ్‌లో ఉంది: ఒకే ఫోన్ నుంచి రెండు వైపులా పంపవచ్చు.","இரண்டு போன்களுக்கு இடையிலான நேரலை அரட்டை DraftIt இன் பகிர்ந்த Claude பதிப்பில் இயங்கும். இந்த நகலில் அறை டெமோ முறையில் உள்ளது: ஒரே போனிலிருந்து இரு தரப்பாகவும் அனுப்பலாம்.","ಎರಡು ಫೋನ್‌ಗಳ ನಡುವಿನ ಲೈವ್ ಚಾಟ್ DraftIt ನ ಹಂಚಿದ Claude ಆವೃತ್ತಿಯಲ್ಲಿ ನಡೆಯುತ್ತದೆ. ಈ ನಕಲಿನಲ್ಲಿ ರೂಮ್ ಡೆಮೊ ಮೋಡ್‌ನಲ್ಲಿದೆ: ಒಂದೇ ಫೋನ್‌ನಿಂದ ಎರಡೂ ಕಡೆಯಿಂದ ಕಳುಹಿಸಬಹುದು."],
installT:["Install DraftIt","DraftIt इंस्टॉल करें","DraftIt इन्स्टॉल करा","DraftIt ఇన్‌స్టాల్ చేయండి","DraftIt ஐ நிறுவு","DraftIt ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ"],
installB:["Add it to your home screen and use it like an app, even offline.","इसे होम स्क्रीन पर जोड़ें और ऐप की तरह इस्तेमाल करें, बिना इंटरनेट के भी।","हे होम स्क्रीनवर जोडा आणि अ‍ॅपसारखे वापरा, इंटरनेटशिवायही.","దీన్ని హోమ్ స్క్రీన్‌కు జోడించి యాప్‌లా వాడండి, ఇంటర్నెట్ లేకున్నా.","இதை முகப்புத் திரையில் சேர்த்து செயலியாகப் பயன்படுத்துங்கள், இணையம் இல்லாமலும்.","ಇದನ್ನು ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಸೇರಿಸಿ ಆ್ಯಪ್‌ನಂತೆ ಬಳಸಿ, ಇಂಟರ್ನೆಟ್ ಇಲ್ಲದೆಯೂ."],

installIos:["On iPhone or iPad: tap Share, then “Add to Home Screen”.","iPhone या iPad पर: Share दबाएं, फिर “Add to Home Screen”।","iPhone किंवा iPad वर: Share दाबा, मग “Add to Home Screen”.","iPhone లేదా iPadలో: Share నొక్కి, “Add to Home Screen” ఎంచుకోండి.","iPhone அல்லது iPad இல்: Share அழுத்தி, “Add to Home Screen” தேர்ந்தெடுங்கள்.","iPhone ಅಥವಾ iPad ನಲ್ಲಿ: Share ಒತ್ತಿ, ನಂತರ “Add to Home Screen”."],
installOther:["In Chrome or Edge, open the browser menu and choose “Install app” or “Add to Home screen”.","Chrome या Edge में ब्राउज़र मेनू खोलकर “Install app” या “Add to Home screen” चुनें।","Chrome किंवा Edge मध्ये ब्राउझर मेनू उघडून “Install app” किंवा “Add to Home screen” निवडा.","Chrome లేదా Edgeలో బ్రౌజర్ మెనూ తెరిచి “Install app” లేదా “Add to Home screen” ఎంచుకోండి.","Chrome அல்லது Edge இல் உலாவி மெனுவைத் திறந்து “Install app” அல்லது “Add to Home screen” தேர்ந்தெடுங்கள்.","Chrome ಅಥವಾ Edge ನಲ್ಲಿ ಬ್ರೌಸರ್ ಮೆನು ತೆರೆದು “Install app” ಅಥವಾ “Add to Home screen” ಆಯ್ಕೆಮಾಡಿ."],
installed:["Installed. Find DraftIt on your home screen.","इंस्टॉल हो गया। DraftIt होम स्क्रीन पर मिलेगा।","इन्स्टॉल झाले. DraftIt होम स्क्रीनवर मिळेल.","ఇన్‌స్టాల్ అయింది. DraftIt హోమ్ స్క్రీన్‌లో ఉంది.","நிறுவப்பட்டது. DraftIt முகப்புத் திரையில் உள்ளது.","ಇನ್‌ಸ್ಟಾಲ್ ಆಗಿದೆ. DraftIt ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿದೆ."],

otpEmailHint:["Check your inbox and spam folder. The code works once and expires in an hour.","इनबॉक्स और स्पैम फ़ोल्डर देखें। कोड एक बार चलता है और एक घंटे में ख़त्म हो जाता है।","इनबॉक्स आणि स्पॅम फोल्डर पाहा. कोड एकदाच चालतो आणि एका तासात संपतो.","ఇన్‌బాక్స్, స్పామ్ ఫోల్డర్ చూడండి. కోడ్ ఒక్కసారే పనిచేస్తుంది, గంటలో గడువు ముగుస్తుంది.","இன்பாக்ஸ் மற்றும் ஸ்பாம் கோப்புறையைப் பாருங்கள். குறியீடு ஒருமுறை மட்டுமே செல்லும், ஒரு மணி நேரத்தில் காலாவதியாகும்.","ಇನ್‌ಬಾಕ್ಸ್ ಮತ್ತು ಸ್ಪ್ಯಾಮ್ ಫೋಲ್ಡರ್ ನೋಡಿ. ಕೋಡ್ ಒಮ್ಮೆ ಮಾತ್ರ ಕೆಲಸ ಮಾಡುತ್ತದೆ, ಒಂದು ಗಂಟೆಯಲ್ಲಿ ಅವಧಿ ಮುಗಿಯುತ್ತದೆ."],

needEmail:["Please enter a valid email address.","कृपया सही ईमेल पता डालें।","कृपया योग्य ईमेल पत्ता टाका.","దయచేసి సరైన ఈమెయిల్ చిరునామా ఇవ్వండి.","சரியான மின்னஞ்சல் முகவரியை உள்ளிடவும்.","ದಯವಿಟ್ಟು ಸರಿಯಾದ ಇಮೇಲ್ ವಿಳಾಸ ನಮೂದಿಸಿ."],
codeBad:["That code did not work. Check it, or send a new one.","यह कोड नहीं चला। जांचें, या नया कोड भेजें।","हा कोड चालला नाही. तपासा, किंवा नवा कोड पाठवा.","ఆ కోడ్ పనిచేయలేదు. సరిచూడండి, లేదా కొత్తది పంపండి.","அந்தக் குறியீடு வேலை செய்யவில்லை. சரிபாருங்கள், அல்லது புதியதை அனுப்புங்கள்.","ಆ ಕೋಡ್ ಕೆಲಸ ಮಾಡಲಿಲ್ಲ. ಪರಿಶೀಲಿಸಿ, ಅಥವಾ ಹೊಸದನ್ನು ಕಳುಹಿಸಿ."],
codeSendFail:["Could not send the code. Wait a minute and try again.","कोड नहीं भेजा जा सका। एक मिनट रुककर फिर कोशिश करें।","कोड पाठवता आला नाही. एक मिनिट थांबून पुन्हा प्रयत्न करा.","కోడ్ పంపలేకపోయాం. ఒక నిమిషం ఆగి మళ్లీ ప్రయత్నించండి.","குறியீட்டை அனுப்ப முடியவில்லை. ஒரு நிமிடம் கழித்து மீண்டும் முயலுங்கள்.","ಕೋಡ್ ಕಳುಹಿಸಲಾಗಲಿಲ್ಲ. ಒಂದು ನಿಮಿಷ ಕಾದು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."],
noAccountEmail:["No account with this email yet. Please sign up.","इस ईमेल से अभी कोई खाता नहीं। कृपया साइन अप करें।","या ईमेलवर अजून खाते नाही. कृपया नोंदणी करा.","ఈ ఈమెయిల్‌తో ఇంకా ఖాతా లేదు. దయచేసి సైన్ అప్ చేయండి.","இந்த மின்னஞ்சலில் இன்னும் கணக்கு இல்லை. பதிவு செய்யவும்.","ಈ ಇಮೇಲ್‌ಗೆ ಇನ್ನೂ ಖಾತೆ ಇಲ್ಲ. ದಯವಿಟ್ಟು ಸೈನ್ ಅಪ್ ಮಾಡಿ."],
cloudLoadFail:["Could not open your account. Check your internet and try again.","आपका खाता नहीं खुल सका। इंटरनेट जांचकर फिर कोशिश करें।","तुमचे खाते उघडता आले नाही. इंटरनेट तपासून पुन्हा प्रयत्न करा.","మీ ఖాతా తెరవలేకపోయాం. ఇంటర్నెట్ చూసి మళ్లీ ప్రయత్నించండి.","உங்கள் கணக்கைத் திறக்க முடியவில்லை. இணையத்தைச் சரிபார்த்து மீண்டும் முயலுங்கள்.","ನಿಮ್ಮ ಖಾತೆ ತೆರೆಯಲಾಗಲಿಲ್ಲ. ಇಂಟರ್ನೆಟ್ ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."],

cloudNotSet:["Online storage is not connected yet, so data stays in this browser. Add the Supabase keys in config.js to turn it on.","ऑनलाइन स्टोरेज अभी जुड़ा नहीं है, इसलिए डेटा इसी ब्राउज़र में है। इसे चालू करने के लिए config.js में Supabase कुंजियां जोड़ें।","ऑनलाइन स्टोरेज अजून जोडलेले नाही, म्हणून डेटा याच ब्राउझरमध्ये आहे. सुरू करण्यासाठी config.js मध्ये Supabase की जोडा.","ఆన్‌లైన్ స్టోరేజ్ ఇంకా కనెక్ట్ కాలేదు, కాబట్టి డేటా ఈ బ్రౌజర్‌లోనే ఉంది. ఆన్ చేయడానికి config.jsలో Supabase కీలు జోడించండి.","ஆன்லைன் சேமிப்பு இன்னும் இணைக்கப்படவில்லை, எனவே தரவு இந்த உலாவியில் மட்டும் உள்ளது. இயக்க config.js இல் Supabase விசைகளைச் சேர்க்கவும்.","ಆನ್‌ಲೈನ್ ಸಂಗ್ರಹ ಇನ್ನೂ ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ, ಹಾಗಾಗಿ ಡೇಟಾ ಈ ಬ್ರೌಸರ್‌ನಲ್ಲೇ ಇದೆ. ಆನ್ ಮಾಡಲು config.js ನಲ್ಲಿ Supabase ಕೀಗಳನ್ನು ಸೇರಿಸಿ."],
dataB2cloud:["Online, in your DraftIt account, encrypted in transit and at rest. Log in on any phone or computer and your deals are there.","ऑनलाइन, आपके DraftIt खाते में, भेजते और रखते समय एन्क्रिप्टेड। किसी भी फ़ोन या कंप्यूटर पर लॉग इन करें, आपके सौदे वहीं मिलेंगे।","ऑनलाइन, तुमच्या DraftIt खात्यात, पाठवताना आणि साठवताना एन्क्रिप्ट केलेले. कोणत्याही फोन किंवा संगणकावर लॉग इन करा, तुमचे व्यवहार तिथे असतील.","ఆన్‌లైన్‌లో, మీ DraftIt ఖాతాలో, పంపేటప్పుడు, నిల్వలో ఎన్‌క్రిప్ట్ చేసి. ఏ ఫోన్ లేదా కంప్యూటర్‌లో లాగిన్ అయినా మీ డీల్స్ అక్కడే ఉంటాయి.","ஆன்லைனில், உங்கள் DraftIt கணக்கில், அனுப்பும்போதும் சேமிப்பிலும் குறியாக்கம் செய்யப்பட்டு. எந்த போன் அல்லது கணினியில் உள்நுழைந்தாலும் உங்கள் ஒப்பந்தங்கள் அங்கே இருக்கும்.","ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ, ನಿಮ್ಮ DraftIt ಖಾತೆಯಲ್ಲಿ, ಕಳುಹಿಸುವಾಗ ಮತ್ತು ಸಂಗ್ರಹದಲ್ಲಿ ಎನ್‌ಕ್ರಿಪ್ಟ್ ಮಾಡಲಾಗಿದೆ. ಯಾವುದೇ ಫೋನ್ ಅಥವಾ ಕಂಪ್ಯೂಟರ್‌ನಲ್ಲಿ ಲಾಗಿನ್ ಆದರೂ ನಿಮ್ಮ ವ್ಯವಹಾರಗಳು ಅಲ್ಲೇ ಇರುತ್ತವೆ."],

roomLocal:["Not live yet. Your messages are saved in this deal.","अभी लाइव नहीं है। आपके मैसेज इस डील में सेव हैं।","अजून लाइव्ह नाही. तुमचे संदेश या व्यवहारात सेव्ह आहेत.","ఇంకా లైవ్ కాలేదు. మీ మెసేజ్‌లు ఈ డీల్‌లో సేవ్ అయ్యాయి.","இன்னும் நேரலையில் இல்லை. உங்கள் செய்திகள் இந்த ஒப்பந்தத்தில் சேமிக்கப்பட்டுள்ளன.","ಇನ್ನೂ ಲೈವ್ ಆಗಿಲ್ಲ. ನಿಮ್ಮ ಸಂದೇಶಗಳು ಈ ಡೀಲ್‌ನಲ್ಲಿ ಉಳಿದಿವೆ."],

logoutQ:["Are you sure you want to log out?","क्या आप सच में लॉग आउट करना चाहते हैं?","तुम्हाला नक्की लॉग आउट करायचे आहे का?","మీరు నిజంగా లాగ్ అవుట్ అవ్వాలనుకుంటున్నారా?","நீங்கள் உறுதியாக வெளியேற விரும்புகிறீர்களா?","ನೀವು ಖಚಿತವಾಗಿ ಲಾಗ್ ಔಟ್ ಆಗಲು ಬಯಸುವಿರಾ?"],
logoutSubCloud:["Your deals stay saved online. Log in again with your email to see them.","आपकी डील ऑनलाइन सेव रहेंगी। उन्हें देखने के लिए अपने ईमेल से फिर लॉग इन करें।","तुमचे व्यवहार ऑनलाइन सेव्ह राहतील. ते पाहण्यासाठी ईमेलने पुन्हा लॉग इन करा.","మీ డీల్స్ ఆన్‌లైన్‌లో సేవ్ అయి ఉంటాయి. వాటిని చూడటానికి మీ ఈమెయిల్‌తో మళ్లీ లాగిన్ అవ్వండి.","உங்கள் ஒப்பந்தங்கள் ஆன்லைனில் சேமிக்கப்பட்டிருக்கும். அவற்றைப் பார்க்க உங்கள் மின்னஞ்சலுடன் மீண்டும் உள்நுழையுங்கள்.","ನಿಮ್ಮ ಡೀಲ್‌ಗಳು ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಉಳಿಯುತ್ತವೆ. ಅವುಗಳನ್ನು ನೋಡಲು ನಿಮ್ಮ ಇಮೇಲ್‌ನಿಂದ ಮತ್ತೆ ಲಾಗಿನ್ ಆಗಿ."],
logoutSubLocal:["Your deals stay on this device. Log in again with your mobile number to see them.","आपकी डील इसी डिवाइस पर रहेंगी। उन्हें देखने के लिए अपने मोबाइल नंबर से फिर लॉग इन करें।","तुमचे व्यवहार याच डिव्हाइसवर राहतील. ते पाहण्यासाठी मोबाइल नंबरने पुन्हा लॉग इन करा.","మీ డీల్స్ ఈ పరికరంలోనే ఉంటాయి. వాటిని చూడటానికి మీ మొబైల్ నంబర్‌తో మళ్లీ లాగిన్ అవ్వండి.","உங்கள் ஒப்பந்தங்கள் இந்தச் சாதனத்திலேயே இருக்கும். அவற்றைப் பார்க்க உங்கள் மொபைல் எண்ணுடன் மீண்டும் உள்நுழையுங்கள்.","ನಿಮ್ಮ ಡೀಲ್‌ಗಳು ಈ ಸಾಧನದಲ್ಲೇ ಇರುತ್ತವೆ. ಅವುಗಳನ್ನು ನೋಡಲು ನಿಮ್ಮ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯಿಂದ ಮತ್ತೆ ಲಾಗಿನ್ ಆಗಿ."],

authP2:["See what is agreed and what is missing, checked against Indian law","देखें क्या तय हुआ और क्या बाकी है, भारतीय कानून के हिसाब से जांचा हुआ","काय ठरले आणि काय राहिले ते पाहा, भारतीय कायद्यानुसार तपासलेले","ఏది ఒప్పుకున్నారో, ఏది మిగిలిందో చూడండి, భారతీయ చట్టం ప్రకారం తనిఖీ చేసినది","எது ஒப்புக்கொள்ளப்பட்டது, எது விடுபட்டது என்பதை இந்தியச் சட்டப்படி சரிபார்த்துப் பாருங்கள்","ಏನು ಒಪ್ಪಿದೆ, ಏನು ಬಾಕಿ ಇದೆ ಎಂದು ಭಾರತೀಯ ಕಾನೂನಿನ ಪ್ರಕಾರ ಪರಿಶೀಲಿಸಿ ನೋಡಿ"],
authP3:["Both sides sign one clear agreement that cannot be secretly changed","दोनों पक्ष एक साफ़ समझौते पर साइन करते हैं जिसे चुपके से बदला नहीं जा सकता","दोन्ही बाजू एका स्पष्ट करारावर सही करतात, जो गुपचूप बदलता येत नाही","ఇరువైపులా ఒకే స్పష్టమైన ఒప్పందంపై సంతకం చేస్తారు, దాన్ని రహస్యంగా మార్చలేరు","இரு தரப்பும் ஒரே தெளிவான ஒப்பந்தத்தில் கையொப்பமிடுகின்றனர், அதை ரகசியமாக மாற்ற முடியாது","ಎರಡೂ ಕಡೆಯವರು ಒಂದೇ ಸ್ಪಷ್ಟ ಒಪ್ಪಂದಕ್ಕೆ ಸಹಿ ಹಾಕುತ್ತಾರೆ, ಅದನ್ನು ಗುಟ್ಟಾಗಿ ಬದಲಿಸಲು ಆಗದು"],

evi_gst:["Monthly GST filers send their sales details (GSTR-1) by the 11th and file GSTR-3B and pay the tax by the 20th of the next month. If you file quarterly under the QRMP scheme, your dates are different. Late filing attracts a late fee and interest.","मासिक GST भरने वाले अगले महीने की 11 तारीख तक बिक्री का ब्योरा (GSTR-1) और 20 तारीख तक GSTR-3B भरकर टैक्स जमा करते हैं। अगर आप QRMP स्कीम में तिमाही भरते हैं तो आपकी तारीखें अलग हैं। देर से भरने पर लेट फ़ीस और ब्याज लगता है।","मासिक GST भरणारे पुढच्या महिन्याच्या 11 तारखेपर्यंत विक्रीचा तपशील (GSTR-1) आणि 20 तारखेपर्यंत GSTR-3B भरून कर जमा करतात. QRMP योजनेत तिमाही भरत असाल तर तुमच्या तारखा वेगळ्या आहेत. उशिरा भरल्यास विलंब शुल्क आणि व्याज लागते.","నెలవారీ GST దాఖలు చేసేవారు తర్వాతి నెల 11వ తేదీలోపు అమ్మకాల వివరాలు (GSTR-1), 20వ తేదీలోపు GSTR-3B దాఖలు చేసి పన్ను చెల్లిస్తారు. QRMP పథకంలో త్రైమాసికంగా దాఖలు చేస్తే మీ తేదీలు వేరు. ఆలస్యమైతే లేట్ ఫీజు, వడ్డీ పడతాయి.","மாதாந்திர GST தாக்கல் செய்பவர்கள் அடுத்த மாதம் 11ஆம் தேதிக்குள் விற்பனை விவரங்களையும் (GSTR-1), 20ஆம் தேதிக்குள் GSTR-3B-யையும் தாக்கல் செய்து வரி செலுத்துவார்கள். QRMP திட்டத்தில் காலாண்டுக்கு ஒருமுறை தாக்கல் செய்தால் உங்கள் தேதிகள் வேறு. தாமதமானால் தாமதக் கட்டணமும் வட்டியும் உண்டு.","ಮಾಸಿಕ GST ಸಲ್ಲಿಸುವವರು ಮುಂದಿನ ತಿಂಗಳ 11ರೊಳಗೆ ಮಾರಾಟದ ವಿವರ (GSTR-1) ಮತ್ತು 20ರೊಳಗೆ GSTR-3B ಸಲ್ಲಿಸಿ ತೆರಿಗೆ ಪಾವತಿಸುತ್ತಾರೆ. QRMP ಯೋಜನೆಯಲ್ಲಿ ತ್ರೈಮಾಸಿಕವಾಗಿ ಸಲ್ಲಿಸಿದರೆ ನಿಮ್ಮ ದಿನಾಂಕಗಳು ಬೇರೆ. ತಡವಾದರೆ ವಿಳಂಬ ಶುಲ್ಕ ಮತ್ತು ಬಡ್ಡಿ ಬೀಳುತ್ತದೆ."],
ev_tds1:["TDS return for April to June due","अप्रैल से जून का TDS रिटर्न भरने की आखिरी तारीख","एप्रिल ते जूनचा TDS रिटर्न भरण्याची शेवटची तारीख","ఏప్రిల్ నుంచి జూన్ TDS రిటర్న్ గడువు","ஏப்ரல் முதல் ஜூன் வரையிலான TDS ரிட்டர்ன் கடைசி நாள்","ಏಪ್ರಿಲ್‌ನಿಂದ ಜೂನ್ TDS ರಿಟರ್ನ್ ಕೊನೆಯ ದಿನ"],
ev_tds2:["TDS return for July to September due","जुलाई से सितंबर का TDS रिटर्न भरने की आखिरी तारीख","जुलै ते सप्टेंबरचा TDS रिटर्न भरण्याची शेवटची तारीख","జూలై నుంచి సెప్టెంబర్ TDS రిటర్న్ గడువు","ஜூலை முதல் செப்டம்பர் வரையிலான TDS ரிட்டர்ன் கடைசி நாள்","ಜುಲೈನಿಂದ ಸೆಪ್ಟೆಂಬರ್ TDS ರಿಟರ್ನ್ ಕೊನೆಯ ದಿನ"],
ev_tds3:["TDS return for October to December due","अक्टूबर से दिसंबर का TDS रिटर्न भरने की आखिरी तारीख","ऑक्टोबर ते डिसेंबरचा TDS रिटर्न भरण्याची शेवटची तारीख","అక్టోబర్ నుంచి డిసెంబర్ TDS రిటర్న్ గడువు","அக்டோபர் முதல் டிசம்பர் வரையிலான TDS ரிட்டர்ன் கடைசி நாள்","ಅಕ್ಟೋಬರ್‌ನಿಂದ ಡಿಸೆಂಬರ್ TDS ರಿಟರ್ನ್ ಕೊನೆಯ ದಿನ"],
ev_tds4:["TDS return for January to March due","जनवरी से मार्च का TDS रिटर्न भरने की आखिरी तारीख","जानेवारी ते मार्चचा TDS रिटर्न भरण्याची शेवटची तारीख","జనవరి నుంచి మార్చి TDS రిటర్న్ గడువు","ஜனவரி முதல் மார்ச் வரையிலான TDS ரிட்டர்ன் கடைசி நாள்","ಜನವರಿಯಿಂದ ಮಾರ್ಚ್ TDS ರಿಟರ್ನ್ ಕೊನೆಯ ದಿನ"],
evi_tds:["If you deduct TDS (for example on rent, contractor or professional payments), the quarterly TDS return is due on 31 July, 31 October, 31 January and 31 May. Check with your accountant whether this applies to you.","अगर आप TDS काटते हैं (जैसे किराया, ठेकेदार या प्रोफ़ेशनल भुगतान पर), तो तिमाही TDS रिटर्न 31 जुलाई, 31 अक्टूबर, 31 जनवरी और 31 मई तक भरना होता है। यह आप पर लागू है या नहीं, अपने अकाउंटेंट से पूछें।","तुम्ही TDS कापत असाल (उदा. भाडे, कंत्राटदार किंवा व्यावसायिक देयके), तर तिमाही TDS रिटर्न 31 जुलै, 31 ऑक्टोबर, 31 जानेवारी आणि 31 मेपर्यंत भरायचा असतो. हे तुम्हाला लागू आहे का ते तुमच्या अकाउंटंटला विचारा.","మీరు TDS కోస్తే (ఉదా. అద్దె, కాంట్రాక్టర్ లేదా వృత్తిపరమైన చెల్లింపులపై), త్రైమాసిక TDS రిటర్న్ జూలై 31, అక్టోబర్ 31, జనవరి 31, మే 31 లోపు దాఖలు చేయాలి. ఇది మీకు వర్తిస్తుందో లేదో మీ అకౌంటెంట్‌ను అడగండి.","நீங்கள் TDS பிடித்தம் செய்தால் (எ.கா. வாடகை, ஒப்பந்ததாரர் அல்லது தொழில்முறைக் கட்டணங்கள்), காலாண்டு TDS ரிட்டர்ன் ஜூலை 31, அக்டோபர் 31, ஜனவரி 31, மே 31க்குள் தாக்கல் செய்ய வேண்டும். இது உங்களுக்குப் பொருந்துமா என உங்கள் கணக்காளரிடம் கேளுங்கள்.","ನೀವು TDS ಕಡಿತ ಮಾಡಿದರೆ (ಉದಾ. ಬಾಡಿಗೆ, ಗುತ್ತಿಗೆದಾರ ಅಥವಾ ವೃತ್ತಿಪರ ಪಾವತಿಗಳ ಮೇಲೆ), ತ್ರೈಮಾಸಿಕ TDS ರಿಟರ್ನ್ ಜುಲೈ 31, ಅಕ್ಟೋಬರ್ 31, ಜನವರಿ 31 ಮತ್ತು ಮೇ 31ರೊಳಗೆ ಸಲ್ಲಿಸಬೇಕು. ಇದು ನಿಮಗೆ ಅನ್ವಯಿಸುತ್ತದೆಯೇ ಎಂದು ನಿಮ್ಮ ಲೆಕ್ಕಿಗರನ್ನು ಕೇಳಿ."],
ev_adv1:["Advance tax: first instalment (15%)","एडवांस टैक्स: पहली किस्त (15%)","आगाऊ कर: पहिला हप्ता (15%)","అడ్వాన్స్ ట్యాక్స్: మొదటి వాయిదా (15%)","முன்கூட்டிய வரி: முதல் தவணை (15%)","ಮುಂಗಡ ತೆರಿಗೆ: ಮೊದಲ ಕಂತು (15%)"],
ev_adv2:["Advance tax: second instalment (45%)","एडवांस टैक्स: दूसरी किस्त (45%)","आगाऊ कर: दुसरा हप्ता (45%)","అడ్వాన్స్ ట్యాక్స్: రెండో వాయిదా (45%)","முன்கூட்டிய வரி: இரண்டாம் தவணை (45%)","ಮುಂಗಡ ತೆರಿಗೆ: ಎರಡನೇ ಕಂತು (45%)"],
ev_adv3:["Advance tax: third instalment (75%)","एडवांस टैक्स: तीसरी किस्त (75%)","आगाऊ कर: तिसरा हप्ता (75%)","అడ్వాన్స్ ట్యాక్స్: మూడో వాయిదా (75%)","முன்கூட்டிய வரி: மூன்றாம் தவணை (75%)","ಮುಂಗಡ ತೆರಿಗೆ: ಮೂರನೇ ಕಂತು (75%)"],
ev_adv4:["Advance tax: last instalment (100%)","एडवांस टैक्स: आखिरी किस्त (100%)","आगाऊ कर: शेवटचा हप्ता (100%)","అడ్వాన్స్ ట్యాక్స్: చివరి వాయిదా (100%)","முன்கூட்டிய வரி: கடைசித் தவணை (100%)","ಮುಂಗಡ ತೆರಿಗೆ: ಕೊನೆಯ ಕಂತು (100%)"],
evi_adv:["If your income tax for the year will be ₹10,000 or more, you pay it in advance in four parts: 15% by 15 June, 45% by 15 September, 75% by 15 December and all of it by 15 March. Paying late adds interest.","अगर साल का आपका इनकम टैक्स ₹10,000 या ज़्यादा होगा, तो उसे चार हिस्सों में पहले भरना होता है: 15 जून तक 15%, 15 सितंबर तक 45%, 15 दिसंबर तक 75% और 15 मार्च तक पूरा। देर करने पर ब्याज लगता है।","वर्षाचा तुमचा आयकर ₹10,000 किंवा अधिक असेल, तर तो चार भागांत आधी भरायचा असतो: 15 जूनपर्यंत 15%, 15 सप्टेंबरपर्यंत 45%, 15 डिसेंबरपर्यंत 75% आणि 15 मार्चपर्यंत पूर्ण. उशीर केल्यास व्याज लागते.","సంవత్సరానికి మీ ఆదాయపు పన్ను ₹10,000 లేదా అంతకంటే ఎక్కువైతే, దాన్ని నాలుగు భాగాలుగా ముందే కట్టాలి: జూన్ 15 లోపు 15%, సెప్టెంబర్ 15 లోపు 45%, డిసెంబర్ 15 లోపు 75%, మార్చి 15 లోపు మొత్తం. ఆలస్యమైతే వడ్డీ పడుతుంది.","ஆண்டுக்கான உங்கள் வருமான வரி ₹10,000 அல்லது அதற்கு மேல் இருந்தால், அதை நான்கு பகுதிகளாக முன்கூட்டியே செலுத்த வேண்டும்: ஜூன் 15க்குள் 15%, செப்டம்பர் 15க்குள் 45%, டிசம்பர் 15க்குள் 75%, மார்ச் 15க்குள் முழுவதும். தாமதமானால் வட்டி சேரும்.","ವರ್ಷದ ನಿಮ್ಮ ಆದಾಯ ತೆರಿಗೆ ₹10,000 ಅಥವಾ ಹೆಚ್ಚಿದ್ದರೆ, ಅದನ್ನು ನಾಲ್ಕು ಭಾಗಗಳಲ್ಲಿ ಮುಂಚಿತವಾಗಿ ಕಟ್ಟಬೇಕು: ಜೂನ್ 15ರೊಳಗೆ 15%, ಸೆಪ್ಟೆಂಬರ್ 15ರೊಳಗೆ 45%, ಡಿಸೆಂಬರ್ 15ರೊಳಗೆ 75% ಮತ್ತು ಮಾರ್ಚ್ 15ರೊಳಗೆ ಪೂರ್ತಿ. ತಡವಾದರೆ ಬಡ್ಡಿ ಸೇರುತ್ತದೆ."],
hol_republic:["Republic Day","गणतंत्र दिवस","प्रजासत्ताक दिन","గణతంత్ర దినోత్సవం","குடியரசு தினம்","ಗಣರಾಜ್ಯೋತ್ಸವ"],
hol_indep:["Independence Day","स्वतंत्रता दिवस","स्वातंत्र्य दिन","స్వాతంత్ర్య దినోత్సవం","சுதந்திர தினம்","ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ"],
hol_gandhi:["Gandhi Jayanti","गांधी जयंती","गांधी जयंती","గాంధీ జయంతి","காந்தி ஜெயந்தி","ಗಾಂಧಿ ಜಯಂತಿ"],
hol_xmas:["Christmas","क्रिसमस","नाताळ","క్రిస్మస్","கிறிஸ்துமஸ்","ಕ್ರಿಸ್‌ಮಸ್"],
hol_diwali:["Diwali (Lakshmi Puja)","दिवाली (लक्ष्मी पूजा)","दिवाळी (लक्ष्मीपूजन)","దీపావళి (లక్ష్మీ పూజ)","தீபாவளி (லட்சுமி பூஜை)","ದೀಪಾವಳಿ (ಲಕ್ಷ್ಮೀ ಪೂಜೆ)"],
evi_hol:["A national holiday. Banks and most offices are closed, so plan deliveries and payments around it.","राष्ट्रीय छुट्टी। बैंक और ज़्यादातर दफ़्तर बंद रहते हैं, इसलिए डिलीवरी और भुगतान इसके हिसाब से रखें।","राष्ट्रीय सुट्टी. बँका आणि बहुतेक कार्यालये बंद असतात, म्हणून डिलिव्हरी आणि पेमेंट त्यानुसार ठरवा.","జాతీయ సెలవు. బ్యాంకులు, చాలా కార్యాలయాలు మూసి ఉంటాయి, కాబట్టి డెలివరీలు, చెల్లింపులు దానికి తగ్గట్టు ప్లాన్ చేయండి.","தேசிய விடுமுறை. வங்கிகளும் பெரும்பாலான அலுவலகங்களும் மூடியிருக்கும், எனவே டெலிவரி மற்றும் கட்டணங்களை அதற்கேற்பத் திட்டமிடுங்கள்.","ರಾಷ್ಟ್ರೀಯ ರಜೆ. ಬ್ಯಾಂಕುಗಳು ಮತ್ತು ಹೆಚ್ಚಿನ ಕಚೇರಿಗಳು ಮುಚ್ಚಿರುತ್ತವೆ, ಹಾಗಾಗಿ ಡೆಲಿವರಿ ಮತ್ತು ಪಾವತಿಗಳನ್ನು ಅದಕ್ಕೆ ತಕ್ಕಂತೆ ಯೋಜಿಸಿ."],
evi_diwali:["Diwali week is the busiest time for sweets, gifts and packaging. Many suppliers and transporters close for a few days, so get deliveries and payments done before it.","दिवाली का हफ़्ता मिठाई, तोहफ़े और पैकेजिंग का सबसे व्यस्त समय है। कई सप्लायर और ट्रांसपोर्टर कुछ दिन बंद रहते हैं, इसलिए डिलीवरी और भुगतान पहले निपटा लें।","दिवाळीचा आठवडा मिठाई, भेटवस्तू आणि पॅकेजिंगसाठी सर्वात गर्दीचा काळ असतो. अनेक पुरवठादार आणि वाहतूकदार काही दिवस बंद असतात, म्हणून डिलिव्हरी आणि पेमेंट आधीच उरका.","దీపావళి వారం స్వీట్లు, బహుమతులు, ప్యాకేజింగ్‌కు అత్యంత రద్దీ సమయం. చాలా మంది సరఫరాదారులు, రవాణాదారులు కొన్ని రోజులు మూసి ఉంటారు, కాబట్టి డెలివరీలు, చెల్లింపులు ముందే పూర్తి చేయండి.","தீபாவளி வாரம் இனிப்பு, பரிசு, பேக்கேஜிங்கிற்கு மிகவும் பரபரப்பான நேரம். பல சப்ளையர்களும் போக்குவரத்து நிறுவனங்களும் சில நாட்கள் மூடியிருக்கும், எனவே டெலிவரியையும் கட்டணங்களையும் அதற்கு முன் முடித்துவிடுங்கள்.","ದೀಪಾವಳಿ ವಾರ ಸಿಹಿ, ಉಡುಗೊರೆ ಮತ್ತು ಪ್ಯಾಕೇಜಿಂಗ್‌ಗೆ ಅತ್ಯಂತ ಜನದಟ್ಟಣೆಯ ಸಮಯ. ಅನೇಕ ಪೂರೈಕೆದಾರರು ಮತ್ತು ಸಾಗಣೆದಾರರು ಕೆಲವು ದಿನ ಮುಚ್ಚಿರುತ್ತಾರೆ, ಹಾಗಾಗಿ ಡೆಲಿವರಿ ಮತ್ತು ಪಾವತಿಗಳನ್ನು ಮೊದಲೇ ಮುಗಿಸಿ."],
evi_check:["General dates for India. Due dates can be extended by the government, so confirm on the GST or income tax portal or with your accountant.","भारत की सामान्य तारीखें। सरकार आखिरी तारीख बढ़ा सकती है, इसलिए GST या इनकम टैक्स पोर्टल पर या अपने अकाउंटेंट से पक्का कर लें।","भारतासाठी सर्वसाधारण तारखा. सरकार शेवटची तारीख वाढवू शकते, म्हणून GST किंवा आयकर पोर्टलवर किंवा अकाउंटंटकडून खात्री करा.","భారతదేశపు సాధారణ తేదీలు. ప్రభుత్వం గడువును పొడిగించవచ్చు, కాబట్టి GST లేదా ఆదాయపు పన్ను పోర్టల్‌లో లేదా మీ అకౌంటెంట్‌తో నిర్ధారించుకోండి.","இந்தியாவுக்கான பொதுவான தேதிகள். அரசு கடைசி தேதியை நீட்டிக்கலாம், எனவே GST அல்லது வருமான வரி இணையதளத்தில் அல்லது உங்கள் கணக்காளரிடம் உறுதிசெய்யுங்கள்.","ಭಾರತದ ಸಾಮಾನ್ಯ ದಿನಾಂಕಗಳು. ಸರ್ಕಾರ ಕೊನೆಯ ದಿನಾಂಕವನ್ನು ವಿಸ್ತರಿಸಬಹುದು, ಹಾಗಾಗಿ GST ಅಥವಾ ಆದಾಯ ತೆರಿಗೆ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಅಥವಾ ನಿಮ್ಮ ಲೆಕ್ಕಿಗರಿಂದ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ."],

snipTool:["Snip","स्निप","स्निप","స్నిప్","ஸ்னிப்","ಸ್ನಿಪ್"],
snipShort:["Snip","स्निप","स्निप","స్నిప్","ஸ்னிப்","ಸ್ನಿಪ್"],
snipSub:["A button that stays on your screen. Snip a WhatsApp chat or anything else and it uploads to your deal straight away.","एक बटन जो आपकी स्क्रीन पर बना रहता है। व्हाट्सऐप चैट या कुछ भी स्निप करें, वह सीधे आपकी डील में अपलोड हो जाता है।","स्क्रीनवर कायम राहणारे बटण. व्हॉट्सॲप चॅट किंवा काहीही स्निप करा, ते थेट तुमच्या व्यवहारात अपलोड होते.","మీ స్క్రీన్‌పై ఎప్పుడూ ఉండే బటన్. వాట్సాప్ చాట్ లేదా ఏదైనా స్నిప్ చేయండి, అది వెంటనే మీ డీల్‌కు అప్‌లోడ్ అవుతుంది.","உங்கள் திரையில் எப்போதும் இருக்கும் பொத்தான். வாட்ஸ்அப் அரட்டையையோ வேறு எதையோ ஸ்னிப் செய்தால், அது உடனே உங்கள் ஒப்பந்தத்தில் பதிவேறும்.","ನಿಮ್ಮ ಪರದೆಯ ಮೇಲೆ ಯಾವಾಗಲೂ ಇರುವ ಬಟನ್. ವಾಟ್ಸಾಪ್ ಚಾಟ್ ಅಥವಾ ಏನನ್ನಾದರೂ ಸ್ನಿಪ್ ಮಾಡಿ, ಅದು ತಕ್ಷಣ ನಿಮ್ಮ ಡೀಲ್‌ಗೆ ಅಪ್‌ಲೋಡ್ ಆಗುತ್ತದೆ."],

snipOnSub:["Tap the Snip button on any screen to upload a chat or screenshot.","चैट या स्क्रीनशॉट अपलोड करने के लिए किसी भी स्क्रीन पर स्निप बटन दबाएं।","चॅट किंवा स्क्रीनशॉट अपलोड करण्यासाठी कोणत्याही स्क्रीनवर स्निप बटण दाबा.","చాట్ లేదా స్క్రీన్‌షాట్ అప్‌లోడ్ చేయడానికి ఏ స్క్రీన్‌లోనైనా స్నిప్ బటన్ నొక్కండి.","அரட்டை அல்லது திரைப்பிடிப்பைப் பதிவேற்ற எந்தத் திரையிலும் ஸ்னிப் பொத்தானைத் தட்டுங்கள்.","ಚಾಟ್ ಅಥವಾ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಅಪ್‌ಲೋಡ್ ಮಾಡಲು ಯಾವುದೇ ಪರದೆಯಲ್ಲಿ ಸ್ನಿಪ್ ಬಟನ್ ಒತ್ತಿ."],
snipOnToast:["Snip added. It stays on every screen.","स्निप जुड़ गया। यह हर स्क्रीन पर रहेगा।","स्निप जोडले. ते प्रत्येक स्क्रीनवर राहील.","స్నిప్ జోడించబడింది. ఇది ప్రతి స్క్రీన్‌పై ఉంటుంది.","ஸ்னிப் சேர்க்கப்பட்டது. இது ஒவ்வொரு திரையிலும் இருக்கும்.","ಸ್ನಿಪ್ ಸೇರಿಸಲಾಗಿದೆ. ಇದು ಪ್ರತಿ ಪರದೆಯಲ್ಲೂ ಇರುತ್ತದೆ."],
snipOffToast:["Snip removed. Add it again from Home.","स्निप हटा दिया। होम से फिर जोड़ सकते हैं।","स्निप काढले. होममधून पुन्हा जोडू शकता.","స్నిప్ తీసివేయబడింది. హోమ్ నుంచి మళ్లీ జోడించవచ్చు.","ஸ்னிப் நீக்கப்பட்டது. முகப்பிலிருந்து மீண்டும் சேர்க்கலாம்.","ಸ್ನಿಪ್ ತೆಗೆಯಲಾಗಿದೆ. ಹೋಮ್‌ನಿಂದ ಮತ್ತೆ ಸೇರಿಸಬಹುದು."],

snipPop:["Keep on top of other apps","दूसरे ऐप्स के ऊपर रखें","इतर ॲप्सच्या वर ठेवा","ఇతర యాప్‌ల పైన ఉంచండి","மற்ற செயலிகளுக்கு மேல் வை","ಇತರ ಆ್ಯಪ್‌ಗಳ ಮೇಲೆ ಇಡಿ"],
snipPopFail:["This browser cannot keep Snip on top. Use Chrome or Edge on a computer.","यह ब्राउज़र स्निप को ऊपर नहीं रख सकता। कंप्यूटर पर Chrome या Edge इस्तेमाल करें।","हा ब्राउझर स्निप वर ठेवू शकत नाही. संगणकावर Chrome किंवा Edge वापरा.","ఈ బ్రౌజర్ స్నిప్‌ను పైన ఉంచలేదు. కంప్యూటర్‌లో Chrome లేదా Edge వాడండి.","இந்த உலாவியால் ஸ்னிப்பை மேலே வைக்க முடியாது. கணினியில் Chrome அல்லது Edge பயன்படுத்துங்கள்.","ಈ ಬ್ರೌಸರ್ ಸ್ನಿಪ್ ಅನ್ನು ಮೇಲೆ ಇಡಲಾರದು. ಕಂಪ್ಯೂಟರ್‌ನಲ್ಲಿ Chrome ಅಥವಾ Edge ಬಳಸಿ."],
snipStopShare:["Stop sharing screen","स्क्रीन शेयर करना बंद करें","स्क्रीन शेअर करणे थांबवा","స్క్రీన్ షేరింగ్ ఆపండి","திரைப் பகிர்வை நிறுத்து","ಪರದೆ ಹಂಚಿಕೆ ನಿಲ್ಲಿಸಿ"],
snipTipDesk:["Open WhatsApp Web or any app, tap Snip the screen, pick that window, then drag a box around the messages.","व्हाट्सऐप वेब या कोई ऐप खोलें, 'स्क्रीन स्निप करें' दबाएं, वह विंडो चुनें, फिर मैसेज के चारों ओर बॉक्स खींचें।","व्हॉट्सॲप वेब किंवा कोणतेही ॲप उघडा, 'स्क्रीन स्निप करा' दाबा, ती विंडो निवडा, मग संदेशांभोवती चौकट ओढा.","వాట్సాప్ వెబ్ లేదా ఏదైనా యాప్ తెరవండి, 'స్క్రీన్ స్నిప్ చేయండి' నొక్కి, ఆ విండో ఎంచుకుని, మెసేజ్‌ల చుట్టూ బాక్స్ లాగండి.","வாட்ஸ்அப் வெப் அல்லது ஏதேனும் செயலியைத் திறந்து, 'திரையை ஸ்னிப் செய்' தட்டி, அந்தச் சாளரத்தைத் தேர்ந்து, செய்திகளைச் சுற்றி ஒரு பெட்டியை இழுக்கவும்.","ವಾಟ್ಸಾಪ್ ವೆಬ್ ಅಥವಾ ಯಾವುದೇ ಆ್ಯಪ್ ತೆರೆಯಿರಿ, 'ಪರದೆ ಸ್ನಿಪ್ ಮಾಡಿ' ಒತ್ತಿ, ಆ ವಿಂಡೋ ಆರಿಸಿ, ನಂತರ ಸಂದೇಶಗಳ ಸುತ್ತ ಬಾಕ್ಸ್ ಎಳೆಯಿರಿ."],
snipTipPhone:["On your phone, take a screenshot of the chat, come back here and tap Choose screenshots. If DraftIt is installed, you can also share a screenshot to it.","फ़ोन पर चैट का स्क्रीनशॉट लें, यहाँ वापस आकर 'स्क्रीनशॉट चुनें' दबाएं। अगर DraftIt इंस्टॉल है, तो स्क्रीनशॉट सीधे उसे शेयर भी कर सकते हैं।","फोनवर चॅटचा स्क्रीनशॉट घ्या, इथे परत येऊन 'स्क्रीनशॉट निवडा' दाबा. DraftIt इन्स्टॉल असेल तर स्क्रीनशॉट थेट त्याला शेअरही करू शकता.","ఫోన్‌లో చాట్ స్క్రీన్‌షాట్ తీసి, ఇక్కడికి వచ్చి 'స్క్రీన్‌షాట్‌లు ఎంచుకోండి' నొక్కండి. DraftIt ఇన్‌స్టాల్ చేసి ఉంటే, స్క్రీన్‌షాట్‌ను నేరుగా దానికి షేర్ కూడా చేయవచ్చు.","போனில் அரட்டையின் திரைப்பிடிப்பை எடுத்து, இங்கே வந்து 'திரைப்பிடிப்புகளைத் தேர்ந்தெடு' தட்டுங்கள். DraftIt நிறுவப்பட்டிருந்தால், திரைப்பிடிப்பை நேரடியாக அதற்குப் பகிரவும் முடியும்.","ಫೋನ್‌ನಲ್ಲಿ ಚಾಟ್‌ನ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ತೆಗೆದು, ಇಲ್ಲಿಗೆ ಬಂದು 'ಸ್ಕ್ರೀನ್‌ಶಾಟ್‌ಗಳನ್ನು ಆರಿಸಿ' ಒತ್ತಿ. DraftIt ಇನ್‌ಸ್ಟಾಲ್ ಆಗಿದ್ದರೆ, ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಅನ್ನು ನೇರವಾಗಿ ಅದಕ್ಕೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು."],
snipNoAi:["To read the text in snips, turn on Claude AI in Settings. The picture is saved either way.","स्निप में लिखा पढ़ने के लिए सेटिंग्स में Claude AI चालू करें। फ़ोटो तो हर हाल में सेव होगी।","स्निपमधील मजकूर वाचण्यासाठी सेटिंग्जमध्ये Claude AI सुरू करा. फोटो तरीही सेव्ह होतो.","స్నిప్‌లలోని అక్షరాలు చదవడానికి సెట్టింగ్స్‌లో Claude AI ఆన్ చేయండి. చిత్రం ఎలాగైనా సేవ్ అవుతుంది.","ஸ்னிப்களில் உள்ள உரையைப் படிக்க அமைப்புகளில் Claude AI-ஐ இயக்குங்கள். படம் எப்படியும் சேமிக்கப்படும்.","ಸ್ನಿಪ್‌ಗಳಲ್ಲಿನ ಬರಹ ಓದಲು ಸೆಟ್ಟಿಂಗ್ಸ್‌ನಲ್ಲಿ Claude AI ಆನ್ ಮಾಡಿ. ಚಿತ್ರ ಹೇಗಿದ್ದರೂ ಉಳಿಯುತ್ತದೆ."],
snipNoDeal:["Make a deal first, then snips go into it.","पहले एक डील बनाएं, फिर स्निप उसमें जाएंगे।","आधी एक व्यवहार तयार करा, मग स्निप त्यात जातील.","ముందు ఒక డీల్ సృష్టించండి, తర్వాత స్నిప్‌లు అందులోకి వెళ్తాయి.","முதலில் ஒரு ஒப்பந்தத்தை உருவாக்குங்கள், பிறகு ஸ்னிப்கள் அதில் சேரும்.","ಮೊದಲು ಒಂದು ಡೀಲ್ ಮಾಡಿ, ನಂತರ ಸ್ನಿಪ್‌ಗಳು ಅದಕ್ಕೆ ಹೋಗುತ್ತವೆ."],

snipFail:["Could not upload. Try again.","अपलोड नहीं हो सका। फिर कोशिश करें।","अपलोड झाले नाही. पुन्हा प्रयत्न करा.","అప్‌లోడ్ కాలేదు. మళ్లీ ప్రయత్నించండి.","பதிவேற்ற முடியவில்லை. மீண்டும் முயலுங்கள்.","ಅಪ್‌ಲೋಡ್ ಆಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."],
snipDenied:["Screen sharing was not allowed. Try again and pick a window, or choose a screenshot instead.","स्क्रीन शेयर करने की अनुमति नहीं मिली। फिर कोशिश करें और कोई विंडो चुनें, या स्क्रीनशॉट चुनें।","स्क्रीन शेअर करण्याची परवानगी मिळाली नाही. पुन्हा प्रयत्न करून विंडो निवडा, किंवा स्क्रीनशॉट निवडा.","స్క్రీన్ షేరింగ్‌కు అనుమతి రాలేదు. మళ్లీ ప్రయత్నించి ఒక విండో ఎంచుకోండి, లేదా స్క్రీన్‌షాట్ ఎంచుకోండి.","திரைப் பகிர்வுக்கு அனுமதி கிடைக்கவில்லை. மீண்டும் முயன்று ஒரு சாளரத்தைத் தேர்ந்தெடுங்கள், அல்லது திரைப்பிடிப்பைத் தேர்ந்தெடுங்கள்.","ಪರದೆ ಹಂಚಿಕೆಗೆ ಅನುಮತಿ ಸಿಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ ಒಂದು ವಿಂಡೋ ಆರಿಸಿ, ಅಥವಾ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಆರಿಸಿ."],
snipScreenFail:["Screen snipping does not work here. Choose a screenshot instead.","यहाँ स्क्रीन स्निप नहीं होता। इसकी जगह स्क्रीनशॉट चुनें।","इथे स्क्रीन स्निप होत नाही. त्याऐवजी स्क्रीनशॉट निवडा.","ఇక్కడ స్క్రీన్ స్నిప్ పని చేయదు. బదులుగా స్క్రీన్‌షాట్ ఎంచుకోండి.","இங்கே திரை ஸ்னிப் வேலை செய்யாது. அதற்குப் பதில் திரைப்பிடிப்பைத் தேர்ந்தெடுங்கள்.","ಇಲ್ಲಿ ಪರದೆ ಸ್ನಿಪ್ ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ. ಬದಲಿಗೆ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಆರಿಸಿ."],
snipClipEmpty:["Nothing copied yet. Copy a chat or an image first.","अभी कुछ कॉपी नहीं हुआ। पहले चैट या फ़ोटो कॉपी करें।","अजून काही कॉपी केलेले नाही. आधी चॅट किंवा फोटो कॉपी करा.","ఇంకా ఏమీ కాపీ చేయలేదు. ముందు చాట్ లేదా చిత్రం కాపీ చేయండి.","இன்னும் எதுவும் நகலெடுக்கப்படவில்லை. முதலில் அரட்டை அல்லது படத்தை நகலெடுங்கள்.","ಇನ್ನೂ ಏನೂ ನಕಲಿಸಿಲ್ಲ. ಮೊದಲು ಚಾಟ್ ಅಥವಾ ಚಿತ್ರ ನಕಲಿಸಿ."],
snipClipBlocked:["The browser blocked reading what you copied. Press Ctrl+V (or long-press and Paste) while Snip is open.","ब्राउज़र ने कॉपी किया हुआ पढ़ने नहीं दिया। स्निप खुला रखते हुए Ctrl+V दबाएं (या देर तक दबाकर पेस्ट करें)।","ब्राउझरने कॉपी केलेले वाचू दिले नाही. स्निप उघडे असताना Ctrl+V दाबा (किंवा दाबून धरून पेस्ट करा).","కాపీ చేసింది చదవడానికి బ్రౌజర్ అనుమతించలేదు. స్నిప్ తెరిచి ఉండగా Ctrl+V నొక్కండి (లేదా ఎక్కువసేపు నొక్కి పేస్ట్ చేయండి).","நகலெடுத்ததைப் படிக்க உலாவி அனுமதிக்கவில்லை. ஸ்னிப் திறந்திருக்கும்போது Ctrl+V அழுத்துங்கள் (அல்லது நீண்ட நேரம் அழுத்தி ஒட்டுங்கள்).","ನಕಲಿಸಿದ್ದನ್ನು ಓದಲು ಬ್ರೌಸರ್ ಬಿಡಲಿಲ್ಲ. ಸ್ನಿಪ್ ತೆರೆದಿರುವಾಗ Ctrl+V ಒತ್ತಿ (ಅಥವಾ ಒತ್ತಿ ಹಿಡಿದು ಅಂಟಿಸಿ)."],
